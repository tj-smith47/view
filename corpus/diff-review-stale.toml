# The user edits the row the open hunk anchors to, which stales it, and the
# accept that follows the re-diff must address its columns against what they
# typed rather than against the row the proposal was computed on. The edit
# changes that row's byte length and its character length by different
# amounts, so an accept measuring it in characters writes into the middle of
# the row the user just left behind.
#
# The re-anchoring arithmetic is what this holds. The event plumbing that
# feeds it in production -- nvim's own lines event through `Msg` and
# `update()` -- is not: the driver reads the changed row back and folds the
# event shape itself, and that leg stays on the change-streaming tests.
schema = 1
name = "diff-review-stale"
input = "iünïcode<CR>two<CR>three<CR>fôur<CR>fïvé<Esc>"
engine_pin = "v0.12.4"
ext_set = "default"
diff_review = "stale-re-diff-then-accept"
