# Accept-all over two hunks, then one undo, which must leave exactly the
# text the review found. It discriminates in both directions: a review that
# wrote two undo entries instead of one keeps its first hunk after that key,
# and one that joined its first write backwards onto the user's own typing
# retracts that typing too and empties the buffer. The reference side
# reaches its one entry the way nvim's own `:undojoin` does.
#
# The undo is what this entry holds, so it is the one diff-review entry the
# byte-versus-character column arithmetic cannot fail: the write is retracted
# before the comparison. The other three carry that.
schema = 1
name = "diff-review-accept-all"
input = "iünïcode<CR>two<CR>three<CR>fôur<CR>fïvé<Esc>"
engine_pin = "v0.12.4"
ext_set = "default"
diff_review = "multi-hunk-accept-all"
