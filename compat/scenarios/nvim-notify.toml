# nvim-notify is ui-owning: it replaces vim.notify's echo-area output with
# floating notification windows it draws itself. `notifications` takes two
# things back. The attach: it detaches `ext_messages` and nothing else, so
# the `deferred` state below is where a message goes back to nvim while the
# command line stays view's -- the probes there are what hold the two
# switches to their own surfaces. And the function: enabled, view holds
# `vim.notify` at the engine default (view-native's supersede table, the
# `TakeoverKind::Notify` row), so a call through it crosses as ext_messages
# traffic and is drawn as view's own toast; nvim-notify never sees the
# message and its history never records it. That is the fact the
# `vim-notify-*` markers below discriminate on, in every state.
#
# `<leader>fm` discriminates a second thing: whether view's own
# message-history overlay (titled "Messages") is claimed at all, or,
# unclaimed, does nothing.
#
# The `notify-compat-marker` calls go through require('notify') directly
# rather than vim.notify precisely because vim.notify is contested here --
# the direct call pins nvim-notify's own rendering and history, present or
# not, independent of both noice's routing table and view's takeover.
schema = 1
plugin = "nvim-notify"
class = "ui-owning"
fixture = "heavy"

# nvim-notify's own defaults under view's own defaults: the notification
# surface as a migrating user's config actually leaves it.
[[states]]
name = "unaccommodated"
accommodations = false
native = {}
steps = [
  # Generous timeout: the first heavy scenario to run on a cold shared
  # cache pays for the full plugin clone before any plugin can load.
  { wait_for_probe = "luaeval('package.loaded.notify ~= nil')", expect = "true", timeout_ms = 180000 },
  # A cold install leaves lazy.nvim's own window holding input focus until
  # the fixture's LazyDone autocmd closes it; a keystroke sent before that
  # lands in the install window instead of the buffer.
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  # And view's own conflict notice down, before anything reads the cells
  # it stands on. This fixture loads noice, which claims surfaces view
  # owns, so a default launch here raises the sticky notice about it -- a
  # box across the top rows that is the point of that feature and is in
  # the way of this one. `<Esc>` in normal mode is its dismissal.
  # Waited for by name first: on a cold cache lazy.nvim is still
  # cloning at the first idle, so the notice can land after a
  # keystroke sent the moment the install window closes.
  { wait_for = "view: noice.nvim is using", timeout_ms = 60000 },
  { send = "<Esc>" },
  # An explicit dwell rather than nvim-notify's own five-second default:
  # view's handover toasts stand over the cells this float draws into and
  # retire a slot at a time, so a default float would be gone before the
  # grid beneath them was readable and the wait below would be racing it.
  { send = ":lua require('notify')('notify-compat-marker', nil, { timeout = 60000 })<CR>" },
  # The notification's body text rendered in the grid by nvim-notify's own
  # floating window. Without the plugin the require() fails with E5108
  # instead, so no fallback path can render this text.
  { wait_for = "notify-compat-marker", timeout_ms = 30000 },
  # The message persisting in nvim-notify's own history API is the durable
  # plugin-specific fact, independent of how long its float stands.
  { wait_for_probe = "luaeval('(function() for _, n in ipairs(require(\"notify\").history()) do if table.concat(n.message, \"\\n\"):find(\"notify%-compat%-marker\") then return \"in-history\" end end return \"absent\" end)()')", expect = "in-history", timeout_ms = 10000 },
  # The takeover, read from the plugin that would otherwise have drawn it:
  # a vim.notify call reaches view through ext_messages and is painted as
  # view's own toast, so it never enters nvim-notify's history and no
  # float is composited over view's chrome. The direct require('notify')
  # marker above is still in that history, which is what makes this an
  # assertion about routing rather than about a plugin that failed to load.
  { send = ":lua vim.notify('vim-notify-marker')<CR>" },
  { wait_for = "vim-notify-marker", timeout_ms = 15000 },
  { probe = "luaeval('(function() for _, n in ipairs(require(\"notify\").history()) do if table.concat(n.message, \"\\n\"):find(\"vim%-notify%-marker\") then return \"in-history\" end end return \"absent\" end)()')", expect = "absent" },
  # Generous for the overlay's title row specifically: view's own handover
  # toasts stack downward from the top of the grid and stand over it until
  # each retires on its own timer, one slot at a time. Nothing sweeps them
  # -- typing is not a dismissal -- so the wait outlives the stack.
  { send = "\\fm" },
  { wait_for = "Messages", timeout_ms = 30000 },
  { send = "<Esc>" },
]


[[states]]
name = "superseded"
steps = [
  # Generous timeout: the first heavy scenario to run on a cold shared
  # cache pays for the full plugin clone before any plugin can load.
  { wait_for_probe = "luaeval('package.loaded.notify ~= nil')", expect = "true", timeout_ms = 180000 },
  # A cold install leaves lazy.nvim's own window holding input focus until
  # the fixture's LazyDone autocmd closes it; a keystroke sent before that
  # lands in the install window instead of the buffer.
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  # And view's own conflict notice down, before anything reads the cells
  # it stands on. This fixture loads noice, which claims surfaces view
  # owns, so a default launch here raises the sticky notice about it -- a
  # box across the top rows that is the point of that feature and is in
  # the way of this one. `<Esc>` in normal mode is its dismissal.
  # Waited for by name first: on a cold cache lazy.nvim is still
  # cloning at the first idle, so the notice can land after a
  # keystroke sent the moment the install window closes.
  { wait_for = "view: noice.nvim is using", timeout_ms = 60000 },
  { send = "<Esc>" },
  # An explicit dwell rather than nvim-notify's own five-second default:
  # view's handover toasts stand over the cells this float draws into and
  # retire a slot at a time, so a default float would be gone before the
  # grid beneath them was readable and the wait below would be racing it.
  { send = ":lua require('notify')('notify-compat-marker', nil, { timeout = 60000 })<CR>" },
  # nvim-notify's float lands on the message area, which view owns here, so
  # view raises its own notice about it -- over the very cells the float
  # drew into, both being top-right boxes. Down goes that notice, and the
  # transient stack beside it retires on its own; only then is the grid
  # readable. The notice stays down: it is raised from a float *sighting*,
  # and nvim-notify repositions its window only while sliding, not through
  # the seconds it then stands still.
  { wait_for = "view: notify is drawing over", timeout_ms = 15000 },
  { send = "<Esc>" },
  # The notification's body text rendered in the grid by nvim-notify's own
  # floating window. Without the plugin the require() fails with E5108
  # instead, so no fallback path can render this text.
  { wait_for = "notify-compat-marker", timeout_ms = 30000 },
  # The message persisting in nvim-notify's own history API is the durable
  # plugin-specific fact, independent of how long its float stands.
  { wait_for_probe = "luaeval('(function() for _, n in ipairs(require(\"notify\").history()) do if table.concat(n.message, \"\\n\"):find(\"notify%-compat%-marker\") then return \"in-history\" end end return \"absent\" end)()')", expect = "in-history", timeout_ms = 10000 },
  # The takeover, read from the plugin that would otherwise have drawn it:
  # a vim.notify call reaches view through ext_messages and is painted as
  # view's own toast, so it never enters nvim-notify's history and no
  # float is composited over view's chrome. The direct require('notify')
  # marker above is still in that history, which is what makes this an
  # assertion about routing rather than about a plugin that failed to load.
  { send = ":lua vim.notify('vim-notify-marker')<CR>" },
  { wait_for = "vim-notify-marker", timeout_ms = 15000 },
  { probe = "luaeval('(function() for _, n in ipairs(require(\"notify\").history()) do if table.concat(n.message, \"\\n\"):find(\"vim%-notify%-marker\") then return \"in-history\" end end return \"absent\" end)()')", expect = "absent" },
  # Generous for the overlay's title row specifically: view's own handover
  # toasts stack downward from the top of the grid and stand over it until
  # each retires on its own timer, one slot at a time. Nothing sweeps them
  # -- typing is not a dismissal -- so the wait outlives the stack.
  { send = "\\fm" },
  { wait_for = "Messages", timeout_ms = 30000 },
  { send = "<Esc>" },
]

[[states]]
name = "deferred"
native = { notifications = false }
steps = [
  { wait_for_probe = "luaeval('package.loaded.notify ~= nil')", expect = "true", timeout_ms = 180000 },
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  # And view's own conflict notice down, before anything reads the cells
  # it stands on. This fixture loads noice, which claims surfaces view
  # owns, so a default launch here raises the sticky notice about it -- a
  # box across the top rows that is the point of that feature and is in
  # the way of this one. `<Esc>` in normal mode is its dismissal.
  # Waited for by name first: on a cold cache lazy.nvim is still
  # cloning at the first idle, so the notice can land after a
  # keystroke sent the moment the install window closes.
  { wait_for = "view: noice.nvim is using", timeout_ms = 60000 },
  { send = "<Esc>" },
  # One switch takes one surface: the message area goes back to nvim while
  # the command line stays externalized, which is the granularity a single
  # session-wide ext set could not express.
  { probe = "luaeval('tostring(vim.api.nvim_list_uis()[1].ext_messages == true)')", expect = "false" },
  { probe = "luaeval('tostring(vim.api.nvim_list_uis()[1].ext_cmdline == true)')", expect = "true" },
  { send = ":lua require('notify')('notify-compat-marker')<CR>" },
  { wait_for = "notify-compat-marker", timeout_ms = 15000 },
  { wait_for_probe = "luaeval('(function() for _, n in ipairs(require(\"notify\").history()) do if table.concat(n.message, \"\\n\"):find(\"notify%-compat%-marker\") then return \"in-history\" end end return \"absent\" end)()')", expect = "in-history", timeout_ms = 10000 },
  # The other half of the takeover pair: with the feature off, vim.notify
  # is left wherever this fixture's plugins put it, so the same call the
  # superseded state proves view absorbs reaches nvim-notify and is
  # recorded by it.
  { send = ":lua vim.notify('vim-notify-marker')<CR>" },
  { wait_for = "vim-notify-marker", timeout_ms = 15000 },
  { wait_for_probe = "luaeval('(function() for _, n in ipairs(require(\"notify\").history()) do if table.concat(n.message, \"\\n\"):find(\"vim%-notify%-marker\") then return \"in-history\" end end return \"absent\" end)()')", expect = "in-history", timeout_ms = 10000 },
  # native.notifications = false hands `<leader>fm` back unclaimed; the
  # fixture never binds it either, so the send below is a genuine no-op --
  # the assert below is the negative half of the pair the superseded
  # state's own "Messages" appearance proves the positive half of.
  { send = "\\fm" },
  { assert_absent = "Messages" },
]

[[states]]
name = "native-only"
fixture = "minimal"
steps = [
  { send = "\\fm" },
  # The minimal fixture has no plugin to intercept vim.notify at all, so
  # this is the one state that shows view's own history overlay with
  # nothing routed through a plugin first. The send above is also this
  # launch's first keystroke, which ends the startup hold and puts every
  # entry it parked onto the stack -- so the title this waits for opens
  # underneath that stack and is readable only as it retires.
  { wait_for = "Messages", timeout_ms = 30000 },
  { send = "<Esc>" },
]
