# nvim-tree is ui-owning: it draws a file-explorer sidebar as a regular
# window in the grid. `tree` is a mapping-only supersession (see
# view-native's supersede module: the takeover table has one row and it is
# not this one) -- opening `:NvimTreeOpen<CR>` directly always works in every
# state, so the fact each state actually discriminates on is `<leader>e`:
# whether that key opens view's own sidebar or falls through to whatever
# (nothing, in this fixture) the plugin left it bound to. `NvimTree` never
# appears in `nvim_list_wins()` when view's own sidebar is what opened,
# because that sidebar is drawn client-side, not as an nvim window.
schema = 1
plugin = "nvim-tree"
class = "ui-owning"
fixture = "heavy"

[[states]]
name = "superseded"
steps = [
  # Generous timeout: the first heavy scenario to run on a cold shared
  # cache pays for the full plugin clone before any plugin can load.
  { wait_for_probe = "luaeval('package.loaded[\"nvim-tree\"] ~= nil')", expect = "true", timeout_ms = 180000 },
  # A cold install leaves lazy.nvim's own window holding input focus until
  # the fixture's LazyDone autocmd closes it; a keystroke sent before that
  # lands in the install window instead of the buffer.
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  # Backslash is nvim's default leader; the fixture leaves it unchanged.
  { send = "\\e" },
  # lazy-lock.json lives only in the fixture directory the harness now
  # launches view from (see oracle.rs's `cmd.cwd`), so this pins the
  # native sidebar actually rendering that directory's listing.
  { wait_for = "lazy-lock.json", timeout_ms = 15000 },
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"NvimTree\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 5000 },
]

[[states]]
name = "deferred"
native = { tree = false }
steps = [
  { wait_for_probe = "luaeval('package.loaded[\"nvim-tree\"] ~= nil')", expect = "true", timeout_ms = 180000 },
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  # native.tree = false hands `<leader>e` back unclaimed; the fixture never
  # binds it either, so pressing it here must not draw view's own sidebar --
  # the negative half of the pair the superseded state's own
  # "lazy-lock.json" appearance proves the positive half of.
  { send = "\\e" },
  { assert_absent = "lazy-lock.json" },
  # the plugin returns through its own command instead, exactly as a user
  # who turned the takeover off would still invoke it.
  { send = ":NvimTreeOpen<CR>" },
  { wait_for = "lazy-lock.json", timeout_ms = 15000 },
  { probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"NvimTree\" then return \"open\" end end return \"closed\" end)()')", expect = "open" },
]

[[states]]
name = "native-only"
fixture = "minimal"
steps = [
  { send = "\\e" },
  # The minimal fixture ships only init.lua -- no lazy-lock.json, no
  # plugins -- so its own name is the one marker this state can assert
  # that isn't shared with the plugin-present states above.
  { wait_for = "init.lua", timeout_ms = 15000 },
]
