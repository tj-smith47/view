# nvim-cmp is semantic: it computes completion candidates and offers them
# through its own floating menu. The fixture wires the cmp-buffer source,
# so typing a prefix of a word that already exists in the buffer must
# produce that word as a candidate -- content that is fully determined by
# what this scenario itself typed moments earlier.
schema = 1
plugin = "nvim-cmp"
class = "semantic"
fixture = "heavy"

[[states]]
name = "present"
# Every step below the cmdline arming reads a session that handed nvim the
# command line back: cmp's own menu window left standing, and no palette to
# absorb it. The fixture no longer commits that -- a `[native]` switch that
# detaches an `ext_*` surface changes the protocol every row over it is
# measured against, which is a fixture's business to stay out of -- so the
# state that means to measure it asks for it here.
native = { picker = false, tree = false, statusline = false, notifications = false, palette = false }
steps = [
  # Generous timeout: the first heavy scenario to run on a cold shared
  # cache pays for the full plugin clone before any plugin can load.
  { wait_for_probe = "luaeval('package.loaded.cmp ~= nil')", expect = "true", timeout_ms = 180000 },
  # A cold install leaves lazy.nvim's own window holding input focus until
  # the fixture's LazyDone autocmd closes it; a keystroke sent before that
  # lands in the install window instead of the buffer.
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  # Seed the buffer with a word no other screen content contains, then
  # start a fresh line for the prefix.
  { send = "iprefabricated<CR>" },
  # The prefix is typed one keystroke per step, a probe between each:
  # cmp's TextChangedI handler treats a cursor jump of more than one
  # column between events as paste-like input and suppresses
  # autocomplete (observed against plain nvim too, not view-specific),
  # so a single burst pty write never opens the menu. The interleaved
  # probes pace the keys the way real typing arrives, and assert the
  # session stays in insert mode while they do it.
  { send = "p" },
  { probe = "mode()", expect = "i" },
  { send = "r" },
  { probe = "mode()", expect = "i" },
  { send = "e" },
  { probe = "mode()", expect = "i" },
  { send = "f" },
  { wait_for_probe = "luaeval('require(\"cmp\").visible()')", expect = "true", timeout_ms = 15000 },
  # The seeded word offered as an actual candidate from the buffer
  # source -- menu visibility alone would also hold for an empty or
  # unrelated candidate list.
  { wait_for_probe = "luaeval('(function() for _, e in ipairs(require(\"cmp\").get_entries()) do if e.completion_item.label == \"prefabricated\" then return \"offered\" end end return \"absent\" end)()')", expect = "offered", timeout_ms = 10000 },
  { send = "<Esc>" },
  # a translation regression in <Esc> handling would otherwise still pass
  # this scenario: with no real key press sent, mode() stays "i" while
  # the assertions above keep passing
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
  { probe = "luaeval('require(\"cmp\").visible()')", expect = "false" },
  # The other place this plugin completes, under the override this state
  # declares: `[native] palette = false` leaves ext_cmdline and
  # ext_popupmenu with nvim, so the command line is nvim's own row and
  # cmp's cmdline menu is a plain float over the grid view paints. A
  # completion plugin asserted in insert mode alone leaves that path
  # untested in both directions -- that the menu renders at all, and that
  # view takes nothing from a surface it was handed back.
  #
  # The fixture configures cmp for insert mode only, so the cmdline sources
  # are armed here the way docs/surface-float-wire-capture.md records the
  # capture arming them: the pinned plugin's own `cmp.setup.cmdline`, with
  # the buffer source standing in for cmp-cmdline.
  { probe = "luaeval('(function() local cmp = require(\"cmp\") cmp.setup.cmdline(\":\", { mapping = cmp.mapping.preset.cmdline(), sources = { { name = \"buffer\" } } }) return \"armed\" end)()')", expect = "armed" },
  # One key per send, the pacing this file documents above: cmp reads a
  # cursor jump of more than a column between CmdlineChanged events as
  # paste-like input and opens no menu for it.
  { send = ":" },
  { send = "e" },
  { send = " " },
  { send = "p" },
  { send = "r" },
  { send = "e" },
  { wait_for_probe = "luaeval('require(\"cmp\").visible()')", expect = "true", timeout_ms = 15000 },
  # The word this state seeded on its first line, offered for the prefix
  # typed at the command line and drawn by cmp's own menu: label, two-space
  # gutter, kind column, as the capture records the rows. The buffer line
  # behind the menu reads `prefabricated` too, so the kind column is what
  # parts the candidate from the text it completes.
  { wait_for = "prefabricated  Text", timeout_ms = 15000 },
  # And view left the window standing: with the command line handed back
  # there is no surface to absorb, so the walk that reads "hidden" once view
  # owns the command line has to read "showing" here.
  { probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"cmp_menu\" then if vim.api.nvim_win_get_config(w).hide == true then return \"hidden\" end return \"showing\" end end return \"none\" end)()')", expect = "showing" },
  # Nor is there a palette: view draws no command line in this state, so the
  # query line it would head one with cannot be on screen.
  { assert_absent = "> :e pre" },
  { send = "<Esc>" },
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
]

# The same plugin under view's own defaults, where the completion menu
# stops being only a semantic question: with `native = {}` view owns the
# command line, and the pinned cmp draws its cmdline menu on the grid's
# last rows -- over the palette view painted there. view answers that the
# way it answers every float over a surface it draws: the window keeps
# drawing, view names it by what the window calls itself, and the notice
# carries the `view.toml` line that hands the command line back. The
# `present` state above is that remedy applied, so the pair is what a user
# reads and what the user does about it.
#
# Insert mode is the negative half: nvim's own completion menu rides
# `ext_popupmenu`, so it is already view's and there is no float to name.
[[states]]
name = "unaccommodated"
accommodations = false
native = {}
steps = [
  # Generous timeout: the first heavy scenario to run on a cold shared
  # cache pays for the full plugin clone before any plugin can load.
  { wait_for_probe = "luaeval('package.loaded.cmp ~= nil')", expect = "true", timeout_ms = 180000 },
  # A cold install leaves lazy.nvim's own window holding input focus until
  # the fixture's LazyDone autocmd closes it; a keystroke sent before that
  # lands in the install window instead of the buffer.
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  # The fixture pins nvim-cmp with cmp-buffer as its only source and
  # configures insert mode alone, so no cmdline float exists until one is
  # asked for. This is the pinned plugin's own cmdline setup, the same
  # call docs/surface-float-wire-capture.md records making, with the
  # buffer source standing in for cmp-cmdline: same view layer, same
  # window machinery, only the candidates differ.
  { probe = "luaeval('(function() local cmp = require(\"cmp\") cmp.setup.cmdline(\":\", { mapping = cmp.mapping.preset.cmdline(), sources = { { name = \"buffer\" } } }) return \"armed\" end)()')", expect = "armed" },
  # Two words sharing a prefix, so the buffer source has something to
  # offer both in the buffer and at the cmdline.
  #
  # Placed rather than typed: Ctrl-C flushes nvim's unconsumed typeahead,
  # so a burst with `<C-c>` behind it can lose its tail and seed a
  # different candidate list every run.
  { probe = "luaeval('(function() vim.api.nvim_buf_set_lines(0, 0, -1, false, { \"prefabricated preflight\" }) return \"seeded\" end)()')", expect = "seeded" },
  # First the negative control from the same plugin: cmp's insert-mode
  # menu opens beside the cursor, claims nothing, and must stay unnamed.
  # A detector that fired on "a float from a plugin" rather than on the
  # rect it occupies would already have named this window below. The
  # needle is cmp's own identity, not the notice family: this fixture's
  # noice raises its health float over the message area in this state
  # too, and that notice is a true one about a different plugin.
  { send = "o" },
  { send = "p" },
  { probe = "mode()", expect = "i" },
  { send = "r" },
  { probe = "mode()", expect = "i" },
  { send = "e" },
  # a fourth key, exactly as the `present` state types one: cmp reads a
  # TextChangedI whose cursor moved more than a column as paste-like and
  # suppresses the menu for it, and on a loaded host the probes between
  # these sends are not always enough to keep every keystroke under that
  # bar. The next key re-opens the question, so a run that lost one has a
  # second chance rather than a 15s wait on a menu cmp already declined
  { probe = "mode()", expect = "i" },
  { send = "f" },
  { wait_for_probe = "luaeval('require(\"cmp\").visible()')", expect = "true", timeout_ms = 15000 },
  { assert_absent = "cmp_menu is drawing over" },
  # `<C-c>` rather than `<Esc>` for this mode exit: `<Esc>` is also the
  # dismissal of a standing sticky notice, and the noice line asserted
  # further down has to still be up when cmp's own line would have joined
  # it. Both leave insert mode, which is all this step is for.
  { send = "<C-c>" },
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
  # Now the claim. Keys go one per send for the same reason the present
  # state paces them: cmp reads a multi-column jump between CmdlineChanged
  # events as paste-like input and never opens the menu for it.
  { send = ":" },
  { send = "e" },
  { send = " " },
  { send = "p" },
  { send = "r" },
  { send = "e" },
  # The window itself, asked of the engine rather than of the screen: cmp's
  # menu exists (so the plugin really did offer candidates for this
  # cmdline) and draws. "none" here would be a menu that never opened,
  # which is a different failure from one view left standing, so the two
  # are not collapsed into one needle.
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"cmp_menu\" then if vim.api.nvim_win_get_config(w).hide == true then return \"hidden\" end return \"showing\" end end return \"none\" end)()')", expect = "showing", timeout_ms = 15000 },
  # Both boxes on screen at once, which is the whole reading of this state:
  # view's own command line carrying the query, and cmp's window under it
  # carrying the candidates it rendered itself. cmp writes every candidate
  # with a kind column (`Text` for a word from the buffer source -- see the
  # captured rows in docs/surface-float-wire-capture.md), and the two-space
  # gutter is what parts that row from the buffer line reading
  # `prefabricated preflight` on the same screen. The candidate labels this
  # scenario types into are deliberately not named: cmp-buffer re-indexes
  # the buffer as the keys land, so how far through one of them a run has
  # got differs between runs. The word placed by the seeding step is not
  # one of those -- it is in the buffer before any of this state's keys are
  # typed, so it is a candidate for `pre` in every run.
  { wait_for = "> :e pre", timeout_ms = 15000 },
  { wait_for = "prefabricated  Text", timeout_ms = 15000 },
  # And the notice a user reads about it, named by what the window calls
  # itself and carrying the line that ends the overlap. The `present` state
  # above is that line applied.
  { wait_for = "cmp_menu is drawing over the command line", timeout_ms = 15000 },
  { wait_for = "Set [native] palette = false in view.toml to give it back", timeout_ms = 5000 },
  # Not the anonymous wording: a window that names itself is named, and
  # nothing else on this row claims it.
  { assert_absent = "a plugin is drawing over the command line" },
  { send = "<Esc>" },
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
  { assert_absent = "> pre" },
  # The teardown: cmp closes its cmdline menu from inside its own
  # `CmdlineLeave` handler, so a second command line opening onto none of
  # the first one's rows is what proves the window went with it.
  #
  # `zqx` is the capture's own no-candidate prefix: cmp opens no window for
  # it at all, so a kind column on screen here would be the last session's.
  { send = ":" },
  { send = "e" },
  { send = " " },
  { send = "z" },
  { send = "q" },
  { send = "x" },
  { wait_for = "> :e zqx", timeout_ms = 15000 },
  { assert_absent = "Text" },
  { send = "<Esc>" },
]
