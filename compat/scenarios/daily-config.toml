# Mandatory daily-config scenario: the standing scenario that runs against
# the nvim config on this machine, so this is the one scenario in the suite
# with no `fixture` field. resolve_fixture picks the config:
#
#   VIEW_DAILY_CONFIG=/path   that directory (an error with no init.lua or
#                             init.vim in it)
#   VIEW_DAILY_CONFIG=off/""  SKIPPED: the leg is switched off
#   unset                     the config nvim itself loads
#                             ($XDG_CONFIG_HOME or ~/.config, then
#                             $NVIM_APPNAME or nvim); SKIPPED naming that
#                             path when it holds no init.lua or init.vim
#   any, on a non-Unix host   SKIPPED: the config is linked in by symlink
#
# A hosted CI runner has no config of its own, so the row reads SKIPPED
# there; the heavy fixture stands in for a real plugin-heavy config. The
# config this harness does not own has no `serverstart` call of its own, so
# the driver primes the probe channel itself by typing
# `:call serverstart($VIEW_COMPAT_SOCK)<CR>` into the pty
# (CompatSession::prime_probe_channel) before running these steps.
#
# Steps stay config-agnostic (no assertion about any specific plugin being
# loaded), since the config's plugin set is unknown to this harness and can
# change independently of this scenario file.
schema = 1
plugin = "daily-config"
class = "semantic"

[[states]]
name = "present"
steps = [
  # a daily config's startup screen is unknown ground: a dashboard, a file
  # tree, or notification popups can own the window the editor opens into,
  # where typed text either triggers mappings or lands in a buffer the
  # screen never shows. A fresh empty buffer is the one editable surface
  # every config can be brought to without naming any plugin.
  { send = ":enew<CR>" },
  { send = "ihello from daily-config<Esc>" },
  # a translation regression in <Esc> handling would otherwise still pass
  # this scenario: with no real key press sent, mode() stays "i" while
  # every substring assertion below keeps passing against the literal text
  { probe = "mode()", expect = "n" },
  { wait_for = "hello from daily-config", timeout_ms = 5000 },
  { assert_absent = "E5108" },
  { probe = "1+1", expect = "2" },
]

# The present state again under the tiled layout, where the fresh buffer
# opens in a framed tile.
[[states]]
name = "present"
panes = "tiles"
steps = [
  { send = ":enew<CR>" },
  { send = "ihello from daily-config<Esc>" },
  { probe = "mode()", expect = "n" },
  { wait_for = "hello from daily-config", timeout_ms = 30000 },
  { assert_absent = "E5108" },
  { probe = "1+1", expect = "2" },
]
