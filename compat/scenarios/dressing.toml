# dressing is ui-owning: it replaces vim.ui.input's blocking command-line
# prompt with a floating input window it draws itself. No entry in the
# `[native]` registry supersedes `vim.ui.input` (confirmed against
# view-native's supersede module and the mapping table: neither carries a
# row for it), so the dressing-specific assertions in the superseded and
# deferred states below are identical on purpose, and that equality is
# itself the fact being proven, not an oversight. The prompt string doubles
# as the grid marker: dressing renders it as the float's border title, and
# without the plugin the same call falls back to nvim's own blocking
# `input()`, whose prompt still lands on screen either way: through
# `ext_cmdline` for a state that left `palette` on, and drawn by nvim into
# the last grid row for one that turned it off.
# The deferred state's `native` table does turn every feature off at the
# config level even though dressing itself can't observe that; this
# fixture also carries lualine, so column 85 of the statusline row (the
# same discriminator lualine.toml uses) still differs between the two
# states, and asserting it here is what stops a runner bug that silently
# ignores the `native` table from passing both states by coincidence.
schema = 1
plugin = "dressing"
class = "ui-owning"
fixture = "heavy"

# dressing's own defaults under view's own defaults: the vim.ui.input
# surface as a migrating user's config actually leaves it.
[[states]]
name = "unaccommodated"
accommodations = false
native = {}
steps = [
  # Generous timeout: the first heavy scenario to run on a cold shared
  # cache pays for the full plugin clone before any plugin can load.
  { wait_for_probe = "luaeval('package.loaded.dressing ~= nil')", expect = "true", timeout_ms = 180000 },
  # A cold install leaves lazy.nvim's own window holding input focus until
  # the fixture's LazyDone autocmd closes it; a keystroke sent before that
  # lands in the install window instead of the buffer.
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  { send = ":lua vim.ui.input({ prompt = 'dressing-prompt' }, function() end)<CR>" },
  { wait_for = "dressing-prompt", timeout_ms = 15000 },
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"DressingInput\" then return \"open\" end end return \"closed\" end)()')", expect = "open", timeout_ms = 10000 },
  # dressing opens its input float in insert mode; the first <Esc> drops
  # to normal mode inside the float, the second dismisses it.
  { send = "<Esc>" },
  # a translation regression in <Esc> handling would otherwise still pass
  # this scenario: with no real key press sent, the session stays in the
  # input float's insert mode while later assertions keep passing
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
  { send = "<Esc>" },
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"DressingInput\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 5000 },
  # config-level cross-check, not a dressing behavior: native wins here, so
  # row 29 stays the statusline row and lualine's own separator glyph never
  # reaches column 85 (see lualine.toml).
  { assert_cell_not = { row = 29, col = 85, glyph = "" } },
]


[[states]]
name = "superseded"
steps = [
  # Generous timeout: the first heavy scenario to run on a cold shared
  # cache pays for the full plugin clone before any plugin can load.
  { wait_for_probe = "luaeval('package.loaded.dressing ~= nil')", expect = "true", timeout_ms = 180000 },
  # A cold install leaves lazy.nvim's own window holding input focus until
  # the fixture's LazyDone autocmd closes it; a keystroke sent before that
  # lands in the install window instead of the buffer.
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  { send = ":lua vim.ui.input({ prompt = 'dressing-prompt' }, function() end)<CR>" },
  { wait_for = "dressing-prompt", timeout_ms = 15000 },
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"DressingInput\" then return \"open\" end end return \"closed\" end)()')", expect = "open", timeout_ms = 10000 },
  # dressing opens its input float in insert mode; the first <Esc> drops
  # to normal mode inside the float, the second dismisses it.
  { send = "<Esc>" },
  # a translation regression in <Esc> handling would otherwise still pass
  # this scenario: with no real key press sent, the session stays in the
  # input float's insert mode while later assertions keep passing
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
  { send = "<Esc>" },
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"DressingInput\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 5000 },
  # config-level cross-check, not a dressing behavior: native wins here, so
  # row 29 stays the statusline row and lualine's own separator glyph never
  # reaches column 85 (see lualine.toml).
  { assert_cell_not = { row = 29, col = 85, glyph = "" } },
]

[[states]]
name = "deferred"
native = { picker = false, tree = false, statusline = false, notifications = false, palette = false }
steps = [
  { wait_for_probe = "luaeval('package.loaded.dressing ~= nil')", expect = "true", timeout_ms = 180000 },
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  { send = ":lua vim.ui.input({ prompt = 'dressing-prompt' }, function() end)<CR>" },
  { wait_for = "dressing-prompt", timeout_ms = 15000 },
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"DressingInput\" then return \"open\" end end return \"closed\" end)()')", expect = "open", timeout_ms = 10000 },
  { send = "<Esc>" },
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
  { send = "<Esc>" },
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"DressingInput\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 5000 },
  # config-level cross-check, not a dressing behavior: native.statusline is
  # off here, so lualine's own setup() keeps laststatus and paints its
  # separator glyph into column 85 (see lualine.toml).
  #
  # Row 28, not the last row 29 lualine.toml asserts: this state also turns
  # palette and notifications off, which detaches ext_cmdline and
  # ext_messages, so view leaves `cmdheight` alone and nvim keeps the last
  # row for its own command line. The statusline sits above it.
  { probe = "luaeval('tostring(vim.o.cmdheight)')", expect = "1" },
  { wait_for_cell = { row = 28, col = 85, expected = "" }, timeout_ms = 5000 },
]

[[states]]
name = "native-only"
fixture = "minimal"
steps = [
  { send = ":lua vim.ui.input({ prompt = 'dressing-prompt' }, function() end)<CR>" },
  # Without dressing, vim.ui.input falls back to nvim's own blocking
  # input(), captured through ext_cmdline the same way a `:` command is;
  # the prompt text still reaches the screen through that path.
  { wait_for = "dressing-prompt", timeout_ms = 15000 },
  { send = "<Esc>" },
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
]
