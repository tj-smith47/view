# noice is ui-owning in spirit (it exists to take over cmdline, messages,
# and the completion popup) but view's defaults externalize all three of
# those surfaces, and noice refuses to claim a surface the attached GUI
# has externalized. The fixture therefore runs noice in its own supported
# GUI configuration -- cmdline/messages/popupmenu components off -- and
# the default states assert on the part of noice that still owns UI there:
# its message router, which intercepts vim.notify and both records the
# message in noice's own history and displays it through the nvim-notify
# backend.
#
# `notifications` takes two things: the attach, and `vim.notify` itself.
# The attach -- `palette = false` detaches ext_cmdline and ext_popupmenu,
# `notifications = false` detaches ext_messages, so the `deferred` state
# below hands noice back every surface it asks for and the
# `nvim_list_uis()` probes there are the direct evidence. And the
# function: enabled, view holds `vim.notify` at the engine default
# (view-native's supersede table, the `TakeoverKind::Notify` row), so
# noice's message router stops receiving the calls it exists to intercept
# and the message is drawn as view's own toast instead. That is the one
# thing that differs between `superseded` and `deferred` here beyond the
# attach, and both states assert it from noice's own manager history. `cmdheight`
# reads 0 there, and not from view: view zeroes it only for a session that
# took both the cmdline and the messages, which the same two switches deny
# (`dressing`/`fidget` deferred run those switches with noice's components
# off and read 1). It is noice taking the surface that zeroes it -- its
# message component calls `vim.ui_attach` with `ext_messages`, and the
# pinned engine sets `cmdheight = 0` for a Lua UI that asks for messages
# (v0.12.4, reproduced headless). noice writes the option itself nowhere:
# its one mention, lua/noice/message/router.lua:245, is commented out.
#
# `<leader>fm` discriminates a second thing: whether view's own
# message-history overlay (titled "Messages") is claimed at all, or,
# unclaimed, does nothing.
schema = 1
plugin = "noice"
class = "ui-owning"
fixture = "heavy"

# The first launch of record: noice exactly as its own README configures it,
# under view's own defaults. Every string asserted below that belongs to
# noice is reproduced from the pinned source this fixture installs
# (compat/.cache/<lockfile hash>/nvim/lazy/noice.nvim at commit 7bfd9424) --
# lua/noice/health.lua builds "You're using a GUI that uses <ext>. Noice
# can't work when the GUI has <ext> enabled." once per externalized ext, and
# lua/noice/config/init.lua defines is_running().
[[states]]
name = "unaccommodated"
accommodations = false
native = {}
steps = [
  { wait_for_probe = "luaeval('package.loaded.noice ~= nil')", expect = "true", timeout_ms = 180000 },
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  # What a defaults user must see: view's own single notice, carrying the
  # exact key that hands the surface back. Two needles because the notice
  # is two rows -- the message layer clips at the grid's width less two
  # rather than wrapping, so the remedy is put on its own line.
  { wait_for = "noice.nvim is using the command line and the message area", timeout_ms = 30000 },
  { wait_for = "Set [native] palette = false and [native] notifications = false", timeout_ms = 5000 },
  { wait_for = "in view.toml to give them back", timeout_ms = 5000 },
  { wait_for = "Startup messages from this launch are in the history", timeout_ms = 5000 },
  # The three health errors themselves. Positive half: every one of them
  # reached the user, drawn by nvim-notify's own float --
  # `noice/util/init.lua`'s `M.notify` calls `require("notify").notify`
  # directly whenever nvim-notify is present, so they never cross view's
  # `vim.notify` takeover at all. Asked of nvim-notify's own history rather
  # than of the screen, because that float retires itself on a timer and a
  # screen needle would be racing it.
  { wait_for_probe = "luaeval('(function() local ok, n = pcall(require, \"notify\") if not ok then return \"no-mod\" end for _, rec in ipairs(n.history()) do for _, line in ipairs(rec.message or {}) do if line:find(\"work when the GUI has\", 1, true) then return \"raised\" end end end return \"absent\" end)()')", expect = "raised", timeout_ms = 60000 },
  # Negative half: not one of them is on view's own stack, read off the
  # difference in how the two things leave. nvim-notify's floats retire
  # themselves on a timer; an error routed through view is a persistent kind
  # (`MessageEntry::is_persistent_kind`) and would still be standing here for
  # the rest of the launch. So: wait until nvim holds no floating window at
  # all -- the lazy install window is already closed above, and every float
  # left on this launch is nvim-notify's -- and then the errors are gone from
  # the screen while the box the user is left reading is view's notice alone.
  { wait_for_probe = "luaeval('(function() local n = 0 for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.api.nvim_win_get_config(w).relative ~= \"\" then n = n + 1 end end return tostring(n) end)()')", expect = "0", timeout_ms = 30000 },
  { assert_absent = "Noice can't work when the GUI has" },
  { wait_for = "noice.nvim is using the command line and the message area", timeout_ms = 5000 },
  # The composition, on the other thing that whole launch produces: the
  # error float itself. view's float detector sights it over the message
  # area carrying no usable name, and that unnamed sighting is absorbed by
  # the claimant notice above rather than standing beside it -- one notice
  # per plugin, however many ways view noticed the same one. (A whole
  # unaccommodated launch produces zero `msg_show` events, which is why the
  # detector is the only thing view has to compose here; see
  # docs/toast-routing-wire-capture.md.)
  { assert_absent = "a plugin is drawing over" },
  # And the same rule for a float that does carry a name, when the name is
  # noice's own: every window noice opens presents `filetype = "noice"`
  # (`lua/noice/view/nui.lua:41`), which is one plugin, not two.
  { assert_absent = "view: noice is drawing over" },
  # And the history the notice's own third line points at is one key away,
  # holding what view recorded of this launch. The generous timeout is for
  # the overlay's title row specifically: view's own startup handover toasts
  # stack downward from the top of the grid and stand over it until each
  # retires on its own timer, one slot at a time. Nothing sweeps them --
  # typing is not a dismissal -- so the wait outlives the stack rather than
  # racing it.
  { send = "\\fm" },
  { wait_for = "Messages", timeout_ms = 30000 },
  { send = "<Esc>" },
]

[[states]]
name = "superseded"
steps = [
  # The positive control for the `deferred` state's attach probes: view's
  # own defaults externalize the cmdline, so this is the session noice's
  # health check complains about.
  { probe = "luaeval('tostring(vim.api.nvim_list_uis()[1].ext_cmdline == true)')", expect = "true" },
  { probe = "luaeval('tostring(vim.api.nvim_list_uis()[1].ext_messages == true)')", expect = "true" },
  # ext_popupmenu rides the same default attach; nothing else in the suite
  # asserts it ON, so a dropped attach flag would fail nothing without this.
  { probe = "luaeval('tostring(vim.api.nvim_list_uis()[1].ext_popupmenu == true)')", expect = "true" },
  # noice defers its real setup until after VimEnter, so package.loaded
  # alone is not proof the router is running; is_running() only reports
  # true once the deferred load actually completed. Generous timeout: the
  # first heavy scenario to run on a cold shared cache pays for the full
  # plugin clone before any plugin can load.
  { wait_for_probe = "luaeval('package.loaded.noice ~= nil and require(\"noice.config\").is_running()')", expect = "true", timeout_ms = 180000 },
  # A cold install leaves lazy.nvim's own window holding input focus until
  # the fixture's LazyDone autocmd closes it; a keystroke sent before that
  # lands in the install window instead of the buffer.
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  { send = ":lua vim.notify('noice-compat-marker')<CR>" },
  # The message reaches the grid either way -- as view's own toast here,
  # as noice's nvim-notify float in the deferred state below -- so grid
  # presence says nothing about who drew it on its own.
  { wait_for = "noice-compat-marker", timeout_ms = 15000 },
  # Who drew it, read from noice: view holds vim.notify at the engine
  # default, so noice's router never receives this call and its own
  # manager history never records it. The deferred state below runs the
  # identical probe against `notifications = false` and reads "routed",
  # which is what makes this pair an assertion about the takeover rather
  # than about a noice that failed to start (is_running() above already
  # proves it did).
  { probe = "luaeval('(function() local ok, m = pcall(require, \"noice.message.manager\") if not ok then return \"no-mod\" end local msgs = m.get({ event = \"notify\" }, { history = true }) for _, msg in ipairs(msgs) do if tostring(msg:content()):find(\"noice%-compat%-marker\") then return \"routed\" end end return \"absent\" end)()')", expect = "absent" },
  # Generous for the same reason as the unaccommodated state's own read of
  # this title: the toast stack standing over the overlay's top border
  # retires a slot at a time, and no keystroke shortens that.
  { send = "\\fm" },
  { wait_for = "Messages", timeout_ms = 30000 },
  { send = "<Esc>" },
]

# The remedy the unaccommodated state's notice points at, proven on the same
# unadjusted config: turning the two features off is what a user actually
# does, and it has to work without the fixture having pre-adapted anything.
[[states]]
name = "deferred"
accommodations = false
native = { palette = false, notifications = false }
steps = [
  { wait_for_probe = "luaeval('package.loaded.noice ~= nil and require(\"noice.config\").is_running()')", expect = "true", timeout_ms = 180000 },
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  # What the two switches did to the attach, asked of nvim rather than
  # inferred from noice staying quiet: these three are the surfaces the
  # remedy hands back, and they are why the complaints below never come.
  { probe = "luaeval('tostring(vim.api.nvim_list_uis()[1].ext_cmdline == true)')", expect = "false" },
  { probe = "luaeval('tostring(vim.api.nvim_list_uis()[1].ext_popupmenu == true)')", expect = "false" },
  { probe = "luaeval('tostring(vim.api.nvim_list_uis()[1].ext_messages == true)')", expect = "false" },
  # And the two that follow no switch: the grid protocol, and a tabline no
  # native feature owns.
  { probe = "luaeval('tostring(vim.api.nvim_list_uis()[1].ext_linegrid == true)')", expect = "true" },
  { probe = "luaeval('tostring(vim.api.nvim_list_uis()[1].ext_tabline == true)')", expect = "true" },
  # The handoff completing, read from the option itself: view withheld
  # `cmdheight = 0` (it zeroes it only when it took both the cmdline and
  # the messages), and it is 0 anyway because noice's own `vim.ui_attach`
  # for `ext_messages` made the engine zero it. Nothing but noice owning
  # the message surface produces this value here.
  { probe = "luaeval('tostring(vim.o.cmdheight)')", expect = "0" },
  # The remedy's whole point: neither complaint survives it.
  { assert_absent = "Noice can't work when the GUI has" },
  { assert_absent = "noice.nvim is using the command line" },
  { send = ":lua vim.notify('noice-compat-marker')<CR>" },
  { wait_for = "noice-compat-marker", timeout_ms = 15000 },
  { wait_for_probe = "luaeval('(function() local ok, m = pcall(require, \"noice.message.manager\") if not ok then return \"no-mod\" end local msgs = m.get({ event = \"notify\" }, { history = true }) for _, msg in ipairs(msgs) do if tostring(msg:content()):find(\"noice%-compat%-marker\") then return \"routed\" end end return \"absent:\" .. #msgs end)()')", expect = "routed", timeout_ms = 10000 },
  # native.notifications = false hands `<leader>fm` back unclaimed; the
  # fixture never binds it either, so the send below is a genuine no-op --
  # the negative half of the pair the superseded state's own "Messages"
  # appearance proves the positive half of.
  { send = "\\fm" },
  { assert_absent = "Messages" },
]

[[states]]
name = "native-only"
fixture = "minimal"
steps = [
  { send = "\\fm" },
  # The minimal fixture has no plugin to route vim.notify through at all,
  # so this is the one state that shows view's own history overlay with
  # nothing routed through a plugin first. The send above is also this
  # launch's first keystroke, which ends the startup hold and puts every
  # entry it parked onto the stack -- so the title this waits for opens
  # underneath that stack and is readable only as it retires.
  { wait_for = "Messages", timeout_ms = 30000 },
  { send = "<Esc>" },
]
