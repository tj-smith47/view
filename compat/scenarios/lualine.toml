# The heavy fixture's own smoke scenario: lualine is ui-owning (occupies
# the statusline, a surface `view` renders natively) and is the
# illustrative case the probe-channel design itself was written against.
schema = 1
plugin = "lualine"
class = "ui-owning"
fixture = "heavy"
state = "present"
steps = [
  # A cold plugin cache install runs asynchronously and can still hold
  # input focus in lazy.nvim's own install window well after `view` itself
  # is up; wait_for_probe (not a one-shot probe) polls until the plugin
  # actually finishes loading before any editing keystroke is sent, so this
  # scenario is correct whether it lands on a warm or a cold cache.
  { wait_for_probe = "luaeval('package.loaded.lualine ~= nil')", expect = "true", timeout_ms = 180000 },
  # lualine can finish loading while lazy.nvim's install window still holds
  # input focus (it stays open until every plugin is in and LazyDone has
  # fired), so the load probe alone is not a safe gate for the keystroke
  # below -- it must also wait for the install window to actually close.
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  { send = "ihello<Esc>" },
  # a translation regression in <Esc> handling would otherwise still pass
  # this scenario: with no real key press sent, mode() stays "i" while
  # every substring assertion below keeps passing against the literal text
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
  # noice's startup health notifications overlay the upper grid rows
  # (including buffer line 1, where this text renders) for the first few
  # seconds after launch; the timeout must outlast their dismissal.
  { wait_for = "hello", timeout_ms = 15000 },
  { assert_absent = "E5108" },
  # lualine loading (the probe below) is not the same fact as lualine
  # rendering: a plugin that loaded but crashed before drawing, or whose
  # statusline is empty/garbled, would still pass a load-only check. These
  # two cells were read live off this fixture's own rendered 100x30 screen
  # (COMPAT_COLS x COMPAT_ROWS) at its default theme: column 1 of the
  # bottom row holds the start of the "NORMAL" mode component, and column
  # 85 holds one of lualine's own powerline section-separator glyphs --
  # neither appears in view's own plain default statusline, so together
  # they pin lualine's actual rendered output, not just its loaded state.
  { wait_for_cell = { row = 29, col = 1, expected = "N" }, timeout_ms = 5000 },
  { wait_for_cell = { row = 29, col = 85, expected = "" }, timeout_ms = 5000 },
  { probe = "luaeval('package.loaded.lualine ~= nil')", expect = "true" },
]
