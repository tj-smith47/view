# The heavy fixture's own smoke scenario: lualine is ui-owning (occupies
# the statusline, a surface `view` renders natively) and is the
# illustrative case the probe-channel design itself was written against.
#
# The discriminator across states is column 85 of the statusline row:
# lualine paints its own powerline section-separator glyph there, and
# `laststatus = 0` (the one row in view-native's takeover table) blanks
# nvim's own status row whenever the native statusline wins, so that
# glyph's presence or absence is a fact the two plugin-present states
# cannot share.
schema = 1
plugin = "lualine"
class = "ui-owning"
fixture = "heavy"

[[states]]
name = "superseded"
steps = [
  # Generous timeout: the first heavy scenario to run on a cold shared
  # cache pays for the full plugin clone before any plugin can load.
  { wait_for_probe = "luaeval('package.loaded.lualine ~= nil')", expect = "true", timeout_ms = 180000 },
  # A cold install leaves lazy.nvim's own window holding input focus until
  # the fixture's LazyDone autocmd closes it; a keystroke sent before that
  # lands in the install window instead of the buffer.
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  { send = "ihello<Esc>" },
  # a translation regression in <Esc> handling would otherwise still pass
  # this scenario: with no real key press sent, mode() stays "i" while
  # every substring assertion below keeps passing against the literal text
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
  # noice's startup health notifications overlay the upper grid rows for
  # the first few seconds after launch; the timeout must outlast their
  # dismissal.
  { wait_for = "hello", timeout_ms = 15000 },
  { assert_absent = "E5108" },
  # laststatus = 0 removes nvim's own status row from the grid nvim draws,
  # and view resizes nvim's attached grid one row shorter at load so its
  # own statusline can take the vacated physical row back rather than the
  # buffer growing into it -- row 29 stays the statusline row either way.
  { assert_cell_not = { row = 29, col = 85, glyph = "" } },
]

[[states]]
name = "deferred"
native = { statusline = false }
steps = [
  { wait_for_probe = "luaeval('package.loaded.lualine ~= nil')", expect = "true", timeout_ms = 180000 },
  { wait_for_probe = "luaeval('(function() for _, w in ipairs(vim.api.nvim_list_wins()) do if vim.bo[vim.api.nvim_win_get_buf(w)].filetype == \"lazy\" then return \"open\" end end return \"closed\" end)()')", expect = "closed", timeout_ms = 180000 },
  { send = "ihello<Esc>" },
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
  { wait_for = "hello", timeout_ms = 15000 },
  { assert_absent = "E5108" },
  # native.statusline = false hands laststatus back, so lualine's own
  # setup() (it reasserts the option on ColorScheme/OptionSet, see
  # view-native's supersede module) keeps the row and paints its own
  # separator glyph into it.
  { wait_for_cell = { row = 29, col = 85, expected = "" }, timeout_ms = 5000 },
  { probe = "luaeval('package.loaded.lualine ~= nil')", expect = "true" },
]

[[states]]
name = "native-only"
fixture = "minimal"
steps = [
  { send = "ihello<Esc>" },
  { wait_for_probe = "mode()", expect = "n", timeout_ms = 10000 },
  { wait_for = "hello", timeout_ms = 15000 },
  { assert_absent = "E5108" },
  # No lualine anywhere in this fixture, so nothing could paint the
  # powerline glyph; the fact this state alone can prove is that the
  # native statusline still draws with zero plugins present at all --
  # nvim only emits msg_ruler while laststatus=0 (the statusline
  # feature's own supersession setting, see docs/statusline-wire-capture.md),
  # so its "All" scroll indicator appearing here is proof the native
  # statusline's ruler segment actually rendered, not just that the row's
  # background chrome painted.
  { wait_for = "All", timeout_ms = 5000 },
]
