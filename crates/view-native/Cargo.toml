[package]
name = "view-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Exposes `supersede::takeover_augroups`, the shipped takeover table's own
# augroup names, so a test in a crate that can also see view-engine pins
# them against the Lua chunks that create them. No production caller: the
# names are only ever built inside nvim. Off in every ordinary build, and
# the dependency direction is untouched -- nothing here gains an edge, only
# a test/harness crate that already depends on both turns this on.
test-support = []

[dependencies]
# The picker's fuzzy matcher engine (spec §18): confined to this crate by
# scripts/audit-deps.sh, the same confinement `arboard` has in the `view`
# bin crate -- view-core stays free of a matching-library dependency, and
# only this crate's worker thread ever touches a `Nucleo` handle.
nucleo = "0.5.0"
# The picker's Files source walker: respects .gitignore/.ignore the same
# way `rg`/fd do (it is ripgrep's own walker crate), confined to this crate
# on the same terms as `nucleo`.
ignore = "0.4.33"
# The picker's live-grep source: ripgrep's own constituent crates for
# searching file contents, in-process rather than shelling out to `rg`
# (spec §18 -- see crates/view-native/src/picker/sources.rs), confined to
# this crate on the same terms as `nucleo`/`ignore`.
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.18"
toml = "0.8"
view-core = { version = "0.0.1", path = "../view-core" }

[dev-dependencies]
# The shared temp-dir fixture guard (see its own crate doc): a leaf crate
# with no dependency edge into core <- surface <- {native, ai}, reachable
# from this crate's tests without going through view-core (which stays
# I/O-free) or the view bin crate (which this crate does not, and must
# never, depend on).
view-test-support = { version = "0.0.1", path = "../view-test-support" }
