[package]
name = "view-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Builds the stub agent the transport tests drive and the harness that
# proves a dropped session takes its agent with it. Off by default: both are
# test doubles for processes outside this crate and have no place in an
# ordinary build of it. Enabled automatically for this crate's
# own test session by the self dev-dependency below.
test-support = []

[dependencies]
# Two roles: the ACP JSON-RPC wire types (crates/view-ai/src/acp/wire.rs)
# and the [ai] table's own wire types (crates/view-ai/src/config.rs).
# Confined to this crate and view-native by scripts/audit-deps.sh, on the
# same terms view-native's own [native]/[supervision] parser has: every
# other lib crate stays free of it, so a config or wire concern can never
# leak into the pure layers.
serde = { version = "1", features = ["derive"] }
# The ACP wire's own JSON-RPC payloads (crates/view-ai/src/acp/wire.rs),
# never the [ai] table -- config.rs speaks TOML only. Confined the same way
# `serde` above is.
serde_json = "1"
thiserror = "2.0.18"
# `net` is what carries `Builder::enable_io` on every platform: on unix the
# `process` feature above enables the io driver as a side effect, on windows
# it does not, so a build without it compiles here and fails there
tokio = { version = "1", features = ["rt-multi-thread", "process", "net", "io-util", "sync", "macros"] }
# The [ai] table's own parser (crates/view-ai/src/config.rs), this crate's
# first use of it. Confined the same way `serde` above is.
toml = "0.8"
# `provision.rs`'s checksummed adapter download. Blocking, rustls-backed,
# default-features off: `ensure_adapter`'s signature is synchronous (no
# caller of it should have to spin up a runtime just to fetch a binary),
# and the alternative candidate, `reqwest`, pulls hyper/tower/tokio and a
# second async runtime surface into a crate that already has its own for
# a completely unrelated reason (the ACP transport) -- a second one for
# one blocking GET would be redundant weight with no parallelism to spend
# it on. Default features add transfer-encoding gzip (also via flate2,
# but for HTTP response decompression, unrelated to the tar.gz extraction
# below) this crate never needs -- the tarball is verified byte-for-byte
# against its pin, so an intermediary transparently re-encoding the
# response body is not a feature this download wants; `rustls` alone
# keeps the dependency graph to one TLS stack.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# `provision.rs`'s checksum verification. RustCrypto's own SHA-2, the same
# family every other Rust ecosystem checksum tool (cargo itself included)
# verifies against; its own dependency footprint is three small crates
# (`cfg-if`, `cpufeatures`, `digest`), which is why it wins over hand-
# rolling SHA-256 in this crate instead of trusting an audited
# implementation.
sha2 = "0.10"
# `provision.rs`'s tarball extraction, paired with `flate2` below. The
# pinned `claude-code` adapter ships as an npm `.tar.gz`, not a standalone
# binary; `tar`+`flate2` is the maintained combination `cargo` itself
# vendors for crate source extraction, chosen over hand-rolling a tar
# reader or a DEFLATE decoder here, which would trade an audited
# implementation for an unaudited one to save two small dependencies.
# `default-features = false` drops the `xattr` feature (and its `libc`
# pull): extraction never enables `unpack_xattrs`, so that path is dead
# weight -- the same discipline `ureq` below applies to shed unused
# transfer-encoding gzip.
tar = { version = "0.4", default-features = false }
# `flate2`'s pure-Rust `miniz_oxide` backend (the crate's default) decodes
# the tarball's gzip layer without linking a system zlib, keeping this
# crate's build reproducible across the platforms `view` ships on.
flate2 = "1"
view-core = { version = "0.0.1", path = "../view-core" }
# `watch.rs`'s own out-of-band write watcher, over the trusted project root
# only (never a bare user path): the platform-native backend (inotify on
# Linux, FSEvents on macOS, ReadDirectoryChangesW on Windows) is what lets
# an agent's own shell tool -- the one write path no ACP client can see or
# route -- still reach `RpcCall::Checktime` instead of going unnoticed
# until the user happens to look at the file again. Confined to this crate
# by `scripts/audit-deps.sh`, on the same terms `sha2`/`tar`/`flate2` above
# are: `view-core` stays pure (no filesystem, no threads of its own) and
# every other lib crate stays free of a watcher dependency it has no use
# for.
notify = "8.2.0"
# `watch.rs`'s registration walk. The watcher places one platform
# descriptor per directory, so what it walks decides both how long starting
# a session takes and whether the host's watch limit is reached at all: a
# project's own ignore rules are the description of "output no buffer will
# ever name" that already exists, and this is the walker that honours them.
# The same crate the picker's Files source already walks with -- a second
# gitignore parser in this workspace would be two answers to one question,
# free to disagree. Shared with view-native by `scripts/audit-deps.sh`;
# every other lib crate stays free of it.
ignore = "0.4.33"

[dev-dependencies]
# `time` is test-only: nothing in the shipped crate uses a timer, and the
# runtime it builds does not enable one. The tests need a bounded wait so a
# regression that reintroduces a forever-running session loop fails the gate
# instead of hanging it.
tokio = { version = "1", features = ["time"] }
# Self dev-dependency: cargo's feature unification enables test-support for
# every build of this package within a `cargo test` session, so the tests
# under tests/ see the stub agent binary without a manual --features flag.
# No normal (non-test) build depends on view-ai as its own dev-dependency,
# so test-support never leaks in.
view-ai = { path = ".", features = ["test-support"] }

[[bin]]
name = "view-ai-stub-agent"
path = "tests/fixtures/stub_agent.rs"
required-features = ["test-support"]
test = false
bench = false
doc = false

[[bin]]
name = "view-ai-drop-harness"
path = "tests/fixtures/drop_harness.rs"
required-features = ["test-support"]
test = false
bench = false
doc = false
