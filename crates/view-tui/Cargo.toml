[package]
name = "view-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Compiles a monotonic-timestamp tap at the terminal-write boundary
# (src/tap.rs) for the measurement harness, widening the existing rustix
# dependency with the clock and O_NONBLOCK-open features the tap needs.
# Off by default: without it the tap module does not exist in the
# compilation at all, so shipping builds carry zero tap code or cost.
bench-taps = ["rustix/time", "rustix/fs"]

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
view-core = { version = "0.0.1", path = "../view-core" }
view-surface = { version = "0.0.1", path = "../view-surface" }
# Per-character display-cell width for paint_text_row's manual cell-by-cell
# placement (a wide CJK character must advance the column by 2, and reset
# its shadow cell, or later characters on the row misalign). Already
# resolved transitively via ratatui's own use of it, but a transitive
# dependency cannot be `use`d without also declaring it directly.
unicode-width = "0.2.2"

# Capability probing needs a bounded, non-blocking-style stdin read (VMIN=0/
# VTIME=0 termios) so a terminal that never replies can't leave a dangling
# reader thread racing the real input reader started later; rustix is
# already resolved transitively via crossterm's own unix backend (same
# feature set crossterm itself enables), so this adds no new dependency
# surface, just a direct edge to an already-vetted crate.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "termios", "pipe"] }
# The SIGWINCH self-pipe behind `input::InputSource` (see that module's
# docs): a resize is a signal, not a tty byte, so the runtime loop's fd
# readiness poll needs a crate-registered pipe to wake on one. Already
# resolved transitively via crossterm's own unix event backend, same as
# rustix above.
signal-hook = { version = "0.3", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
# Test-only, for the span-painter parity leg (tests/span_painter_parity.rs):
# `view-oracle`'s raster is the one other crate that turns a `Surface` into
# text, and it deliberately stays free of crossterm/ratatui (see its own
# module docs) so the edge must run the other way -- view-tui depending on
# it in tests, never the reverse. Dev-only so no shipping binary carries the
# oracle's differential-testing machinery.
view-oracle = { version = "0.0.1", path = "../view-oracle" }

[[bench]]
name = "paint_frame"
harness = false
