# Gate headroom measured on this class, overriding the compiled-in default
# for the metric's kind. Hand-curated characterization: --record rewrites
# gh-linux.toml and never this file, so entries and their provenance
# comments survive every record pass. A metric absent here has not had its
# run-to-run spread established on this class and gates on the conservative
# default; absence is a statement, not a gap to fill with a plausible
# number.
#
# A bare key characterizes the statistic host-wide; a quoted
# "scenario.metric" key scopes it to one scenario and a quoted
# "scenario.fixture.metric" key to one cell, each winning over the wider
# scope -- for a statistic whose spread is a property of the scenario, or
# of one fixture of it, rather than of the host.
#
# The replicates behind these entries are the bench legs CI already ran on
# this class, harvested from their logs: a hosted runner cannot be held
# quiet for a replicate campaign, and the spread that matters here is
# exactly the one those legs see. They are not one unchanged binary pair --
# each draw is a different commit of view against the same engine pin
# (v0.12.4) -- so every entry states what rules out a code trend for its
# own statistic. A statistic that steps between two non-overlapping levels
# is a finding for the recorded bar to keep reporting, not a spread for a
# factor to absorb, and gets no entry however wide its pooled half-width
# looks.
machine_class = "gh-linux"

[headroom]
# 14 CI bench legs, runs 30856641597, 30861044267, 30874125937 and
# 30879797693 (2026-08-03/04), 32531092866, 32533279176, 32534348333,
# 32537625267, 32619785446 and 32784781768 (2026-08-21/24), then
# 33204611952, 33235574037, 33238348497 and 33244439984 (2026-08-28/29),
# runner load at start 1.03 to 3.64, both scroll fixtures, gated
# statistic per leg (median ratio_p50 of 3 trials). Scoped to scroll
# because the spread is the scenario's and not this runner's ratio
# resolution: echo's ratio_p50 from the very same legs stays inside 4.1%
# (1.113..1.209).
#   minimal 2.107 2.295 2.086 1.809 1.897 2.057 2.045 1.967 1.987 2.537
#           1.972 1.974 2.130 1.972:
#     median 2.016, half-width 0.364 (18.06%)
#   heavy   2.203 2.429 2.176 2.301 2.067 2.200 2.121 2.094 2.156 2.553
#           2.031 2.124 2.262 2.140:
#     median 2.166, half-width 0.261 (12.05%)
# Worst excursion above a recorded value 1.290x (minimal 2.537 against
# 1.9669); the 2x half-width rule asks 1.395x (2.016 + 2 x 0.364 against
# 1.9669). 1.42 clears both, and replaces a default of 1.25 that the
# runner's own spread crosses on unchanged behaviour.
#
# The 2.537 draw is the runner, not view: the same commit measured 1.620
# against a 1.605 bar on the coordinated quiet dev-linux host, and that
# leg's operands moved together -- the trial behind the 2.537 median read
# view p50 1.801 ms against nvim p50 0.710 ms, and the leg's per-operand
# medians (view 1.783 ms, nvim 0.697 ms) were both the slowest of the
# fourteen legs, against campaign ranges of 0.793..1.783 and
# 0.383..0.697. A
# per-sample interleaved ratio cancels the shared slowdown but not view's
# scroll degrading faster than nvim's as the runner slows, and that
# residual is what this factor covers. Nothing here trends: the second leg
# of the window already read 2.295.
#
# The factor also survives its own ratchet, which is the check that decides
# whether a sized entry still holds once the recorded value moves. The
# lowest draw is what the min-ratchet seats, and 1.809 x 1.42 = 2.5688
# still clears the campaign's worst reading 2.537 -- by 1.2%, thin enough
# to state rather than leave to be rediscovered; the heavy fixture's
# equivalent is 2.031 x 1.42 = 2.884 against a 2.553 worst. A later draw
# that turns either margin negative is a re-sizing, not a rounding.
"scroll.ratio_p50" = 1.42

# 10 CI bench legs, runs 32531092866, 32533279176, 32534348333,
# 32537625267, 32619785446 and 32784781768 (2026-08-21/24) plus
# 33204611952, 33235574037, 33238348497 and 33244439984 (2026-08-28/29),
# runner load at start 1.19 to 3.18, picker/minimal, gated statistic per
# leg (median match_paint_p50_ms of 3 trials):
#   3.192 3.198 3.216 3.297 3.435 3.704 3.113 3.430 4.746 3.268:
#     median 3.2825, half-width 0.8165 (24.87%)
# Worst excursion above the recorded value 1.525x (4.746 against 3.1130);
# the 2x half-width rule asks 1.579x (3.2825 + 2 x 0.8165 against
# 3.1130).
# 1.59 clears both, and replaces a default of 1.5 that run 33238348497
# breached on a picker no commit between the recorded 68b06a4 and the
# breaching 63ba8b2 touches.
#
# The 4.746 draw is the runner, not view. That leg's warm-path absolutes
# are the worst of the nine across scenarios sharing nothing with the
# picker but the host -- echo/minimal view p99 1.201 ms and echo/heavy
# 1.956 ms against campaign ranges 0.644..0.945 and 1.471..1.801,
# echo_control/minimal 1.205 ms against 0.606..0.836, the predicted
# paint p99 0.587 ms against 0.433..0.558 -- and nvim's own side moved
# with them, echo/minimal nvim p99 reading 0.983..1.119 ms across the
# leg's three trials against 0.560..0.628 ms on the leg before. Every
# paired ratio stayed where it was (echo/minimal ratio_p50 1.184 against
# a campaign median 1.161), which is the shape of a host that slowed
# uniformly; the picker has no nvim leg to cancel against, so on this
# row the same slowdown can only appear as an absolute. Nothing here
# trends: the cell's own p99 moved up with the p50 and back down
# (6.322 against a 3.638..4.677 range), the two legs before the breach
# read 3.113 and 3.430, and the leg after it read 3.268 at load 1.37.
#
# The factor also survives its own ratchet. The recorded value is
# already the campaign's lowest draw, and 3.113 x 1.59 = 4.9497 still
# clears the worst reading 4.746 -- by 4.3%, thin enough to state rather
# than leave to be rediscovered. A draw below 3.113 reseats the bar
# under a reading this band has already produced, which is a re-sizing
# and not a rounding.
"picker.minimal.match_paint_p50_ms" = 1.59


# picker.first_page_p50_ms is deliberately absent. Ten draws, runs
# 32531092866, 32533279176, 32534348333, 32537625267, 32619785446 and
# 32784781768 (2026-08-21/24) plus 33204611952, 33235574037, 33238348497
# and 33244439984 (2026-08-28/29): 14.702, 6.123, 6.519, 11.072, 2.739,
# 3.376, 3.486, 3.052, 3.221, 4.401. They are two non-overlapping levels
# split in time, not one spread: every reading at or above 6.123 comes
# from 32531092866..32537625267 and every reading at or below 4.401 from
# 32619785446 on, no leg straddles, and the cell's p99 steps with its p50
# -- 26.319..27.925 ms to 5.178..6.724 ms, with no overlap there either.
# gh-macos steps at the same commit boundary (8.193, 7.397, 30.666
# through 32537625267, then 3.294, 2.786, 3.065, 3.582, 5.117), and no
# account of runner weather has two hosted classes changing level
# together at one commit. The only window between the levels is
# ebc2812..e432867, which reworked the overlay stack and the paint path a
# first page arrives through; nothing in it names the picker, so the
# attribution is to the window and not to a diff. Pooling the two levels
# is therefore the error, and no factor sized on the pool holds: the
# worst excursion above the recorded 3.4862 is 4.217x, the 2x half-width
# rule asks 4.563x, and the lowest draw 2.739 taken as a seat would need
# 5.37x before the bar cleared 14.702.
#
# The lower level alone is six draws -- 2.739, 3.376, 3.486, 3.052,
# 3.221, 4.401, median 3.2985, half-width 0.831 -- and asks 1.263x for
# its worst excursion and 1.423x for the 2x rule, both of which the
# compiled absolute default (1.5) already covers. An entry would only
# tighten the bar and could not close the hole that matters: a seat
# ratcheted to 2.739 needs 1.607x before it clears 4.401, which is
# neither half's answer. So the default keeps reporting this row, and it
# masks nothing today -- 4.401 against a 5.229 bar, on a leg whose runner
# load (1.37) sits mid-band inside the campaign's 1.19..3.18.
# gh-macos's counterpart
# entry exists because there the same statistic crossed its default;
# here it has not.
#
# Every draw above was taken at 12 measured opens (+2 warmup) per trial;
# the scan phase now takes 100 (+10), which reads the same quantity about
# 2.9x more finely (sampling error goes as 1/sqrt(n)) and is where a good
# part of this cell's 25.2% half-width came from. The absence argument
# rests on neither count: a tighter estimator can only narrow the band,
# and both halves above already clear the compiled default.

# first_paint.marker_ratio_p50 is deliberately absent. Its pooled draws
# (minimal 0.147 0.173 0.126 0.140 on 2026-08-03/04, then 0.211 0.214
# 0.211 0.216 0.204 0.202 on 08-21/24, then 0.189 0.181 0.160 on
# 08-28/29; heavy 0.366 0.426 0.321 0.359, then 0.440 0.459 0.440 0.450
# 0.446 0.439, then 0.434 0.425 0.400) are a walk and not a spread: view's
# own cold marker p50 rose from 15.2..21.9 ms to 25.9..27.4 ms and has
# since come back to 19.96..24.21 ms, while nvim's holds 121..128 ms
# across all thirteen legs. The recorded 0.1733 predates the rise and the
# newest draw (0.160) has now passed under it, so what separates a draw
# from the seat is which commit produced it -- a measurement to explain,
# not a band to widen. The worst excursion above the seat is 1.246x
# (0.216) and the compiled ratio default is 1.25, so the default keeps
# reporting this row without masking anything, which is the point.

# The campaign numbers behind each factor above, in the form the
# characterization walk re-checks them in: a draws key names one cell,
# `recorded` is the seat the factor was sized against, and `values` are
# the kept draws the comment lists. The prose stays the account of where
# they came from; these are what a later session's arithmetic runs on.
[draws."scroll.minimal.ratio_p50"]
