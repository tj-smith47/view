# Gate headroom measured on this host, overriding the compiled-in default
# for the metric's kind. Hand-curated characterization: --record rewrites
# dev-macos.toml and never this file, so entries and their provenance
# comments survive every record pass. A metric absent here has not had its
# run-to-run spread established on this class and gates on the conservative
# default; absence is a statement, not a gap to fill with a plausible number.
# A bare key characterizes the statistic host-wide; a quoted
# "scenario.metric" key scopes it to one scenario and a quoted
# "scenario.fixture.metric" key to one cell, each winning over the wider
# scope -- for a statistic whose spread is a property of the scenario, or
# of one fixture of it, rather than of the host.
machine_class = "dev-macos"

[headroom]
# No bare ratio_p50 entry. A host-wide 1.02, characterized from 8 loaded-host
# echo/minimal replicates (2026-08-02, loads 3.56-5.26, spread 1.4% min to
# max), used to sit here. The 2026-08-03 quiet-host replicates falsified the
# host-wide claim: echo/heavy resolves the same statistic to 0.974-1.218
# across 8 replicates -- within-replicate trial spread 2-8% against 25%
# between replicates, both processes' absolute p50 redrawing in discrete
# tiers per spawned pair (core placement), not with ambient load: the lowest
# draw (0.974) landed at load 1.39 and the highest clean draw on record
# (1.2513, same-commit gate run) at load 1.1. A 1.02 bar would false-fail a
# large fraction of honest echo/heavy draws, and the tight minimal spread it
# generalized from characterized one fixture under sustained load, not the
# host. Absence routes echo to the compiled default, which is the honest
# statement of what this class resolves.
#
# Ruled correct 2026-08-08 (see
# .claude/measurements/2026-08-08-measurement-layer-rulings.md section 4):
# the compiled 1.25 covers this class's own clean echo draws (worst
# 1.2513 against the 1.114 replicate median), and on a shared class the
# only consumer of an echo factor is the shortfall ceiling, so any
# honestly-sized tighter factor could only false-fail honest draws.
# Absence stands as the ruling, not as unfinished work.

# 23 replicates across the two scroll fixtures, 2026-08-30, real mbp
# hardware (MacBookPro18,2, macOS 26.2) at 87ef37b, one unchanged binary
# pair per replicate, gated ratio_p50 (median of 3 trials, 1000 samples
# plus 100 warmup per trial). The pre-registered load exclusion
# (pre-replicate 1-min load > 2.0) keeps 9 of 10 minimal and 8 of 13
# heavy; replicates were repeated until each fixture carried at least 8
# included draws, and every excluded draw is listed here rather than
# dropped.
#   minimal 2.2473 2.2534 2.2630 2.2690 2.2725 2.2804 2.2868 2.3043
#           2.3094:
#     median 2.2725, half-width 0.0311 (1.37%)
#     excluded 2.3003 (load 3.15)
#   heavy   2.2813 2.3085 2.3155 2.3166 2.3219 2.3219 2.3259 2.3371:
#     median 2.3192, half-width 0.0279 (1.20%)
#     excluded 2.3284 (2.04), 2.3548 (2.05), 2.3174 (2.16), 2.3323
#     (4.13), 2.3626 (2.13)
# No excluded draw exceeds 2.3626, so the exclusion removed nothing the
# included bands do not already bound within 1.1%, and the null-pair
# calibration stayed clean on all 23 (worst deviation 1.0492 against a
# 1.15 floor), so no replicate is a mis-paired run.
#
# Against the seats this campaign replaced the rule asked for nothing:
# the worst excursion was 0.970x (minimal 2.3094 against 2.3816) and
# 0.976x (heavy 2.3371 against 2.3932), and the 2x half-width rule asked
# 0.980x and 0.992x. Every one of the 23 readings, included or excluded,
# fell below its fixture's old recorded value, which is the campaign's
# finding rather than a licence to publish 1.0: both seats were stale.
# 2.3816 sat 4.80% above this band's minimal median and 3.13% above its
# worst draw; 2.3932 sat 3.19% and 2.40% above heavy's, and the
# 2026-08-03 campaign's high minimal band (2.349-2.438) did not
# reproduce in ten replicates.
#
# Both cells in dev-macos.toml were therefore re-set by hand to this
# campaign's medians -- scroll.minimal 2.2725, scroll.heavy 2.3192 --
# because a --record cannot follow a band down past its own refusal
# floor: at any factor this band supports the floor sits above the whole
# band, so ratchet_cell refuses every draw and holds the stale seat, and
# reaching under 2.2473 from 2.3816 would take a 1.056 factor sized to
# bridge a gap rather than to a spread. A hand-record of a replicate
# campaign's median is the move the ratchet's own documentation names
# for that case, and it was a hand edit because the bench binary then
# measured one replicate per invocation and never held the campaign a
# median is taken over. `bench --campaign N` now holds the campaign and
# proposes both the seats and this factor, so the next re-seat of these
# cells runs it rather than repeating the hand pipeline.
#
# The factor is sized against those re-set seats, where the rule is
# load-bearing again: it asks 1.0276 for minimal (a seat ratcheted to
# 2.2473 clearing 2.3094) and 1.0245 for heavy (2.2813 clearing
# 2.3371), worse fixture governing. 1.03 clears minimal's binding leg by
# 0.23% and heavy's by 0.54%, and minimal's 2x half-width leg by 0.26%
# -- thin enough to state rather than leave to be rediscovered, and a
# draw that turns any of the three negative is a re-sizing, not a
# rounding. The 1.024 it replaces does not survive the re-seat at all:
# at a minimal seat of 2.2473 it bars at 2.3012 against a 2.3094 this
# campaign already drew.
#
# Still scoped to the scenario rather than to either fixture: the two
# fixtures resolve the rule to 1.0276 and 1.0245, within 0.3% of each
# other, so one key governing both remains the honest statement.
"scroll.ratio_p50" = 1.03

# The campaign numbers behind the factor above, in the form the
