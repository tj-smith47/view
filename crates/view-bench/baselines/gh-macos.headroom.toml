# Gate headroom measured on this class, overriding the compiled-in default
# for the metric's kind. Hand-curated characterization: --record rewrites
# gh-macos.toml and never this file, so entries and their provenance
# comments survive every record pass. A metric absent here has not had its
# run-to-run spread established on this class and gates on the conservative
# default; absence is a statement, not a gap to fill with a plausible
# number.
#
# A bare key characterizes the statistic host-wide; a quoted
# "scenario.metric" key scopes it to one scenario and a quoted
# "scenario.fixture.metric" key to one cell, each winning over the wider
# scope -- for a statistic whose spread is a property of the scenario, or
# of one fixture of it, rather than of the host.
#
# The replicates behind these entries are the bench legs CI already ran on
# this class, harvested from their logs: a hosted runner cannot be held
# quiet for a replicate campaign, and the spread that matters here is
# exactly the one those legs see. They are not one unchanged binary pair --
# each draw is a different commit of view against the same engine pin
# (v0.12.4) -- so every entry states what rules out a code trend for its
# own statistic. A statistic that steps between two non-overlapping levels
# is a finding for the recorded bar to keep reporting, not a spread for a
# factor to absorb, and gets no entry however wide its pooled half-width
# looks.
machine_class = "gh-macos"

[headroom]
# 14 CI bench legs, runs 30856641597, 30861044267, 30868862255,
# 30874125937 and 30879797693 (2026-08-03/04), 32533279176, 32534348333,
# 32537625267, 32619785446 and 32784781768 (2026-08-21/24; 32531092866
# was cancelled before this cell ran), then 33204611952, 33235574037,
# 33238348497 and 33244439984 (2026-08-28/29), runner load at start 1.55
# to 35.15, both first_paint fixtures, gated statistic per leg. This
# ratio comes from a single cold spawn -- median of 1 trial -- which is
# why it resolves an order worse here than the 1000-sample steady-state
# ratios on the same legs (echo's ratio_p50 half-width 3.2%).
#   minimal 0.195 0.220 0.205 0.241 0.185 0.242 0.249 0.251 0.232 0.252
#           0.207 0.217 0.198 0.208:
#     median 0.2185, half-width 0.0335 (15.33%)
#   heavy   0.359 0.380 0.373 0.386 0.399 0.394 0.385 0.387 0.383 0.415
#           0.377 0.371 0.414 0.353:
#     median 0.384, half-width 0.031 (8.07%)
# Worst excursion above a recorded value 1.227x (minimal 0.252 against
# 0.2053); the 2x half-width rule asks 1.391x (0.2185 + 2 x 0.0335
# against 0.2053). 1.48 clears both, and replaces a default of 1.25 that
# this runner's cold-start spread crosses. Scoped to first_paint: a
# future scenario reusing the name must earn its own characterization.
#
# Spread, not a code trend: view's cold marker p50 spans 40.1 to 57.6 ms
# across the fourteen legs with the 08-03/04 group already reaching 56.4,
# while nvim's holds 217..234 ms -- the groups overlap in both
# directions.
# The same statistic on gh-linux is the opposite case and is deliberately
# absent from that class's sidecar, where the two groups do not overlap.
#
# The factor survives its own ratchet: the lowest draw is what the
# min-ratchet seats, and 0.185 x 1.48 = 0.2738 still clears the campaign's
# worst reading 0.252 (heavy: 0.353 x 1.48 = 0.5224 against a 0.415
# worst). A later draw that turns either margin negative is a re-sizing,
# not a rounding.
"first_paint.marker_ratio_p50" = 1.48

# picker.match_paint_p50_ms is deliberately absent, and the grounds for
# that moved when the row's sample count did. Five draws at the 100
# measured opens (+10 warmup) per trial this scenario resolves at today
# -- runs 33256006805 (6b5ae0c) and 33268735828 (081ee78) on 2026-08-29,
# 33299534481 (d4a2f6b) on 08-30, and both attempts of 33357087449
# (265fbc3) on 08-31 -- gated statistic per leg (median of 3 trials):
# 3.516, 3.297, 3.547, 3.675, 3.841. Median 3.547, half-width 0.272
# (7.67% of median), against the 40.9% the eight 12-sample draws showed
# (3.503, 3.508, 6.416, 3.298, 3.663, 4.808, 6.093, 3.965 over runs
# 32533279176, 32534348333, 32537625267, 32619785446, 32784781768,
# 33204611952, 33238348497 and 33244439984).
#
# What refused an entry on the coarse band was the ratchet: the seat
# could fall to 3.298 and clearing the 6.416 that band produced from
# there asked 1.945x, which neither the worst-excursion leg (1.334x) nor
# the 2x half-width rule (1.442x) answered. The finer estimator closes
# that hole and opens the opposite one. Worst excursion 0.799x and the
# 2x rule 0.851x against the recorded 4.8083 -- both under 1, so the
# recorded value already stands above everything this row now produces --
# and the ratchet asks 1.165x, so the smallest publishable factor is
# 1.17. A bar that tight mirrors down to a record floor of 3.991, above
# the band's own lowest draw 3.297: the entry would refuse as a lucky
# draw a reading its own campaign took three times. A factor cannot be
# published that its draws cannot be seated under, and the compiled
# absolute default (1.5) is what admits them -- floor 2.404, bar 7.212
# against a 3.841 worst, and 4.946 from a seat ratcheted to 3.297. The
# default is not crossed and cannot be reached by this band, so absence
# masks nothing; a re-seat onto the tighter estimator's median is what
# would make an entry here sizable, and `--record` never rewrites this
# file.

# 5 CI bench legs and not a campaign. Two changes rule a draw out of this
# band: the statistic stepped level at ebc2812..e432867 on both hosted
# classes (documented in gh-linux's own first_page note), and the scan
# phase went from 12 measured opens (+2 warmup) per trial to 100 (+10) at
# a7725cd..025fae4. Only legs past both measure what this row is, and
# five of them exist -- 33256006805 (6b5ae0c) and 33268735828 (081ee78)
# on 2026-08-29, 33299534481 (d4a2f6b) on 08-30, then both attempts of
# 33357087449 (265fbc3) on 08-31 -- picker/minimal, gated statistic per
# leg (median first_page_p50_ms of 3 trials):
#   3.960 3.249 2.980 3.509 3.772:
#     median 3.509, half-width 0.4900 (13.96%)
# The last two draws are one tree measured twice, which is the
# run-to-run spread this band is a statement about rather than a second
# tree's.
#
# Worst excursion above the recorded value 1.293x (3.960 against 3.0648);
# the 2x half-width rule asks 1.465x (3.509 + 2 x 0.4900 against 3.0648);
# the ratchet asks 1.329x (a seat at the lowest draw 2.980 clearing
# 3.960). 1.47 clears all three and is the smallest factor at the two
# decimals a factor is published in that does.
#
# 1.47 replaces 1.84, and the estimator moved rather than the picker.
# 1.84 was sized on five draws taken at 12 samples (+2 warmup) --
# 3.294 2.786 3.065 3.582 5.117 over runs 32619785446, 32784781768,
# 33204611952, 33238348497 and 33244439984 -- whose 35.38% half-width was
# the widest gated median in the matrix and a property of that count, not
# of what a first page costs: sampling error goes as 1/sqrt(n), 2.9x more
# samples resolve the same quantity to 13.96%, and the coarse band
# contains the fine one at both ends. That containment is why 1.84 masked
# nothing while it stood and why it cannot stay: a bar sized on the coarse
# estimator admits a regression the fine one would report. The seat is
# untouched -- `--gate` never rewrites one, `--record` rewrites
# gh-macos.toml and not this file, and 3.0648 still sits below every draw
# here.
#
# Where 1.84 was written because the compiled absolute default (1.5) was
# breached, 1.47 tightens that default instead. An entry below the
# default still belongs here: absence in this file states that a class's
# run-to-run spread has not been established, and this one's now has
# been, so falling back to 1.5 would claim less than the draws support.
# The bar stays seatable -- at 1.47 the record floor is 1.6244, and the
# band's own lowest draw 2.980 clears it by a wide margin, unlike
# match_paint's above.
#
# The margins are stated rather than left to be rediscovered. The binding
# leg is the 2x rule and it is the thin one: the recorded seat bars at
# 4.5053 against its 4.4893, 0.36%. The worst draw clears by 13.8% and a
# seat ratcheted to 2.980 bars at 4.3806 against the 3.960 worst, 10.6%.
# A draw that turns the first negative is a re-sizing, not a rounding.
"picker.minimal.first_page_p50_ms" = 1.47

# echo.ratio_p50 is deliberately absent, and what is missing now is the
# record run rather than the key grammar. echo/minimal is one of the
# tightest statistics on this runner (1.103..1.176 over eleven legs, 3.2%
# half-width) while echo/heavy is the widest (0.798..1.503 over ten,
# 33.4%), so a scenario-wide factor honest for heavy would loosen
# minimal's bar from 1.378 to 2.095 -- which is why any factor sized on
# heavy's band belongs on an "echo.heavy.ratio_p50" key, the fixture scope
# the loader now binds. heavy's stale 0.9316 bar was deleted at 741ad03
# pending an honest reseat and records fresh today, which is why neither
# fixture masks a regression now. The reseat still waits on a recorded
# bar: seating heavy's bar from one draw of a band that wide, under the
# compiled default, puts the class back where 32534348333 and
# 32537625267 exited 3.

# The campaign numbers behind each factor above, in the form the
# characterization walk re-checks them in: a draws key names one cell,
# `recorded` is the seat the factor was sized against, and `values` are
# the kept draws the comment lists.
