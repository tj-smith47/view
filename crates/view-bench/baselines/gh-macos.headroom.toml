# Gate headroom measured on this class, overriding the compiled-in default
# for the metric's kind. Hand-curated characterization: --record rewrites
# gh-macos.toml and never this file, so entries and their provenance
# comments survive every record pass. A metric absent here has not had its
# run-to-run spread established on this class and gates on the conservative
# default; absence is a statement, not a gap to fill with a plausible
# number. A bare key characterizes the statistic host-wide; a quoted
# "scenario.metric" key scopes it to one scenario and wins there, for a
# statistic whose spread is a property of the scenario rather than of the
# host.
#
# The replicates behind these entries are the bench legs CI already ran on
# this class, harvested from their logs: a hosted runner cannot be held
# quiet for a replicate campaign, and the spread that matters here is
# exactly the one those legs see. They are not one unchanged binary pair --
# each draw is a different commit of view against the same engine pin
# (v0.12.4) -- so every entry states what rules out a code trend for its
# own statistic. A statistic that steps between two non-overlapping levels
# is a finding for the recorded bar to keep reporting, not a spread for a
# factor to absorb, and gets no entry however wide its pooled half-width
# looks.
machine_class = "gh-macos"

[headroom]
# 10 CI bench legs, runs 30856641597, 30861044267, 30868862255,
# 30874125937 and 30879797693 (2026-08-03/04) plus 32533279176,
# 32534348333, 32537625267, 32619785446 and 32784781768 (2026-08-21/24;
# 32531092866 was cancelled before this cell ran), runner load at start
# 2.09 to 35.15, both first_paint fixtures, gated statistic per leg. This
# ratio comes from a single cold spawn -- median of 1 trial -- which is
# why it resolves an order worse here than the 1000-sample steady-state
# ratios on the same legs (echo's ratio_p50 half-width 3.2%).
#   minimal 0.195 0.220 0.205 0.241 0.185 0.242 0.249 0.251 0.232 0.252:
#     median 0.2365, half-width 0.0335 (14.16%)
#   heavy   0.359 0.380 0.373 0.386 0.399 0.394 0.385 0.387 0.383 0.415:
#     median 0.3855, half-width 0.028 (7.26%)
# Worst excursion above a recorded value 1.227x (minimal 0.252 against
# 0.2053); the 2x half-width rule asks 1.478x (0.2365 + 2 x 0.0335 against
# 0.2053). 1.48 clears both, and replaces a default of 1.25 that this
# runner's cold-start spread crosses. Scoped to first_paint: a future
# scenario reusing the name must earn its own characterization.
#
# Spread, not a code trend: view's cold marker p50 spans 40.1 to 57.6 ms
# across the ten legs with the 08-03/04 group already reaching 56.4, while
# nvim's holds 217..234 ms -- the two groups overlap in both directions.
# The same statistic on gh-linux is the opposite case and is deliberately
# absent from that class's sidecar, where the two groups do not overlap.
"first_paint.marker_ratio_p50" = 1.48

# echo.ratio_p50 is deliberately absent, and the reason is a gap in the
# key grammar rather than in the evidence. echo/minimal is one of the
# tightest statistics on this runner (1.103..1.176 over eleven legs, 3.2%
# half-width) while echo/heavy is the widest (0.798..1.503 over ten,
# 33.4%), and a key scopes to a scenario, never to one fixture -- so the
# factor honest for heavy would loosen minimal's bar from 1.378 to 2.095.
# heavy's stale 0.9316 bar was deleted at 741ad03 pending an honest
# reseat and records fresh today, which is why neither fixture masks a
# regression now. When that reseat lands, a factor sized on heavy's band
# needs a fixture-scoped key to exist first; seating heavy's bar from one
# draw of a band that wide, under the compiled default, puts the class
# back where 32534348333 and 32537625267 exited 3.
