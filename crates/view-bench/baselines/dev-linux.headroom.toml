# Gate headroom measured on this host, overriding the compiled-in default
# for the metric's kind. Hand-curated characterization: --record rewrites
# dev-linux.toml and never this file, so entries and their provenance
# comments survive every record pass. A metric absent here has not had its
# run-to-run spread established on this class and gates on the conservative
# default; absence is a statement, not a gap to fill with a plausible number.
# A bare key characterizes the statistic host-wide; a quoted
# "scenario.metric" key scopes it to one scenario and wins there, for a
# statistic whose spread is a property of the scenario rather than of the
# host.
machine_class = "dev-linux"

[headroom]
# 8 report-only replicates, 2026-07-27, host loads 0.44 to 8.53, one
# unchanged binary pair. Median 1.1735, half-width 1.70%, and the worst
# excursion above the recorded value was 2.14%. The pre-registered rule for
# distinguishing two conditions from single measurements is 2x half-width,
# here 3.4%. 1.06 clears both, and replaces a default of 1.25 that admitted a
# 25% regression on a statistic this host resolves to under 2%.
ratio_p50 = 1.06

# 8 report-only replicates, 2026-08-01, host loads 1.26 to 7.35, one
# unchanged binary pair, both scroll fixtures, gated statistic per replicate
# (median ratio_p50 of 3 trials). Scoped to scroll because its spread is not
# the host's ratio resolution: minimal median 1.9530, half-width 3.53%;
# heavy median 2.1060, half-width 4.89% -- two to three times echo's 1.70%
# -- and the min-ratcheted floors sit 9-13% below the medians (minimal
# recorded 1.7778, heavy 1.9907). Worst excursion above a recorded value
# 1.14x (2.013 against minimal's 1.7778); the 2x half-width rule asks
# 1.18x (1.9530 + 2 x 0.069 against 1.7778). 1.18 clears both; under the
# host-wide 1.06 the same unchanged pair breached on two independent runs
# (minimal 1.9008 > 1.8844, heavy 2.115 > 2.1102).
"scroll.ratio_p50" = 1.18

# 8 report-only replicates, 2026-08-01, host loads 0.79 to 5.74, one
# unchanged binary pair, both first_paint fixtures (16 observations of a p99
# over 1000 cold spawns; the name carries no percentile component, so this
# is a cold-start absolute rather than a tail -- set by cross-boot state,
# not by scheduler noise within a run). Pooled median 3.72 ms, half-width
# 2.63 ms (70.7% of median): the six quiet replicates per fixture sit inside
# 3.62..3.78 ms, and the elevated-load ones measured 6.08, 6.13 and 8.88 ms
# on unchanged code. Worst excursion above the recorded value 2.34x (8.881
# against heavy's recorded 3.788); the 2x half-width rule asks 2.41x. 2.5
# clears both, and replaces a default of 1.5 that this host's own weather
# breaches -- the quiet-recorded bar was broken by an ambient excursion, not
# by a change to view. Scoped to first_paint, the scenario the replicates
# ran: a future scenario reusing this metric name must earn its own
# characterization rather than inherit this one.
#
# dev-linux is a shared class, so the cold-start exemption keeps the
# ratchet from reading this entry here, and the spec budget gate now runs
# on a controlled class only -- neither reader consumes 2.5 on this class
# today. It stands as the sized characterization on record, so a future
# controlled-* class, or a lifted ratchet exemption, starts from a measured
# factor instead of the conservative default.
"first_paint.shell_visible_cold_ms" = 2.5

# Same 8 replicates as shell_visible_cold_ms, same statistic shape (a p99 of
# 1000 cold spawns whose name carries no percentile component, so this is a
# cold-start absolute too). Relative half-width agrees across fixtures:
# minimal median 23.6 ms, half-width 42.3%; heavy median 84.4 ms, half-width
# 42.1%. Worst excursion above the recorded value 1.91x (151.206 against
# heavy's recorded 79.267); the 2x half-width rule asks 1.85x. 2.0 clears
# both. Scoped to first_paint for the same reason as shell_visible_cold_ms.
#
# This factor was sized to also reach the spec budget: the minimal
# fixture's 30 ms budget sits under the ratchet ceiling this factor would
# produce (25.151 x 2.0 = 50.301) on a class where both gates run. On
# dev-linux neither one does -- the cold-start exemption keeps the ratchet
# from reading this entry, and the spec budget gate itself now runs only on
# a controlled class -- so today this factor is retained as the sizing
# witness rather than something either gate consumes here. On a class where
# both run, changing this number still moves the spec bound's effective
# firing point, not only the regression bar, so size it from the
# replicates, never from what would be convenient for a run to pass.
"first_paint.marker_cold_ms" = 2.0

# 8 report-only replicates, 2026-08-01, host loads 1.58 to 4.32, one
# unchanged binary pair, flood/minimal (gated statistic per replicate,
# median cadence_p99_ms of 3 trials): 14.577, 14.529, 14.500, 14.491,
# 14.655, 14.515, 14.525, 14.539. Median 14.527, half-width 0.56%. Worst
# excursion above the recorded value 1.006x (14.655 against 14.566); the
# 2x half-width rule asks 1.009x (14.527 + 2 x 0.082 against 14.566).
# 1.02 clears both, and is what this campaign earns -- not a retroactive
# explanation of the two loaded-host crossings the budget row's own
# comment already records (16.429 ms at load 3.9, 16.29 ms under a
# loaded bracket): this campaign's own load range reached 4.32 without
# reproducing either, so that spread stays unaccounted for and the
# budget row's "rerun quiet" guidance remains the operative mitigation
# for a reading above this ceiling.
"flood.cadence_p99_ms" = 1.02

# First campaign: 8 report-only replicates, 2026-08-01, host loads 1.31 to
# 1.98, one unchanged binary pair, input_path/minimal (gated statistic per
# replicate, median key_to_rpc_p99_us of 3 trials): 80.554, 80.727, 81.643,
# 80.155, 82.721, 80.579, 83.752, 81.834.
#
# A second campaign of 8 more replicates the same day drifted onto a
# heavier host (loads 1.29 to 6.48) and hit a failure mode this statistic
# has no defense against: input_path taps one process, so unlike the paired
# echo/scroll scenarios it has no null-pair calibration to refuse a
# contaminated run. A single criterion, stated before it was applied and
# applied uniformly to all 16 replicates from both campaigns: exclude a
# replicate if its pty->key-read segment p99 -- the diagnostic for the
# specific hop this metric measures -- exceeds 500us. The clean group sits
# at 109.9-124.4us and the contaminated group at 1032.9-2965.3us, a full
# order of magnitude apart with no reading anywhere near the threshold, so
# this line has no ambiguous cases to adjudicate. Six replicates are
# excluded: segment p99 2939.1, 2669.2, 2965.3, 2119.2, 1032.9, 1864.2us
# (gated values 1219.935, 569.016, 1751.224, 1033.173, 114.409, 100.961) --
# these characterize scheduler starvation, not view.
#
# Pooling the ten kept replicates: 80.155, 80.554, 80.579, 80.727, 81.643,
# 81.834, 82.721, 83.752, 85.529, 90.922. Median 81.7385, half-width 5.3835
# (6.59% of median). Worst excursion above the recorded value 1.127x
# (90.922 against 80.682); the 2x half-width rule asks 1.147x (81.7385 + 2
# x 5.3835 against 80.682). 1.15 clears both -- and this is the honest
# result: 80.682 x 1.15 = 92.784 stays under this cell's budget max
# (100.0), so the entry is inert by construction. This host could not
# produce a campaign quiet enough to separate view's real spread from
# scheduler starvation at this metric's scale; a genuinely quieter host is
# the only route to a functional factor here. The six excluded readings and
# any repeat of their scale still fail as new findings; "rerun quiet" stays
# the operative mitigation.
"input_path.key_to_rpc_p99_us" = 1.15

# 8 report-only replicates plus the record draw, 2026-08-16, host loads
# 0.07 to 0.50, one unchanged binary pair, echo_speculated/minimal (gated
# statistic per replicate, median speculated_ratio_p50 of 3 trials):
# 0.412, 0.392, 0.385, 0.429, 0.418, 0.419, 0.414, 0.422; record draw
# 0.3943. Nine-draw median 0.414, half-width 0.022 (5.3% of median).
# Worst excursion above the recorded value 1.088x (0.429 against 0.3943);
# the 2x half-width rule asks 1.162x (0.414 + 2 x 0.022 against 0.3943,
# which sits low in the band). 1.17 clears both. Wider than the host-wide
# ratio_p50 factor (1.06) because the numerator is a sub-millisecond
# predicted paint, so run-to-run scheduler noise is proportionally larger
# than on the engine-round-trip ratios that factor characterizes.
"echo_speculated.speculated_ratio_p50" = 1.17

# Same nine draws, speculated_paint_p99_ms: 0.301, 0.335, 0.328, 0.299,
# 0.298, 0.299, 0.299, 0.306; record draw 0.370. The record draw sits
# above all eight campaign draws, so the recorded value is the nine-draw
# median 0.301, hand-recorded -- anchoring at the tail draw would put the
# record floor above the class's whole honest band and every later honest
# record would refuse. Half-width 0.036 (12.0% of median); worst excursion
# above the recorded value 1.229x (0.370 against 0.301); the 2x half-width
# rule asks 1.239x. 1.25 clears both. A tail absolute never gates on this
# shared class (recorded here, gated on controlled classes); this entry
# exists to bound record-time moves in both directions.
"echo_speculated.speculated_paint_p99_ms" = 1.25

# 8 report-only replicates plus the record draw, 2026-08-16, host loads
# 1.20 to 1.55, one unchanged binary pair, remote_memory/minimal (gated
# statistic per replicate, pss_mb): 3.734, 3.707, 3.762, 3.746, 3.812,
# 3.730, 3.730, 3.773; record draw 3.711, kept as recorded -- it sits
# inside the band, second-lowest of nine. Nine-draw median 3.734,
# half-width 0.0525 (1.41% of median). Worst excursion above the recorded
# value 1.027x (3.812 against 3.7109); the 2x half-width rule asks 1.035x
# (3.734 + 2 x 0.0525 against 3.7109). 1.04 clears both. The paired
# memory/minimal draws from the same window (median 3.6885, half-width
# 0.87%) put the remote-vs-local delta at +1.2% -- inside the two-condition
# resolution rule, so the recorded number is the local footprint plus
# noise, which is the row's entire claim.
"remote_memory.pss_mb" = 1.04
