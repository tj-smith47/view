why = "the felt picker keystroke on this class: match_paint_p99_ms 19.4787 ms, 21.7 percent over the 16 ms bar and the bar untouched. What was measured, all of it from the 2026-09-06 record run this seat is the median of: three trials read 19.57, 19.48 and 19.35 ms at the p99; the same run's match_paint p50 trials read 7.20, 7.50 and 7.74 ms, median 7.50, and its first_page p99 trials 1.63, 1.67 and 1.69 ms, median 1.667. The ratchet declined both in favour of the recorded match_paint_p50_ms 7.159 and first_page_p99_ms 1.542. The seat this run replaces was 32.35 ms. The same cell on dev-linux reads match_paint_p99_ms 4.7 ms on the same fixture. On gh-macos its own runner reads match_paint_p99_ms 30.797 ms, so the gap is the platform rather than one host. Spotlight indexing held one core through the run, which is a condition of the measurement and not an attribution. The cause is open and a root-cause task is open for it."
