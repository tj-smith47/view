schema = 1

# The spec 3.1 budget table, in the form the bench gate can hold a
# measurement to. The spec states these as prose because it is read by
# people; this file states them as data because it is read by the gate, and
# scripts/check-budget-drift.sh fails CI if any number here stops appearing
# in the spec row it names.
#
# `classes` is optional: absent means every machine class. A budget the spec
# states for only one class, or a quantity a platform names differently, is
# written as separate entries rather than a per-class map, so a divergence
# between classes is visible in the file instead of hidden inside a value.
#
# A metric with no entry here has no spec budget. That is a real state, not
# an oversight: dev-macos's input path sits there deliberately, and the spec
# row says so.
#
# A row is judged on the seat its `config` names and on no other: `real`
# binds the login-shaped `user` fixture (budgets::REAL_CONFIG_SEATS), and a
# `fixture` row names the bench legs it bounds in `fixtures`. The fixture
# legs of a paired scenario keep their recorded ratchet either way -- that
# is where regression tripwiring belongs -- but a felt bound reaching one
# would attest to a moment under a config nobody runs, which is the whole
# substitution this vocabulary exists to refuse.

# 100, not the 232 this row carried until 2026-07-27. That 232 was the
# then-recorded 154.749 times ABSOLUTE_HEADROOM 1.5: a bound computed from
# the measurement it bounds, which no measurement can fail by construction.
# 100 is the bar the spec stated before anyone measured anything, so it is a
# promise rather than a restatement; the gap to it was carried as a
# shortfall until the row measured inside the bar.
#
# dev-linux tried to publish a measured spread for this statistic and came
# back with an honest inert one: "input_path.key_to_rpc_p99_us" = 1.15 in
# dev-linux.headroom.toml, pooled from 10 of 16 report-only replicates
# against the recorded 80.682 after excluding six whose pty->key-read
# segment p99 (a single criterion, applied uniformly to all 16) showed
# host-contention contamination the scenario has no calibration to refuse.
# 80.682 x 1.15 = 92.784 stays under this row's 100.0 max, so this cell
# still gates as a flat max with no excursion window -- the campaign could
# not separate view's real spread from scheduler starvation on this host at
# this statistic's scale. A breach here still fails as a new finding and
# should be rerun quiet before being read as a regression; a genuinely
# quieter campaign is the only route to a functional factor.
#
# classes repointed 2026-08-17 from ["dev-linux"] to ["controlled-linux"]:
# the spec budget gate loads this table only on a controlled-* class
# (bench.rs's `if controlled { load budgets }`), and dev-linux is never
# one, so the row as shipped could never fire regardless of what it
# bounds. dev-macos keeps no counterpart entry -- the spec states that
# omission deliberately ("dev-macos's input path sits there deliberately")
# -- so dropping `classes` entirely would newly bind a platform the spec
# has never measured; repointing to the linux-family controlled name
# preserves the same scope this row always had while making it reachable.
[[budget]]
spec_row = "view input path: key event read from the terminal -> RPC bytes written"
scenario = "input_path"
metric = "key_to_rpc_p99_us"
max = 100.0
classes = ["controlled-linux"]
kind = "diagnostic"
decomposes = "echo.view_p99_ms"
config = "fixture"
fixtures = ["minimal"]

[[budget]]
spec_row = "view output path: redraw event parsed -> terminal write"
scenario = "output_path"
metric = "p99_ms"
max = 1.0
kind = "diagnostic"
decomposes = "echo.view_p99_ms"
config = "fixture"
fixtures = ["minimal"]

# Both AI rows inherit their session-absent counterpart's bar rather than
# carrying one computed from the recording that seeded them.
# ai_session_active measures the same key_to_rpc_p99_us interval input_path
# does and ai_streaming the same p99_ms interval output_path does, so the
# claim these rows exist to hold -- an agent session on screen never
# degrades editor responsiveness -- is exactly the statement that the same
# bar still binds with a turn in flight. Deriving a max from the first
# recording instead is the defect that withdrew the input-path row's 232 us,
# the first-paint row's cold_ms bar and the remote row's 6.0: a bound taken
# from the measurement it bounds cannot fail.
#
# First recorded on controlled-linux 2026-08-21 in a quiet window:
# ai_session_active 70.865 us against the 100 us bar, ai_streaming 0.4306 ms
# against the 1 ms bar. The ratchet is the tighter instrument on both today
# (the x1.5 absolute default over those values, this class having published
# no measured spread yet), which is the relationship the first-paint row
# calls intended rather than redundant: the budget states where the number
# must be, the ratchet that it may not get worse than where it is.
#
# classes mirrors the cells' own arming rather than either counterpart's
# scoping. Both cells are matrix-scoped to the linux classes that record
# them (bin/bench.rs's CLASS_SCOPED), so a row naming another controlled
# class would bound a cell that class never measures.
[[budget]]
spec_row = "view input path, AI session active: key event read from the terminal -> RPC bytes written"
scenario = "ai_session_active"
metric = "key_to_rpc_p99_us"
max = 100.0
classes = ["controlled-linux"]
kind = "diagnostic"
decomposes = "echo.view_p99_ms"
config = "fixture"
fixtures = ["minimal"]

[[budget]]
spec_row = "view output path, agent response streaming: redraw event parsed -> terminal write"
scenario = "ai_streaming"
metric = "p99_ms"
max = 1.0
classes = ["controlled-linux"]
kind = "diagnostic"
decomposes = "echo.view_p99_ms"
config = "fixture"
fixtures = ["minimal"]

[[budget]]
spec_row = "Keypress -> cell change end-to-end, steady typing"
scenario = "echo"
metric = "view_p99_ms"
max = 8.0
kind = "felt"
felt = "you type and the character is on screen -- keypress to the changed cell, paired with nvim on the same host in the same run"
config = "real"

[[budget]]
spec_row = "Keypress -> cell change end-to-end, steady typing"
scenario = "echo"
metric = "ratio_p50"
max = 1.1
kind = "felt"
felt = "you type and the character is on screen -- keypress to the changed cell, paired with nvim on the same host in the same run"
config = "real"

# The two bench legs of the same moment, bounded at the same numbers. They
# are what the [[shortfall]] ledger below is written against: the felt row
# above is stated under a config a person runs and is judged there alone,
# while these hold the plugin set constant so the gap the ledger records is
# attributable at all. A diagnostic never carries the claim -- spec 3.1's
# own row for these says so.
[[budget]]
spec_row = "Keypress -> cell change, bench fixtures"
scenario = "echo"
metric = "view_p99_ms"
max = 8.0
kind = "diagnostic"
decomposes = "echo.view_p99_ms"
config = "fixture"
fixtures = ["minimal", "heavy"]

[[budget]]
spec_row = "Keypress -> cell change, bench fixtures"
scenario = "echo"
metric = "ratio_p50"
max = 1.1
kind = "diagnostic"
decomposes = "echo.ratio_p50"
config = "fixture"
fixtures = ["minimal", "heavy"]

[[budget]]
spec_row = "Sustained scroll, 100k-line file, tier full"
scenario = "scroll"
metric = "staleness_p99_ms"
max = 16.0
kind = "felt"
felt = "you hold a scroll key down through a 100k-line file and the text under your eyes keeps up, paired with nvim on the same host in the same run"
config = "real"

# The three first-paint rows bound the two bench legs and not the `user`
# one: their bars were set from a config that pays for no plugins ("the
# 30 ms promise is about the cold start of a config that is not paying for
# 15 plugins"), and the login-shaped leg is a real-config measurement no
# fixture row can state. That leg keeps its recorded ratchet, and the felt
# bound over the same launch is startup's settled-screen row.
[[budget]]
spec_row = "Shell painted before content: view's own UI shell visible, engine still loading"
scenario = "first_paint"
metric = "shell_visible_cold_ms"
max = 50.0
kind = "diagnostic"
decomposes = "startup.settled_ratio_p50"
config = "fixture"
fixtures = ["minimal", "heavy"]

# 30 ms, not a rounder number, because the ratchet already bounds this
# metric above it on a class where both gates run (the recorded 25.151
# times the class's measured headroom; 50.3 ms under the 2.0 factor
# dev-linux's headroom sidecar has sized, which stands as the sizing
# witness here since no controlled-* class has published its own factor
# yet). Any budget above that is one the ratchet always reaches first, so
# the budget could never be the thing that fires -- the same defect the
# withdrawn cold_ms bar had. 30 sits under the ratchet and over the
# measurement, so it can break. 0.30 bounds the paired quantity the
# absolute cannot: a class whose cold start is slow for reasons outside
# view still has to show view reaching the file in under a third of bare
# nvim's time. marker_cold_ms is a cold-start absolute: the spec budget
# gate reads this row, and the ratchet reads its own entry, on a
# controlled class only -- a shared class is exempt from both, per the
# attestation split -- so the 50.3 ms ratchet premise, and this bar's
# teeth, are live only there.
#
# 30 is also the bound the noise tolerance was built around, for the class
# that gates this row. This row is one-shot -- no median-of-trials stands
# between an ambient spike and the verdict -- the gating class publishes a
# x2.0 spread for the statistic (dev-linux's sidecar entry, pending a
# controlled-* class's own), and the recorded 25.151 sits 19% under the
# bar. So a load excursion past 30 is reported against the ceiling that
# recorded value earns, which is that same 50.3 ms, and fails past it. The
# bar keeps its teeth two ways: the tolerance applies only while the
# recorded quiet value stays under 30, and every run above 30 prints a
# line saying so.
[[budget]]
spec_row = "Content marker on screen: the opened file's first line painted"
scenario = "first_paint"
metric = "marker_cold_ms"
max = 30.0
kind = "diagnostic"
decomposes = "startup.settled_ratio_p50"
config = "fixture"
fixtures = ["minimal", "heavy"]

[[budget]]
spec_row = "Content marker on screen: the opened file's first line painted"
scenario = "first_paint"
metric = "marker_ratio_p50"
max = 0.30
kind = "diagnostic"
decomposes = "startup.settled_ratio_p50"
config = "fixture"
fixtures = ["minimal", "heavy"]

# The two startup cells, in the vocabulary spec 3.1 states them in: what a
# person waits through, and the one diagnostic that decomposes it. Neither
# carries a `classes` list yet -- dev-linux is the only class that has
# recorded the row (2026-09-06, settled_ratio_p50 1.096 and server_delta_ms
# 0.682), so a class restriction here would be a guess about where the
# number will next be recorded rather than a statement about where it means
# something. `server_delta_ms`'s 5 ms is the controlled-leg
# bar spec 3.1 states; a shared class reports it and, having no recorded
# value to earn a ceiling from, cannot fail on it.
[[budget]]
spec_row = "Launch -> the settled screen, real config"
scenario = "startup"
metric = "settled_ratio_p50"
max = 1.0
kind = "felt"
felt = "launch -> the screen you can start working in (tree, tabline, statusline settled), paired with nvim on the same host in the same run"
config = "real"

[[budget]]
spec_row = "Embedded engine startup cost"
scenario = "startup"
metric = "server_delta_ms"
max = 5.0
kind = "diagnostic"
decomposes = "startup.settled_ratio_p50"
config = "real"

# The flood row states its bound by reference: "coalesced paint stays inside
# the staleness budget". So the row that carries the number is the scroll
# row, and that is the one named here. Restating 16.0 against the flood row
# instead would put the same number in two spec rows, which is the drift this
# file exists to prevent.
#
# dev-linux now publishes a measured spread for this statistic:
# "flood.cadence_p99_ms" = 1.02 in dev-linux.headroom.toml, from an 8
# report-only-replicate campaign against the recorded 14.566. That
# campaign's own worst reading was 1.006x the recorded value across host
# loads up to 4.32, well short of the 1.02 ceiling it earns, and it did
# not reproduce the two earlier, unreproduced loaded-host crossings this
# comment used to carry as raw readings (16.429 ms at load 3.9, 16.29 ms
# under a loaded bracket) -- those stay above this ceiling and outside
# what the published spread covers. A third crossing was seen in the
# footprint-diet full-matrix campaign (task-footprint-diet-report.md):
# flood.minimal cadence_p99_ms read 15.370, 15.711, and 17.802 across
# three full-matrix runs, the 17.802 draw above every crossing recorded
# here so far. It neither gates nor ratchets on this class (tail
# statistic, budgets skipped on shared/dev-linux), so it did not fail;
# it is recorded for the same reason as the two above. A breach in
# (16.0, 14.566 x 1.02] reports as an excursion rather than failing; a
# breach above that, including a repeat of any of the three crossings
# above, still fails as a new finding and should be rerun quiet before
# being read as a regression: median-of-3 absorbs a lone excursion, not
# a sustained loaded run.
[[budget]]
spec_row = "Sustained scroll, 100k-line file, tier full"
scenario = "flood"
metric = "cadence_p99_ms"
max = 16.0
kind = "felt"
felt = "a plugin storm or a :terminal flood is pouring into the screen and it still answers your scroll, paired with nvim on the same host in the same run"
config = "real"

# The spec row says "PSS", which names a Linux quantity. macOS has no PSS;
# its counterpart is the phys_footprint the memory scenario already records.
# Two entries rather than one renamed metric, so neither class pretends to
# measure the other's quantity.
#
# classes repointed 2026-08-17 from ["dev-linux"]/["dev-macos"] to their
# controlled-* counterparts: the same dead-by-construction defect as the
# input-path row above (the spec budget gate never loads this table for a
# non-controlled-* class), fixed the same way -- the platform split stays
# exactly as it was, only the class family's name changes from the shared
# host to the controlled one that can actually gate it.
[[budget]]
spec_row = "view-side memory (PSS), 10 buffers, post-workload"
scenario = "memory"
metric = "pss_mb"
max = 150.0
classes = ["controlled-linux"]
kind = "resource"
config = "fixture"
fixtures = ["minimal"]

[[budget]]
spec_row = "view-side memory (PSS), 10 buffers, post-workload"
scenario = "memory"
metric = "phys_footprint_mb"
max = 150.0
classes = ["controlled-macos"]
kind = "resource"
config = "fixture"
fixtures = ["minimal"]

# Superseded 2026-08-17: this row used to bound pss_mb at 6.0, "headroom over the recorded 4.962
# local-spawn figure this class inherits from memory.minimal", scoped to
# dev-linux. That scoping made the row dead by construction: the spec
# budget gate loads only on a controlled-* class (bench.rs's `if controlled
# { load budgets }`), and dev-linux is never one, so a row naming only
# dev-linux can never fire regardless of what it bounds -- the same defect
# this file's own supervision-row and echo_speculated-row comments already
# name for their second metrics. It also bounded the wrong quantity: pss_mb
# on this row is a settled-process absolute that swings +/-20% across days
# on shared dev-linux (the ratchet finding that triggered this amendment),
# which a fixed MB ceiling cannot distinguish from a real regression any
# better than the ratchet's own headroom sidecar could.
#
# The row now bounds remote_local_ratio -- remote-leg absolute divided by
# local-leg absolute, each drawn from one trial's own pair of sequential,
# non-co-resident spawns (`view_bench::scenarios::remote_memory::run_paired`)
# -- which is the row's actual claim ("view's own local footprint once the
# engine runs remotely" costs ~nothing over a local engine). A single
# window measured that delta at +1.2% against a host regime swing that
# moved the absolutes +/-20% (see `remote_memory`'s module doc for the
# recording); a tracked amendment
# (.claude/plans/2026-08-09-p5_5-remote.md:405-413) shows the delta
# holding across the regime itself, which is why this statistic gates
# everywhere rather than only on a controlled class. 1.10 is stated the
# way the input-path row's original
# 100 us and the echo row's 1.10 ratio bar were: a promise made before a
# controlled class has measured this cell, not a number computed from a
# recording -- the defect that made the withdrawn 232 us and cold_ms bars,
# and this row's own withdrawn 6.0, unfalsifiable. No `classes` key: unlike
# the platform-split memory rows above (two entries because pss_mb and
# phys_footprint_mb name different quantities), remote_local_ratio is one
# dimensionless statistic valid on every platform, so this row applies to
# every class the way most unscoped rows in this file already do, and
# fires the moment any controlled-* class runs it rather than naming one
# class today and excluding every other one forever.
[[budget]]
spec_row = "Remote editing: view's own local footprint once the engine runs remotely"
scenario = "remote_memory"
metric = "remote_local_ratio"
max = 1.10
kind = "resource"
config = "fixture"
fixtures = ["minimal"]

# Both picker rows bound the tail (p99) of the row's own statistic, so the
# spec bar holds at the worst measured open/keystroke rather than at a
# median a bad tail could hide behind. The scan row's other half --
# streaming, never scan-then-show -- is not a number and has no entry: the
# scenario itself refuses to produce first_page metrics at all unless it
# observed a held query's painted result set grow while the walk was still
# running, so a scan-then-show regression fails the row before any budget
# is consulted.
[[budget]]
spec_row = "Picker match: keystroke -> first results painted, 100k resident entries"
scenario = "picker"
metric = "match_paint_p99_ms"
max = 16.0
kind = "felt"
felt = "you type in the picker over 100k entries and the matching results are on screen under your fingers"
config = "fixture"
fixtures = ["minimal"]

[[budget]]
spec_row = "Picker scan: 1M-file tree"
scenario = "picker"
metric = "first_page_p99_ms"
max = 100.0
kind = "felt"
felt = "you open the picker on a million-file tree and the first page of results is already there"
config = "fixture"
fixtures = ["minimal"]

# 12500 is not a chosen round number: it is what the heartbeat's own two
# constants add up to, plus what reading the result costs. The sum is
# `HEARTBEAT_WEDGE_THRESHOLD` (10 s) plus one `HEARTBEAT_PROBE_INTERVAL`
# (2 s) -- 12000, the same `view_oracle::hang::DETECTION_BOUND` computes --
# because a probe fired just before the engine stops serving is the last one
# it can answer, so the verdict cannot arrive sooner. The remaining 500 ms
# is that module's `OBSERVATION_SLACK`, the identical allowance its
# `detection_deadline()` adds before the oracle asserts this same quantity,
# and it is here for the same reason: the bound is reached exactly rather
# than approached, so a comparison allowing nothing for the frame that
# paints the banner and the poll that reads it fails honest measurements.
# The scenario's samples cover the probe interval rather than repeating one
# undocumented offset into it, so this p99 is the top of that cover -- one
# stratum of the ceiling at most, and on the ceiling itself when a stratum
# lands just past a tick. That is what makes the allowance load-bearing
# rather than decorative. The bound still fails when detection takes longer
# than the constants promise: 500 ms is a quarter of the smallest thing that
# can go wrong here, which is a whole probe interval.
#
# The row's second metric, restart_rehydrate_p99_ms, deliberately has no
# entry here. Nothing in the spec bounds how long a replacement engine may
# take to bring a recovered buffer back, and a bound written from the first
# recording would be a number computed from the measurement it bounds --
# the defect that withdrew the input-path row's 232 and the first-paint
# row's cold_ms bar.
#
# What the recording buys is a seed, not a gate. Both of this row's metrics
# are p99s, and a tail is recorded but never gated on a shared class
# (`view_harness::baselines::gate_headroom`), so the ratchet leaves both
# alone on dev-linux; the max below attests only where `is_controlled_class`
# holds, which no class does yet. So nothing gates either metric today: the
# recorded baseline is what a controlled class would ratchet from, and the
# max is what it would attest against.
[[budget]]
spec_row = "Engine supervision: time to notice a read-side hang"
scenario = "supervision"
metric = "wedge_detect_p99_ms"
max = 12500.0
kind = "felt"
felt = "the engine stops answering and the banner naming the wedge is on screen instead of a frozen editor"
config = "fixture"
fixtures = ["minimal"]

# 1.0 is the ceiling the speculated-echo row exists to beat, stated before
# anything measured it: at 1.0 view shows the typed glyph exactly as fast as
# bare nvim does, and a prediction that does not get under that bought
# nothing. It is a promise rather than a restatement of a recording, which is
# what the input-path row's withdrawn 232 and the first-paint row's withdrawn
# cold_ms bar were.
#
# linux-family only, on the same terms as the input-path row above: it is
# the one class family this row has ever run on, and a bar published for
# classes nobody has measured is a guess wearing a gate's clothes.
#
# classes repointed 2026-08-17 from ["dev-linux"] to ["controlled-linux"]:
# the same dead-by-construction defect the input-path and memory rows
# above carried (the spec budget gate never loads this table for a
# non-controlled-* class) applied here too. Repointing to the controlled
# name keeps the exact same linux-only scope this row always had, rather
# than widening onto a platform this row has never run on.
#
# The row's second metric, speculated_paint_p99_ms, deliberately has no entry
# here, for the reason supervision's restart_rehydrate_p99_ms has none:
# nothing in the spec bounds how long a predicted paint may take. It is also
# a p99, so a shared class records it and never gates it
# (`view_harness::baselines::gate_headroom`) -- the recording is the seed a
# controlled class would ratchet from.
[[budget]]
spec_row = "Speculative echo: keypress -> predicted glyph visible, RTT hidden"
scenario = "echo_speculated"
metric = "speculated_ratio_p50"
max = 1.0
classes = ["controlled-linux"]
kind = "felt"
felt = "you type and the character is on screen on view's own tick, without waiting for the engine to answer"
config = "real"

# Metrics measured outside their budget today.
#
# A shortfall is how an unmet budget is allowed to exist: it must be written
# down, with the value it was accepted at and why. The gate then fails on a
# metric outside budget with no entry here (a new shortfall, silently
# introduced) and on a listed one that got worse than its accepted value (an
# existing shortfall, quietly widening). It passes a listed one that held or
# improved, so a budget the project has not met yet does not block work on
# everything else, and cannot be forgotten either.
#
# One reading does not earn an entry here: a metric whose recorded baseline
# on this class is inside its budget, measuring outside it on a class that
# has published a measured spread for that statistic, is reported as an
# excursion against the ceiling the recorded value earns and does not fail.
# Writing such a reading down as an accepted shortfall would put ambient
# load in this file as though it were a property of view.
#
# The 2026-08-03 ratification by the user covered eleven entries as
# accepted-and-gated debt, together with the spec §3.1 echo-row amendment;
# the ones spent since are deleted with a note in their place. The three
# echo ratio_p50 entries carry a pinned closure path in the P4 plan:
# input-thread/runtime-loop unification first, incremental rendering second.
# The two first_paint marker_ratio_p50 minimal entries postdate it: they are
# what the 2026-09-06 retake under the answering pty made visible, an entry
# each rather than a widened bar.
#
# Listed below: 15 entries -- 7 dev-linux, 8 dev-macos.
#
# A count stated in prose about the file's own contents is a fact the file
# can check, so the line above is pinned against the parsed entries; the
# header it replaces stated numbers nothing read, and they were wrong by
# the time anyone audited the ledger from them.
#
# Improving past the budget does not need an edit here to pass; deleting the
# entry is the housekeeping that follows.
#
# Every entry below names class = "dev-linux" or "dev-macos", neither a
# controlled-* class. They predate the gate-attestation split (spec 3.1
# budgets attest on controlled classes only; `bin/bench.rs` loads this
# [[budget]]/[[shortfall]] table at all only when `is_controlled_class`
# holds), so none of them can fire against a live budget check today: the
# table that would consult them is never loaded on the shared class they
# name. They are left in place rather than deleted, because deleting them
# would erase the only record of the dev-host deficits the user ratified
# on 2026-08-03 as accepted-and-gated debt -- the acknowledgment survives
# even though the enforcement it was written for does not yet exist. They
# do not become live on their own: find_shortfall matches an entry's class
# field exactly, so a dev-linux entry never matches a controlled-linux run
# no matter what that class later records. Only editing an entry's class
# field to name the controlled-* class it should gate on -- the way the
# four dead [[budget]] rows were repointed -- would revive it; until that
# edit happens, every entry here stays exactly what it is: an honest
# ledger of debt this project owes, not a bound anything currently checks.

[[shortfall]]
scenario = "echo"
fixture = "minimal"
metric = "ratio_p50"
class = "dev-linux"
accepted = 1.1719342968313597
why = "view's own overhead, not the UI protocol's. Four explanations have been falsified by measurement: a thread-hop floor, the pty transport, the instrumentation itself, and being an out-of-process UI at all. The last was settled by the echo_control row, where nvim's own out-of-process UI costs echo_control.control_ratio_p50 0.994 against bare nvim on this class. Both ratified levers have now landed and been measured paired. (1) Folding the input thread into the runtime poll loop collapsed the key-decoded->loop-wake segment (52.4 -> 13.9 us p50, 95.9 -> 28.4 us p99) while moving this ratio only 1.215 -> 1.173 and 1.234 -> 1.193 across two same-session A/B trial pairs (2026-08-08). (2) Incremental surface rendering behind the shadow-equivalence guard moved this cell within session noise in both directions (1.170 -> 1.172 and 1.159 -> 1.180 across two same-session trial pairs, 2026-08-08) -- the minimal fixture's per-frame surface is two layers, so there was almost no memory for the cache to stop touching, while the same change put echo/heavy inside its budget both rounds. The input side is within a few us of the pty floor and the paint side's surface rebuild is now reused; the remaining residual is dominated by the rpc-written->redraw-parsed segment (~357 us p50 of a ~610 us round trip), which no view-side input or paint lever addresses. User-adjudicated 2026-08-09: the residual is accepted and the <= 1.10 bar unchanged; the pinned closure path is the speculative-echo invention, which removes the engine round trip from perceived echo rather than shrinking view's share of the measured one. When it lands, the speculated path gates on its own metric -- this entry keeps measuring the honest unspeculated round trip."

# echo.heavy ratio_p50 dev-linux is no longer listed: incremental surface
# rendering measured the cell inside the 1.1 budget in two same-session
# paired rounds (1.101 -> 1.081 and 1.111 -> 1.083, 2026-08-08, median of
# 3 trials each, per-leg 1-min loads 0.46-1.60 start / 0.24-0.60 end), a
# consistent -0.02..-0.03 paired delta where the minimal fixture moved
# within noise -- the heavy fixture's larger chrome state is exactly the
# memory the surface cache stops re-cloning per frame. The prior accepted
# value was 1.1838 (ratified 2026-08-03); the same-day pre-change reads
# were already 1.101-1.125, so part of the clearance is a quieter session
# -- if a later gate run on this shared class lands back outside 1.1,
# that is a new finding to re-adjudicate, not a license to relist this
# entry unexamined.

[[shortfall]]
scenario = "first_paint"
fixture = "heavy"
metric = "marker_cold_ms"
class = "dev-linux"
accepted = 120.464107
why = "the 15-plugin fixture's cold start, against a bar the plugin-free leg sets. On the plugin-free fixture marker_cold_ms reads 25.2 ms. Most of the gap is plugin init the engine child must finish before the file can be on screen. It is not a reason to widen the bar: the 30 ms promise is about the cold start of a config that is not paying for 15 plugins. The accepted value is view's own cold absolute and carries no comparison to bare nvim; the paired statement of this cell is the marker_ratio_p50 entry below."

[[shortfall]]
scenario = "first_paint"
fixture = "minimal"
metric = "marker_ratio_p50"
class = "dev-linux"
accepted = 1.0936971456650568
why = "the plugin-free half of the same 2026-09-06 retake the heavy entry below records, and the same attribution: view reaches the file at marker_ratio_p50 1.094x bare nvim's p50 here, which is the serial post-VimEnter attach-plus-takeover round trip the late-attach design pays while nvim's own TUI attaches before init runs. This fixture has no plugin init to hide that cost behind, so it is the cleanest reading of it on this class. The cell was inside the 0.30 bar before the retake only because the bare arm it divided by was waiting out its own background-query timeout on a pty that never answered the DSR; the bar is not widened for the true reading, the deficit is ledgered until the pre-v0.1.0 performance session root-causes it."

[[shortfall]]
scenario = "first_paint"
fixture = "heavy"
metric = "marker_ratio_p50"
class = "dev-linux"
accepted = 1.1007776687309356
why = "the same cell and the same event as the marker_cold_ms shortfall above, expressed paired, re-seated 2026-09-06 from the dev-linux retake under a pty that answers the queries nvim's tty startup asks. It replaces 0.460, which was a ratio against a bare-nvim arm waiting out its own background-query timeout. Measured now: marker_ratio_p50 reads 1.101x bare nvim's p50 on this fixture. The retake trials read 55.079 ms for view against 50.037 ms for bare nvim. The whole paired row reads the same way, an entry per fixture, so view trails bare nvim by 8-10% on every cold cell rather than beating it. What it trails by is the post-VimEnter attach-plus-takeover round trip the late-attach design pays serially, since nvim's own TUI attaches before init runs; attribution past that outline is owed to the pre-v0.1.0 performance session and to the settled-screen cell's own work. The 0.30 bar is untouched: it is the promise the user stated, and this entry records the gap rather than retiring it."

# The three real-config seats recorded on 2026-09-06, in the quiet windows
# the S1.11 report logs. Each is the felt row measured where its own
# statement seats it -- the login-shaped user fixture, paired against bare
# nvim in the same interleaved run -- so the gap each records is the moment
# a person lives through and not a bench leg standing in for it.

[[shortfall]]
scenario = "startup"
fixture = "user"
metric = "settled_ratio_p50"
class = "dev-linux"
accepted = 1.0897897644234942
why = "the felt launch on the config it claims: settled_ratio_p50 reads 1.0898, which is 9.0 percent over the 1.0 bar. The record run trials read 56.031 ms for view against bare nvim's 51.415 ms under lazy.nvim, noice and nvim-notify. What the gap is not: the diagnostic that decomposes this cell, server_delta_ms, reads -0.076 ms on the same run, so the embedded engine's own startup costs nothing here. What is measured of the cause: view attaches and takes over serially after the config's VimEnter has run, where nvim's own TUI is attached before init starts, and the first_paint entries above record the same event on the bench fixtures, each against its own recorded ratio. Root-causing it past that outline is an open task; the bar is untouched, and this entry records the gap rather than retiring it."

[[shortfall]]
scenario = "echo"
fixture = "user"
metric = "ratio_p50"
class = "dev-linux"
accepted = 1.1097269280826585
why = "the felt typing row on the config it claims: ratio_p50 reads 1.1097, which is 0.9 percent over the 1.10 bar. The interleaved run trials read view p50 0.920 ms against bare nvim's 0.829 ms. The same cell's view-side tail, view_p99_ms 1.583 ms, sits well inside its own 8 ms bound. Attribution is the echo.minimal entry above, reproduced under a real plugin config: the residual is the rpc-written to redraw-parsed leg of the round trip, which no view-side input or paint lever addresses. The plugin stack changes the cell's shape hardly at all: ratio_p50 reads 1.1097 on the login-shaped fixture. The plugin-free leg records ratio_p50 1.1301 on the entry above. The pinned closure path is unchanged and is now measured on this same config: echo_speculated.speculated_ratio_p50 reads 0.332 of the paired bare-nvim run, which removes the engine round trip from perceived echo instead of shrinking view's share of the measured one. This entry keeps measuring the honest unspeculated round trip."

[[shortfall]]
scenario = "flood"
fixture = "user"
metric = "cadence_p99_ms"
class = "dev-linux"
accepted = 16.914409
why = "the redraw cadence under a terminal flood on the login-shaped fixture: cadence_p99_ms reads 16.914 ms at the p99 against the 16 ms frame. What is measured of the cause: both sides miss the frame under this plugin stack, and the recorded cadence_p99_ratio is 0.981 and pace_ratio 1.018, so view answers on the engine's own redraw cadence under the stack and drains within 2 percent of the lines nvim drains in the same fixed window. The same run's trials read bare nvim's own cadence p99 at 17.480 ms, and its worst no-paint gap, reported and not gated, at 48.9 ms. Attribution past that -- what the stack makes the engine spend per redraw -- is an open task; the bar is untouched."

# input_path.minimal key_to_rpc_p99_us dev-linux is no longer listed. The
# entry accepted 112.647 against the 100.0 bound and named its own
# retirement condition -- "the entry stays until a measurement reads inside
# 100" -- while attributing the gap to a hypervisor-side level shift no view
# work could reach. Every measurement taken on 2026-08-09 is inside 100, so
# the condition is met many times over: 49.674, 51.362 and 72.311 from three
# full-matrix runs, 50.077 50.192 50.831 53.257 54.530 from one scoped
# replicate campaign at 1-min loads 0.48-1.03, 57.413 57.883 58.451 60.212
# 60.245 60.779 from a second logged campaign at loads 0.23-1.59, and
# 40.176 from the post-reboot gate leg of the 2026-08-09 diet-campaign
# re-record -- a third distinct level this host held in one day, on top of
# the two campaigns above, strengthening rather than undermining the
# level-shift evidence. The code that moved the level is the
# input-thread/runtime-loop unification, whose paired A/B collapsed the
# key-decoded->loop-wake segment.
#
# The entry's level-shift attribution is confirmed rather than falsified,
# and that is the part worth carrying forward: the two scoped campaigns are
# tight internally (4.5us and 3.4us spreads) and 16% apart from each other,
# hours apart, on the same binary, so this host holds a level for a session
# and picks a different one later. A single campaign's median is therefore
# a reading of this afternoon, not of view. The recorded baseline moved
# 80.682 -> 59.332 by hand-edit, taking the median of the logged campaign,
# because a replicate median below the class's published 1.15 spread is not
# something --record will write in one draw. Only the retirement of the
# accepted shortfall rests on all of this, and that rests on the bound of
# 100 alone, which no reading in either campaign approaches.

