schema = 1

# The spec 3.1 budget table, in the form the bench gate can hold a
# measurement to. The spec states these as prose because it is read by
# people; this file states them as data because it is read by the gate, and
# scripts/check-budget-drift.sh fails CI if any number here stops appearing
# in the spec row it names.
#
# `classes` is optional: absent means every machine class. A budget the spec
# states for only one class, or a quantity a platform names differently, is
# written as separate entries rather than a per-class map, so a divergence
# between classes is visible in the file instead of hidden inside a value.
#
# A metric with no entry here has no spec budget. That is a real state, not
# an oversight: dev-macos's input path sits there deliberately, and the spec
# row says so.

# 100, not the 232 this row carried until 2026-07-27. That 232 was the
# then-recorded 154.749 times ABSOLUTE_HEADROOM 1.5: a bound computed from
# the measurement it bounds, which no measurement can fail by construction.
# 100 is the bar the spec stated before anyone measured anything, so it is a
# promise rather than a restatement; the gap to it was carried as a
# shortfall until the row measured inside the bar.
#
# dev-linux tried to publish a measured spread for this statistic and came
# back with an honest inert one: "input_path.key_to_rpc_p99_us" = 1.15 in
# dev-linux.headroom.toml, pooled from 10 of 16 report-only replicates
# against the recorded 80.682 after excluding six whose pty->key-read
# segment p99 (a single criterion, applied uniformly to all 16) showed
# host-contention contamination the scenario has no calibration to refuse.
# 80.682 x 1.15 = 92.784 stays under this row's 100.0 max, so this cell
# still gates as a flat max with no excursion window -- the campaign could
# not separate view's real spread from scheduler starvation on this host at
# this statistic's scale. A breach here still fails as a new finding and
# should be rerun quiet before being read as a regression; a genuinely
# quieter campaign is the only route to a functional factor.
[[budget]]
spec_row = "view input path: key event read from the terminal -> RPC bytes written"
scenario = "input_path"
metric = "key_to_rpc_p99_us"
max = 100.0
classes = ["dev-linux"]

[[budget]]
spec_row = "view output path: redraw event parsed -> terminal write"
scenario = "output_path"
metric = "p99_ms"
max = 1.0

[[budget]]
spec_row = "Keypress -> cell change end-to-end, steady typing"
scenario = "echo"
metric = "view_p99_ms"
max = 8.0

[[budget]]
spec_row = "Keypress -> cell change end-to-end, steady typing"
scenario = "echo"
metric = "ratio_p50"
max = 1.1

[[budget]]
spec_row = "Sustained scroll, 100k-line file, tier full"
scenario = "scroll"
metric = "staleness_p99_ms"
max = 16.0

[[budget]]
spec_row = "First paint: view's own UI shell visible, engine still loading"
scenario = "first_paint"
metric = "shell_visible_cold_ms"
max = 50.0

# 30 ms, not a rounder number, because the ratchet already bounds this
# metric above it on a class where both gates run (the recorded 25.151
# times the class's measured headroom; 50.3 ms under the 2.0 factor
# dev-linux's headroom sidecar has sized, which stands as the sizing
# witness here since no controlled-* class has published its own factor
# yet). Any budget above that is one the ratchet always reaches first, so
# the budget could never be the thing that fires -- the same defect the
# withdrawn cold_ms bar had. 30 sits under the ratchet and over the
# measurement, so it can break. 0.30 bounds the paired quantity the
# absolute cannot: a class whose cold start is slow for reasons outside
# view still has to show view reaching the file in under a third of bare
# nvim's time. marker_cold_ms is a cold-start absolute: the spec budget
# gate reads this row, and the ratchet reads its own entry, on a
# controlled class only -- a shared class is exempt from both, per the
# attestation split -- so the 50.3 ms ratchet premise, and this bar's
# teeth, are live only there.
#
# 30 is also the bound the noise tolerance was built around, for the class
# that gates this row. This row is one-shot -- no median-of-trials stands
# between an ambient spike and the verdict -- the gating class publishes a
# x2.0 spread for the statistic (dev-linux's sidecar entry, pending a
# controlled-* class's own), and the recorded 25.151 sits 19% under the
# bar. So a load excursion past 30 is reported against the ceiling that
# recorded value earns, which is that same 50.3 ms, and fails past it. The
# bar keeps its teeth two ways: the tolerance applies only while the
# recorded quiet value stays under 30, and every run above 30 prints a
# line saying so.
[[budget]]
spec_row = "First paint: the opened file's content on screen"
scenario = "first_paint"
metric = "marker_cold_ms"
max = 30.0

[[budget]]
spec_row = "First paint: the opened file's content on screen"
scenario = "first_paint"
metric = "marker_ratio_p50"
max = 0.30

# The flood row states its bound by reference: "coalesced paint stays inside
# the staleness budget". So the row that carries the number is the scroll
# row, and that is the one named here. Restating 16.0 against the flood row
# instead would put the same number in two spec rows, which is the drift this
# file exists to prevent.
#
# dev-linux now publishes a measured spread for this statistic:
# "flood.cadence_p99_ms" = 1.02 in dev-linux.headroom.toml, from an 8
# report-only-replicate campaign against the recorded 14.566. That
# campaign's own worst reading was 1.006x the recorded value across host
# loads up to 4.32, well short of the 1.02 ceiling it earns, and it did
# not reproduce the two earlier, unreproduced loaded-host crossings this
# comment used to carry as raw readings (16.429 ms at load 3.9, 16.29 ms
# under a loaded bracket) -- those stay above this ceiling and outside
# what the published spread covers. A third crossing was seen in the
# footprint-diet full-matrix campaign (task-footprint-diet-report.md):
# flood.minimal cadence_p99_ms read 15.370, 15.711, and 17.802 across
# three full-matrix runs, the 17.802 draw above every crossing recorded
# here so far. It neither gates nor ratchets on this class (tail
# statistic, budgets skipped on shared/dev-linux), so it did not fail;
# it is recorded for the same reason as the two above. A breach in
# (16.0, 14.566 x 1.02] reports as an excursion rather than failing; a
# breach above that, including a repeat of any of the three crossings
# above, still fails as a new finding and should be rerun quiet before
# being read as a regression: median-of-3 absorbs a lone excursion, not
# a sustained loaded run.
[[budget]]
spec_row = "Sustained scroll, 100k-line file, tier full"
scenario = "flood"
metric = "cadence_p99_ms"
max = 16.0

# The spec row says "PSS", which names a Linux quantity. macOS has no PSS;
# its counterpart is the phys_footprint the memory scenario already records.
# Two entries rather than one renamed metric, so neither class pretends to
# measure the other's quantity.
[[budget]]
spec_row = "view-side memory (PSS), 10 buffers, post-workload"
scenario = "memory"
metric = "pss_mb"
max = 150.0
classes = ["dev-linux"]

[[budget]]
spec_row = "view-side memory (PSS), 10 buffers, post-workload"
scenario = "memory"
metric = "phys_footprint_mb"
max = 150.0
classes = ["dev-macos"]

# Both picker rows bound the tail (p99) of the row's own statistic, so the
# spec bar holds at the worst measured open/keystroke rather than at a
# median a bad tail could hide behind. The scan row's other half --
# streaming, never scan-then-show -- is not a number and has no entry: the
# scenario itself refuses to produce first_page metrics at all unless it
# observed a held query's painted result set grow while the walk was still
# running, so a scan-then-show regression fails the row before any budget
# is consulted.
[[budget]]
spec_row = "Picker match: keystroke -> first results painted, 100k resident entries"
scenario = "picker"
metric = "match_paint_p99_ms"
max = 16.0

[[budget]]
spec_row = "Picker scan: 1M-file tree"
scenario = "picker"
metric = "first_page_p99_ms"
max = 100.0

# 12500 is not a chosen round number: it is what the heartbeat's own two
# constants add up to, plus what reading the result costs. The sum is
# `HEARTBEAT_WEDGE_THRESHOLD` (10 s) plus one `HEARTBEAT_PROBE_INTERVAL`
# (2 s) -- 12000, the same `view_oracle::hang::DETECTION_BOUND` computes --
# because a probe fired just before the engine stops serving is the last one
# it can answer, so the verdict cannot arrive sooner. The remaining 500 ms
# is that module's `OBSERVATION_SLACK`, the identical allowance its
# `detection_deadline()` adds before the oracle asserts this same quantity,
# and it is here for the same reason: the bound is reached exactly rather
# than approached, so a comparison allowing nothing for the frame that
# paints the banner and the poll that reads it fails honest measurements.
# The scenario's samples cover the probe interval rather than repeating one
# undocumented offset into it, so this p99 is the top of that cover -- one
# stratum of the ceiling at most, and on the ceiling itself when a stratum
# lands just past a tick. That is what makes the allowance load-bearing
# rather than decorative. The bound still fails when detection takes longer
# than the constants promise: 500 ms is a quarter of the smallest thing that
# can go wrong here, which is a whole probe interval.
#
# The row's second metric, restart_rehydrate_p99_ms, deliberately has no
# entry here. Nothing in the spec bounds how long a replacement engine may
# take to bring a recovered buffer back, and a bound written from the first
# recording would be a number computed from the measurement it bounds --
# the defect that withdrew the input-path row's 232 and the first-paint
# row's cold_ms bar.
#
# What the recording buys is a seed, not a gate. Both of this row's metrics
# are p99s, and a tail is recorded but never gated on a shared class
# (`view_harness::baselines::gate_headroom`), so the ratchet leaves both
# alone on dev-linux; the max below attests only where `is_controlled_class`
# holds, which no class does yet. So nothing gates either metric today: the
# recorded baseline is what a controlled class would ratchet from, and the
# max is what it would attest against.
[[budget]]
spec_row = "Engine supervision: time to notice a read-side hang"
scenario = "supervision"
metric = "wedge_detect_p99_ms"
max = 12500.0

# Metrics measured outside their budget today.
#
# A shortfall is how an unmet budget is allowed to exist: it must be written
# down, with the value it was accepted at and why. The gate then fails on a
# metric outside budget with no entry here (a new shortfall, silently
# introduced) and on a listed one that got worse than its accepted value (an
# existing shortfall, quietly widening). It passes a listed one that held or
# improved, so a budget the project has not met yet does not block work on
# everything else, and cannot be forgotten either.
#
# One reading does not earn an entry here: a metric whose recorded baseline
# on this class is inside its budget, measuring outside it on a class that
# has published a measured spread for that statistic, is reported as an
# excursion against the ceiling the recorded value earns and does not fail.
# Writing such a reading down as an accepted shortfall would put ambient
# load in this file as though it were a property of view.
#
# Every entry below (five dev-linux, six dev-macos) was ratified by the user
# on 2026-08-03 as accepted-and-gated debt, together with the spec §3.1
# echo-row amendment. The four echo ratio_p50 entries carry a pinned closure
# path in the P4 plan: input-thread/runtime-loop unification first,
# incremental rendering second.
#
# Improving past the budget does not need an edit here to pass; deleting the
# entry is the housekeeping that follows.

[[shortfall]]
scenario = "echo"
fixture = "minimal"
metric = "ratio_p50"
class = "dev-linux"
accepted = 1.1719342968313597
why = "view's own overhead, not the UI protocol's. Four explanations have been falsified by measurement: a thread-hop floor, the pty transport, the instrumentation itself, and being an out-of-process UI at all. The last was settled by the echo_control row, where nvim's own remote UI costs 1.038 against bare nvim on this class. Both ratified levers have now landed and been measured paired. (1) Folding the input thread into the runtime poll loop collapsed the key-decoded->loop-wake segment (52.4 -> 13.9 us p50, 95.9 -> 28.4 us p99) while moving this ratio only 1.215 -> 1.173 and 1.234 -> 1.193 across two same-session A/B pairs (2026-08-08). (2) Incremental surface rendering behind the shadow-equivalence guard moved this cell within session noise in both directions (1.170 -> 1.172 and 1.159 -> 1.180 across two same-session pairs, 2026-08-08) -- the minimal fixture's per-frame surface is two layers, so there was almost no memory for the cache to stop touching, while the same change put echo/heavy inside its budget both rounds. The input side is within a few us of the pty floor and the paint side's surface rebuild is now reused; the remaining residual is dominated by the rpc-written->redraw-parsed segment (~357 us p50 of a ~610 us round trip), which no view-side input or paint lever addresses. User-adjudicated 2026-08-09: the residual is accepted and the <= 1.10 target unchanged; the pinned closure path is the speculative-echo invention, which removes the engine round trip from perceived echo rather than shrinking view's share of the measured one. When it lands, the speculated path gates on its own metric -- this entry keeps measuring the honest unspeculated round trip."

# echo.heavy ratio_p50 dev-linux is no longer listed: incremental surface
# rendering measured the cell inside the 1.1 budget in two same-session
# paired rounds (1.101 -> 1.081 and 1.111 -> 1.083, 2026-08-08, median of
# 3 trials each, per-leg 1-min loads 0.46-1.60 start / 0.24-0.60 end), a
# consistent -0.02..-0.03 paired delta where the minimal fixture moved
# within noise -- the heavy fixture's larger chrome state is exactly the
# memory the surface cache stops re-cloning per frame. The prior accepted
# value was 1.1838 (ratified 2026-08-03); the same-day pre-change reads
# were already 1.101-1.125, so part of the clearance is a quieter session
# -- if a later gate run on this shared class lands back outside 1.1,
# that is a new finding to re-adjudicate, not a license to relist this
# entry unexamined.

[[shortfall]]
scenario = "first_paint"
fixture = "heavy"
metric = "marker_cold_ms"
class = "dev-linux"
accepted = 120.464107
why = "the 14-plugin fixture's cold start, against a bar set from the minimal fixture's 24.9 ms. Bare nvim opening the same fixture reaches the same marker at 199.8 ms p99 in the same paired run, so most of this is plugin init the engine child must finish before the file can be on screen, and view still gets there first by 79 ms. It is not a reason to widen the bar: the 30 ms promise is about the cold start of a config that is not paying for 14 plugins."

[[shortfall]]
scenario = "first_paint"
fixture = "heavy"
metric = "marker_ratio_p50"
class = "dev-linux"
accepted = 0.4601985941432818
why = "the same cell and the same event as the marker_cold_ms shortfall above, expressed paired. The 0.30x bar was set against the minimal fixture, which records 0.135. Under the heavy fixture the p99 cold start grows 26.5 -> 120.5 ms for view against 131.4 -> 199.8 ms for bare nvim, so view's own cold start grows more in absolute ms with plugin count than nvim's does and the ratio degrades to 0.460 while view still reaches the file first. Why it scales that way is measured but not attributed."

# input_path.minimal key_to_rpc_p99_us dev-linux is no longer listed. The
# entry accepted 112.647 against the 100.0 bound and named its own
# retirement condition -- "the entry stays until a measurement reads inside
# 100" -- while attributing the gap to a hypervisor-side level shift no view
# work could reach. Every measurement taken on 2026-08-09 is inside 100, so
# the condition is met many times over: 49.674, 51.362 and 72.311 from three
# full-matrix runs, 50.077 50.192 50.831 53.257 54.530 from one scoped
# replicate campaign at 1-min loads 0.48-1.03, 57.413 57.883 58.451 60.212
# 60.245 60.779 from a second logged campaign at loads 0.23-1.59, and
# 40.176 from the post-reboot gate leg of the 2026-08-09 diet-campaign
# re-record -- a third distinct level this host held in one day, on top of
# the two campaigns above, strengthening rather than undermining the
# level-shift evidence. The code that moved the level is the
# input-thread/runtime-loop unification, whose paired A/B collapsed the
# key-decoded->loop-wake segment.
#
# The entry's level-shift attribution is confirmed rather than falsified,
# and that is the part worth carrying forward: the two scoped campaigns are
# tight internally (4.5us and 3.4us spreads) and 16% apart from each other,
# hours apart, on the same binary, so this host holds a level for a session
# and picks a different one later. A single campaign's median is therefore
# a reading of this afternoon, not of view. The recorded baseline moved
# 80.682 -> 59.332 by hand-edit, taking the median of the logged campaign,
# because a replicate median below the class's published 1.15 spread is not
# something --record will write in one draw. Only the retirement of the
# accepted shortfall rests on all of this, and that rests on the bound of
# 100 alone, which no reading in either campaign approaches.

# echo.minimal view_p99_ms is not listed: the 2026-08-02 quiet-host
# re-record measured 5.244 against the 8 ms bar, so the prior 8.290
# shortfall here is spent -- that reading was an ambient-load tail, not a
# property of view. Deleting it is the housekeeping the header asks for.

[[shortfall]]
scenario = "echo"
fixture = "heavy"
metric = "view_p99_ms"
class = "dev-macos"
accepted = 10.311
why = "29% over the 8 ms bar with the 14-plugin fixture's own paint cost on top; bare nvim's p99 in the same gated trial is 10.112 ms and the recorded gated ratio_p99 is 1.1481, so most of the absolute tail is the fixture rather than view. Individual clean trials span 8.6-20.9 ms on this cell -- run-to-run tail spread, not host contention, is the residual story -- and the accepted value follows the recorded median-of-3."

[[shortfall]]
scenario = "echo"
fixture = "minimal"
metric = "ratio_p50"
class = "dev-macos"
accepted = 1.1066140177690031
why = "0.6% over the 1.1 bar on the quiet-host re-record (the contaminated-host 1.1125 shrank to 1.1066). Same residual as dev-linux's echo.minimal shortfall -- the echo_control row on this class attributes it to view rather than the UI protocol -- but dev-macos has not had the round-trip stage decomposition dev-linux ran to localize the remaining per-hop cost."

[[shortfall]]
scenario = "echo"
fixture = "heavy"
metric = "ratio_p50"
class = "dev-macos"
accepted = 1.114
why = "1.3% over the 1.1 bar at the median of a statistic this class cannot pin tighter: 8 quiet-host replicates span 0.974-1.218, within-replicate trial spread 2-8% against 25% between replicates -- both processes' absolute p50 redraw in discrete tiers per spawned pair (core placement), not with ambient load: the lowest draw (0.974) landed at load 1.39 and the highest clean draw on record (1.2513, same-commit gate run) at load 1.1. That gate draw and the 2026-08-02 recorded 1.0782 are both ordinary draws from this spread, so the accepted value and the recorded baseline are the replicate median (load-included 1.114, all eight 1.109) rather than any single draw a below-median record would false-fail against. Same own-path residual as echo.minimal on this class."

# dev-macos first_paint, from the 2026-08-02 quiet-host re-record (the
# class's first recording of this row was taken on a host with a busy login
# stack and both marker_cold_ms cells shrank hard once it was cleaned:
# 42.5 -> 32.9 minimal, 220.0 -> 84.0 heavy). Both fixtures still miss the
# 30 ms marker_cold_ms bar and the heavy fixture still misses the 0.30
# marker_ratio_p50 bar; the three entries below are the quiet-host reading.

[[shortfall]]
scenario = "first_paint"
fixture = "minimal"
metric = "marker_cold_ms"
class = "dev-macos"
accepted = 32.922
why = "9.7% over the 30 ms bar. Bare nvim opening the same fixture reaches the same marker at 161.563 ms p99 in the same paired run, so view gets there first by 4.9x; the remaining 3 ms over the bar is unattributed cross-class overhead this campaign measured but did not localize."

[[shortfall]]
scenario = "first_paint"
fixture = "heavy"
metric = "marker_cold_ms"
class = "dev-macos"
accepted = 84.02604099999999
why = "the 14-plugin fixture's cold start, against a bar set from the minimal fixture's 32.9 ms. Bare nvim opening the same fixture reaches the same marker at 204.186 ms p99 in the same paired run, so most of this is plugin init the engine child must finish before the file can be on screen, and view still gets there first at p99 by 120.2 ms -- the same shape the dev-linux heavy shortfall for this metric describes, at this class's own absolute scale."

[[shortfall]]
scenario = "first_paint"
fixture = "heavy"
metric = "marker_ratio_p50"
class = "dev-macos"
accepted = 0.39563655534133746
why = "the same cell and the same event as the marker_cold_ms shortfall above, expressed paired. The 0.30x bar was set against the minimal fixture, which records 0.188 on this class. Under the heavy fixture view's own cold start grows more in absolute ms with plugin count than nvim's does (p50 29.9 -> 77.9 vs nvim's 158.9 -> 196.9) and the ratio degrades while view still reaches the file first (p99 paired delta -109.6 ms). Clean-host observations of this one-shot cell span 0.3785-0.3956 across three same-commit runs; the record landed at the top of that spread and the accepted value follows the record rather than picking a flattering draw. The 0.3818 it replaces sits inside the clean spread, so the superseded contaminated record carried no information about this cell that the clean runs do not."
