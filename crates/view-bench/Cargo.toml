[package]
name = "view-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "latency"
path = "src/bin/latency.rs"

[dependencies]
anyhow = "1.0.103"
portable-pty = "0.9.0"
# Raw CLOCK_MONOTONIC reads comparable with the tap records the
# instrumented view binary emits (std's Instant is opaque and cannot
# cross a process boundary), plus FIFO creation for the tap channel.
rustix = { version = "1", default-features = false, features = [
    "std",
    "time",
    "fs",
] }
thiserror = "2.0.18"
view-oracle = { version = "0.0.1", path = "../view-oracle" }
vt100 = "0.16.2"
