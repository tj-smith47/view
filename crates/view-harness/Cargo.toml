[package]
name = "view-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oracle"
path = "src/bin/oracle.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
toml = "0.8"
view-bench = { version = "0.0.1", path = "../view-bench" }
view-oracle = { version = "0.0.1", path = "../view-oracle" }
# for SHELL_PLACEHOLDER: the first-paint row's shell boundary matches the
# exact text the product paints, read from the crate that owns the layer
# rather than hand-copied into the harness where it would drift
view-surface = { version = "0.0.1", path = "../view-surface" }
