[package]
name = "view-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oracle"
path = "src/bin/oracle.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
toml = "0.8"
view-bench = { version = "0.0.1", path = "../view-bench" }
view-oracle = { version = "0.0.1", path = "../view-oracle" }
# for SHELL_PLACEHOLDER: the first-paint row's shell boundary matches the
# exact text the product paints, read from the crate that owns the layer
# rather than hand-copied into the harness where it would drift
view-surface = { version = "0.0.1", path = "../view-surface" }

# Test-only, for the heavy-fixture supersession leg: it builds a plan from
# the same crates the product does and applies it over a real engine, so
# the evidence is about the shipped plan rather than a restatement of it.
# Dev-only by design -- the harness bins themselves stay free of the
# feature crates they measure.
[dev-dependencies]
view-core = { version = "0.0.1", path = "../view-core" }
view-engine = { version = "0.0.1", path = "../view-engine" }
view-native = { version = "0.0.1", path = "../view-native" }
# The shared temp-dir fixture guard (see its own crate doc): the
# remote_memory row's own test needs a real scratch directory and its
# `Drop`-driven cleanup, matching how view-bench's tests for the same
# stub-arming mechanism use it.
view-test-support = { version = "0.0.1", path = "../view-test-support" }
