[package]
name = "view"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "view"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Builds the measurement-instrumented binary (taps in view-engine and
# view-tui); the bench harness builds this variant into its own target
# dir so the plain release binary stays byte-for-byte tap-free.
bench-taps = ["view-engine/bench-taps", "view-tui/bench-taps"]
# The paired campaign's counterfactual arm: an otherwise identical binary
# whose engine runs no heartbeat prober, so the probe's cost on the echo and
# input rows can be measured as a difference rather than argued about. Never
# shipped, and unable to be built optimized without saying so -- see the
# view-engine feature it forwards to for the guard that enforces it. A
# binary that does carry it names itself in its own startup diagnostics
# (src/main.rs `VERSION`).
bench-no-heartbeat = ["view-engine/bench-no-heartbeat"]

[dependencies]
anyhow = "1.0.103"
# The clipboard provider's local backend ("+yy"/"+p"): in-process, native
# clipboard APIs on all three §14 platforms, no external binary to spawn
# per operation and no per-platform "which command is installed" matrix.
# Confined to this bin crate by scripts/audit-deps.sh; see the clipboard
# worker in src/clipboard.rs for the crate-boundary reasoning. Default
# features off: the default image-data stack is dead weight this text-only
# provider never calls, and wayland-data-control (opt-in, not default) is
# needed explicitly for a Wayland session to work at all -- X11 support is
# unconditional in arboard's own manifest, not behind either feature.
arboard = { version = "3", default-features = false, features = [
    "wayland-data-control",
] }
clap = { version = "4.6.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
view-core = { version = "0.0.1", path = "../view-core" }
view-engine = { version = "0.0.1", path = "../view-engine" }
view-native = { version = "0.0.1", path = "../view-native" }
view-surface = { version = "0.0.1", path = "../view-surface" }
view-tui = { version = "0.0.1", path = "../view-tui" }

# The runtime loop's readiness poll and its wake pipe (src/wake.rs): the
# loop sleeps in poll(2) over the terminal fd view-tui exposes plus a
# crate-owned pipe every message producer signals. Already resolved
# transitively via crossterm's unix backend (which this bin crate is
# forbidden from depending on directly), so this adds a direct edge to an
# already-vetted crate rather than a new dependency surface.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = [
    "std",
    "event",
    "pipe",
] }

[target.'cfg(target_vendor = "apple")'.dependencies]
# The apple fallback in src/wake.rs sets O_NONBLOCK via
# rustix::fs::fcntl_setfl/OFlags -- macOS lacks the atomic pipe2-equivalent
# `pipe_with` the non-apple path above uses, so it falls back to a plain
# pipe() plus per-fd fcntl calls (see that module's docs). This is an
# additional feature edge on the same rustix dependency declared under
# cfg(unix): cargo unions the two tables' features for apple targets
# (which satisfy both cfg predicates), so non-apple unix builds never pull
# in the fs module this needs.
rustix = { version = "1", default-features = false, features = ["fs"] }

[dev-dependencies]
# The same view-engine, with the constructor that builds a connection over
# an arbitrary reader/writer pair rather than a spawned nvim (see that
# feature's note in view-engine's own manifest). Cargo enables it only for
# this package's test targets, so the shipped binary is built from exactly
# the dependency declared above; the runtime's wedged-peer tests need a
# connection whose peer can be made to stop reading on command, which no
# real nvim will do.
view-engine = { version = "0.0.1", path = "../view-engine", features = [
    "test-support",
] }
# The shared temp-dir fixture guard (see its own crate doc): used by both
# this crate's own unit tests (src/native.rs) and its integration tests
# (tests/cli_live.rs, tests/supersede_live.rs).
view-test-support = { version = "0.0.1", path = "../view-test-support" }
# The supervision bounds a live wedge is asserted against
# (tests/supervision_live.rs). view-oracle owns `DETECTION_BOUND` and the
# host-scaling slack around it precisely so every consumer asserts the same
# number; a second derivation of "one probe interval plus one threshold"
# here would agree with the oracle's corpus only until one of the two moved.
# A dev edge only: nothing in the shipped binary depends on the oracle.
view-oracle = { version = "0.0.1", path = "../view-oracle" }
