[package]
name = "view"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "view"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Builds the measurement-instrumented binary (taps in view-engine and
# view-tui); the bench harness builds this variant into its own target
# dir so the plain release binary stays byte-for-byte tap-free.
bench-taps = ["view-engine/bench-taps", "view-tui/bench-taps"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
view-core = { version = "0.0.1", path = "../view-core" }
view-engine = { version = "0.0.1", path = "../view-engine" }
view-surface = { version = "0.0.1", path = "../view-surface" }
view-tui = { version = "0.0.1", path = "../view-tui" }

[dev-dependencies]
# The same view-engine, with the constructor that builds a connection over
# an arbitrary reader/writer pair rather than a spawned nvim (see that
# feature's note in view-engine's own manifest). Cargo enables it only for
# this package's test targets, so the shipped binary is built from exactly
# the dependency declared above; the runtime's wedged-peer tests need a
# connection whose peer can be made to stop reading on command, which no
# real nvim will do.
view-engine = { version = "0.0.1", path = "../view-engine", features = [
    "test-support",
] }
