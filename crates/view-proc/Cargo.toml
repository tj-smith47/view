[package]
name = "view-proc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Only the parent-death signal needs a syscall, and only Linux has one.
# Every other platform's half of this crate is std alone, so rustix is
# scoped to the target that actually calls it rather than carried by every
# build of a crate three others depend on.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = [
    "std",
    # prctl(PR_SET_PDEATHSIG) and the getppid that closes its fork/exec
    # race, both raw syscalls a pre_exec closure may make
    "process",
] }

# The job object the children are tied by. Scoped to Windows for the reason
# rustix is scoped to Linux: no other target calls any of it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    # CreateJobObjectW, SetInformationJobObject, AssignProcessToJobObject
    "Win32_System_JobObjects",
    # OpenProcess and the two rights a job assignment needs, plus
    # JOBOBJECT_EXTENDED_LIMIT_INFORMATION, which windows-sys gates here
    "Win32_System_Threading",
    # CloseHandle, for a job whose limits could not be set
    "Win32_Foundation",
    # SECURITY_ATTRIBUTES, which CreateJobObjectW takes a pointer to and
    # which this call passes as null
    "Win32_Security",
] }
