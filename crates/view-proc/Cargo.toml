[package]
name = "view-proc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# The parent-death signal, which only Linux has, and the signal-0 probe
# `pid_running` asks on every unix. Windows answers both from windows-sys.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = [
    "std",
    # prctl(PR_SET_PDEATHSIG) and the getppid that closes its fork/exec
    # race, both raw syscalls a pre_exec closure may make, and kill(pid, 0)
    "process",
] }

# The job object the children are tied by. Scoped to Windows for the reason
# rustix is scoped to unix: no other target calls any of it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    # CreateJobObjectW, SetInformationJobObject, AssignProcessToJobObject
    "Win32_System_JobObjects",
    # OpenProcess and the two rights a job assignment needs, plus
    # JOBOBJECT_EXTENDED_LIMIT_INFORMATION, which windows-sys gates here,
    # and GetExitCodeProcess for `pid_running`
    "Win32_System_Threading",
    # CloseHandle, for a job whose limits could not be set, and the
    # STILL_ACTIVE and ERROR_ACCESS_DENIED `pid_running` reads
    "Win32_Foundation",
    # SECURITY_ATTRIBUTES, which CreateJobObjectW takes a pointer to and
    # which this call passes as null
    "Win32_Security",
] }
