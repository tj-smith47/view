[package]
name = "view-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
portable-pty = "0.9.0"
thiserror = "2.0.18"
view-core = { version = "0.0.1", path = "../view-core" }
view-engine = { version = "0.0.1", path = "../view-engine" }
view-surface = { version = "0.0.1", path = "../view-surface" }
vt100 = "0.16.2"

# the load-scaled wall clocks this crate's timing tests hold a live
# sequence to (view_test_support::HostBudget), shared with view-engine's
# own live tests rather than copied into each; dev-only, like every other
# consumer of that fixture crate
[dev-dependencies]
view-test-support = { version = "0.0.1", path = "../view-test-support" }

# Process groups are a Unix mechanism; killpg is what lets a session kill
# everything its pty child spawned, not just the child. Windows keeps the
# per-child kill portable-pty provides.
#
# "term" pulls in `nix::pty::openpty`; "fs" pulls in `nix::unistd::dup`
# (`std::process::Command::setsid` is nightly-only, `#105376`, so the
# piped-stdin CLI smoke test's pre_exec calls `nix::unistd::setsid`
# instead): both back the piped-stdin CLI smoke test's hand-rolled pty,
# needed because portable_pty's own `SlavePty::spawn_command` always wires
# stdin/stdout/stderr to the same slave fd.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "term", "fs"] }
