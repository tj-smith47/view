[package]
name = "view-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Exposes the damage compactor's fold+take entry point and its seeded storm
# generator (crate-private otherwise) so benches/damage_fold.rs -- an
# external compilation unit with only pub-API access -- can bench the same
# hot path damage.rs's own property tests exercise. Off by default: neither
# belongs in view-engine's ordinary public surface.
bench-support = []
# Exposes EngineHandle::start (the unbounded-notification-channel
# constructor) and the EngineNotification re-export, which have no
# production caller: Engine::spawn always uses the crate-private, pumped,
# bounded-channel start_pumped instead. Only test code (this crate's own
# integration tests in tests/, and unit tests via the `test` cfg below)
# needs the unbounded form. Enabled automatically for this crate's own test
# session by the self dev-dependency below; off in every ordinary build.
test-support = []
# Compiles monotonic-timestamp taps at the RPC-written and redraw-parsed
# boundaries (src/tap.rs) for the measurement harness. Off by default:
# without it the tap module does not exist in the compilation at all, so
# shipping builds carry zero tap code or cost.
bench-taps = []

[dependencies]
rmpv = "1.3.1"

thiserror = "2.0.18"
view-core = { version = "0.0.1", path = "../view-core" }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
# Self dev-dependency: Cargo's feature unification enables test-support for
# every build of this package within a `cargo test` session (the lib target
# included), so integration test binaries under tests/ see EngineHandle::start
# without a manual --features flag. No normal (non-test) build depends on
# view-engine as its own dev-dependency, so test-support never leaks in.
view-engine = { path = ".", features = ["test-support"] }

# The hang fixture tests/spawn.rs drives. Behind `test-support` so it is
# built for this crate's own `cargo test` session (where the self
# dev-dependency unifies that feature on) and for nothing else: an ordinary
# `cargo build -p view-engine` produces no such artifact.
[[bin]]
name = "view-engine-hang-fixture"
path = "tests/fixtures/hang_fixture.rs"
required-features = ["test-support"]
test = false
bench = false
doc = false

[[bench]]
name = "damage_fold"
harness = false
required-features = ["bench-support"]

# Unix-only, and not optional: the outbox's inline-write fast path asks the
# engine pipe whether a small write can complete without blocking, which is
# what lets the runtime loop write RPC itself instead of waking a thread to
# do it (see handle::Outbox). `time` additionally serves the bench-taps
# records, whose CLOCK_MONOTONIC reads must be comparable across processes
# in a way std's opaque Instant is not.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = [
    "std",
    "time",
    "event",
    "fs",
    # a real pipe is the only configuration in which the outbox's inline
    # path is live, so the ordering proof cannot be written without one
    "pipe",
] }
