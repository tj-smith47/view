name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push supersedes the runs before it — measurement legs included,
# since a baseline recorded on a stale tip is never the one to harvest
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up task runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install neovim (linux)
        if: runner.os == 'Linux'
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          curl -fsSL -o nvim.appimage "https://github.com/neovim/neovim/releases/download/${ENGINE_PIN}/nvim-linux-x86_64.appimage"
          chmod +x nvim.appimage
          ./nvim.appimage --appimage-extract >/dev/null
          echo "$PWD/squashfs-root/usr/bin" >> "$GITHUB_PATH"

      - name: Install neovim (macos)
        if: runner.os == 'macOS'
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          curl -fsSL -o nvim-macos.tar.gz "https://github.com/neovim/neovim/releases/download/${ENGINE_PIN}/nvim-macos-arm64.tar.gz"
          tar xzf nvim-macos.tar.gz
          echo "$PWD/nvim-macos-arm64/bin" >> "$GITHUB_PATH"

      - name: Install neovim (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          curl -fsSL -o nvim-win64.zip "https://github.com/neovim/neovim/releases/download/${ENGINE_PIN}/nvim-win64.zip"
          unzip -q nvim-win64.zip
          # cygpath, not $PWD: this step runs under Git Bash, whose $PWD is a
          # POSIX-style path (/d/a/...) that only other bash steps can resolve.
          # CreateProcessW cannot, so a test that spawns nvim through the
          # Windows API would fail with "program not found" while the bash
          # version check below still passes.
          cygpath -w "$PWD/nvim-win64/bin" >> "$GITHUB_PATH"

      - name: Check neovim version
        shell: bash
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          nvim --version | head -1 | grep -F "${ENGINE_PIN#v}"

      # A bash-only-visible nvim (POSIX-style GITHUB_PATH entry) passes the
      # bash check above but is invisible to CreateProcessW, which is how the
      # test suite actually spawns the engine. This pins the Windows-native
      # resolution path itself.
      - name: Check neovim resolves natively (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pin = (Get-Content .engine-pin).Trim().TrimStart("v")
          if (-not ((nvim --version | Select-Object -First 1) -match [regex]::Escape($pin))) { exit 1 }

      - name: Run CI suite
        run: task ci

  # crates/view-oracle/tests/clipboard_roundtrip.rs skips itself on any host
  # with no live display -- true of every other job in this workflow, whose
  # pty spawns strip DISPLAY on purpose (see that test's module doc). This
  # job exists to be the one host that actually has one, so the system
  # clipboard leg runs for real instead of skip-reporting a pass on every
  # push. VIEW_CLIPBOARD_TEST_REQUIRE_DISPLAY turns a display that silently
  # stops answering into a hard failure rather than a second, quieter skip.
  clipboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up task runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install neovim (linux)
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          curl -fsSL -o nvim.appimage "https://github.com/neovim/neovim/releases/download/${ENGINE_PIN}/nvim-linux-x86_64.appimage"
          chmod +x nvim.appimage
          ./nvim.appimage --appimage-extract >/dev/null
          echo "$PWD/squashfs-root/usr/bin" >> "$GITHUB_PATH"

      - name: Check neovim version
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          nvim --version | head -1 | grep -F "${ENGINE_PIN#v}"

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Deliberately not `xvfb-run`: it sets `DISPLAY` on the wrapped
      # command's own process, which here is `cargo test` itself.
      # `PtySession::spawn_configured`'s hermetic sweep (view-engine's
      # `env::hermetic_sweep`) strips any child override that matches its
      # own process's ambient value (see that sweep's doc), so a `cargo
      # test` process that itself inherited `DISPLAY` would have this
      # test's `VIEW_CLIPBOARD_TEST_DISPLAY`-driven override silently
      # stripped again before the spawned `view` ever saw it -- verified
      # locally: `xvfb-run cargo test ...` fails this test with an empty
      # clipboard read, a bare `Xvfb` left off `cargo test`'s own
      # environment passes it. Xvfb is started directly instead, and
      # `DISPLAY` is never exported to this job at all -- only
      # `VIEW_CLIPBOARD_TEST_DISPLAY`, in the next step, points at it.
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          for _ in $(seq 1 50); do
            test -e /tmp/.X11-unix/X99 && exit 0
            sleep 0.1
          done
          echo "Xvfb never created its display socket" >&2
          exit 1

      # arboard's Linux backend (x11rb) speaks the X11 clipboard protocol
      # in-process; it needs a live X server, not an external clipboard
      # utility, so Xvfb alone is the whole leg's environment requirement.
      # VIEW_CLIPBOARD_TEST_REQUIRE_DISPLAY turns this test's own "no
      # display" and "no system clipboard reachable" skip branches into
      # hard failures, so a display that silently stops answering fails
      # this job loud instead of reporting green through the skip path a
      # genuinely headless host takes on purpose.
      - name: Run system-clipboard tests against Xvfb
        env:
          VIEW_CLIPBOARD_TEST_DISPLAY: ":99"
          VIEW_CLIPBOARD_TEST_REQUIRE_DISPLAY: "1"
        run: cargo test -p view-oracle --test clipboard_roundtrip -- --nocapture

  # The differential oracle corpus is merge-blocking on both tier-1
  # platforms (spec section 14: linux + macos tier-1; Windows is tier-2,
  # deferral 4). Its own job so the pty-driven corpus never extends the
  # fast matrix's build/test feedback time.
  oracle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up task runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install neovim (linux)
        if: runner.os == 'Linux'
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          curl -fsSL -o nvim.appimage "https://github.com/neovim/neovim/releases/download/${ENGINE_PIN}/nvim-linux-x86_64.appimage"
          chmod +x nvim.appimage
          ./nvim.appimage --appimage-extract >/dev/null
          echo "$PWD/squashfs-root/usr/bin" >> "$GITHUB_PATH"

      - name: Install neovim (macos)
        if: runner.os == 'macOS'
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          curl -fsSL -o nvim-macos.tar.gz "https://github.com/neovim/neovim/releases/download/${ENGINE_PIN}/nvim-macos-arm64.tar.gz"
          tar xzf nvim-macos.tar.gz
          echo "$PWD/nvim-macos-arm64/bin" >> "$GITHUB_PATH"

      - name: Check neovim version
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          nvim --version | head -1 | grep -F "${ENGINE_PIN#v}"

      - name: Run differential oracle corpus
        run: task oracle

  # The plugin compat matrix runs on both tier-1 platforms (spec section
  # 14); the pty layer, plugin bootstrap paths, and terminfo behavior all
  # differ enough by OS that one linux leg cannot vouch for macos. Its own
  # job (not a step of the fast matrix) so the cold-bootstrap scenario's
  # real network installs never extend the fast legs' feedback time.
  compat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # bounds the cold-bootstrap scenario, which clones lazy.nvim plus its
    # pinned plugins from scratch on every run and is slow by the nature of
    # that work (its own probe step allows up to 180s), plus a cold cargo
    # build on a cache miss
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up task runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # the harness points warm scenarios' XDG_DATA_HOME at compat/.cache,
      # keyed by lazy-lock.json hash, so a restored cache turns their
      # plugin installs into no-ops; the cold-bootstrap scenario bypasses
      # this cache by design and always exercises the real network path
      - name: Cache plugin installs
        uses: actions/cache@v4
        with:
          path: compat/.cache
          key: compat-plugins-${{ runner.os }}-${{ hashFiles('compat/fixtures/**/lazy-lock.json') }}

      - name: Install neovim (linux)
        if: runner.os == 'Linux'
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          curl -fsSL -o nvim.appimage "https://github.com/neovim/neovim/releases/download/${ENGINE_PIN}/nvim-linux-x86_64.appimage"
          chmod +x nvim.appimage
          ./nvim.appimage --appimage-extract >/dev/null
          echo "$PWD/squashfs-root/usr/bin" >> "$GITHUB_PATH"

      - name: Install neovim (macos)
        if: runner.os == 'macOS'
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          curl -fsSL -o nvim-macos.tar.gz "https://github.com/neovim/neovim/releases/download/${ENGINE_PIN}/nvim-macos-arm64.tar.gz"
          tar xzf nvim-macos.tar.gz
          echo "$PWD/nvim-macos-arm64/bin" >> "$GITHUB_PATH"

      - name: Check neovim version
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          nvim --version | head -1 | grep -F "${ENGINE_PIN#v}"

      - name: Run compat harness
        run: task compat

      # after the harness, so the plugin stack the takeover is asserted
      # against is already installed under the cache this job restores
      - name: Assert native supersession against live plugins
        run: task compat-supersede

  # Shared-runner bench legs. These record rather than gate until a
  # reviewed gh-* baseline is committed; once it is, every row gates its
  # view/nvim median ratio and its view-side absolute p99 against that
  # baseline, while tail statistics stay recorded but ungated because gh-*
  # runners are not controlled classes (spec section 3.1). The null-pair
  # calibration refuses a record or a gate alike if ambient runner noise
  # exceeds the measured floor, rather than writing or comparing numbers
  # taken on a noisy host.
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            class: gh-linux
          - os: macos-latest
            class: gh-macos
    runs-on: ${{ matrix.os }}
    # the full gated matrix took ~28 minutes on a 12-core dev host (the
    # first_paint rows' 1100 cold spawn pairs dominate); shared runners
    # are slower, plus a cold cargo build on a cache miss
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up task runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # same shared plugin cache as the compat job: the heavy fixture's
      # cells point XDG_DATA_HOME at compat/.cache, and a warm cache keeps
      # plugin cloning out of the settle window
      - name: Cache plugin installs
        uses: actions/cache@v4
        with:
          path: compat/.cache
          key: compat-plugins-${{ runner.os }}-${{ hashFiles('compat/fixtures/**/lazy-lock.json') }}

      - name: Install neovim (linux)
        if: runner.os == 'Linux'
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          curl -fsSL -o nvim.appimage "https://github.com/neovim/neovim/releases/download/${ENGINE_PIN}/nvim-linux-x86_64.appimage"
          chmod +x nvim.appimage
          ./nvim.appimage --appimage-extract >/dev/null
          echo "$PWD/squashfs-root/usr/bin" >> "$GITHUB_PATH"

      - name: Install neovim (macos)
        if: runner.os == 'macOS'
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          curl -fsSL -o nvim-macos.tar.gz "https://github.com/neovim/neovim/releases/download/${ENGINE_PIN}/nvim-macos-arm64.tar.gz"
          tar xzf nvim-macos.tar.gz
          echo "$PWD/nvim-macos-arm64/bin" >> "$GITHUB_PATH"

      - name: Check neovim version
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          nvim --version | head -1 | grep -F "${ENGINE_PIN#v}"

      # The committed gh baselines' input_path/output_path cells predate
      # the sample-anchoring correction (samples now close on the
      # keystroke's own handoff), so honest numbers would read as
      # regressions against them. Those cells are deleted in the commit
      # that flips this leg to --record — the baseline ratchet refuses
      # seating a worse number, so a stale cell would silently keep its
      # old bar — and the leg flips back to --gate in the commit that
      # lands the reviewed refreshed TOMLs, upload step removed with it
      - name: Record bench matrix baseline (${{ matrix.class }})
        run: task bench -- --all --class ${{ matrix.class }} --record

      - name: Upload recorded baseline
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline-${{ matrix.class }}
          path: crates/view-bench/baselines/${{ matrix.class }}.toml
          if-no-files-found: error
