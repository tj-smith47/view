name: Bench

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push supersedes the runs before it — measurement legs included,
# since a baseline recorded on a stale tip is never the one to harvest
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared-runner bench legs. Every row gates its view/nvim median ratio
  # and its view-side absolute p99 against the committed gh-* baseline
  # (recorded on run 33204611952, reviewed cell by cell), while tail
  # statistics stay recorded but ungated because gh-*
  # runners are not controlled classes (spec section 3.1). The null-pair
  # calibration refuses a record or a gate alike if ambient runner noise
  # exceeds the measured floor, rather than writing or comparing numbers
  # taken on a noisy host.
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            class: gh-linux
          - os: macos-latest
            class: gh-macos
    runs-on: ${{ matrix.os }}
    # a hang backstop, not a budget: at 5d983db gh-linux ran this matrix in
    # 43 min while gh-macos was cancelled at 90 min with three scenarios left
    # (~100 min projected) -- the shared macOS runner is 2-4x slower per
    # scenario, so any value inside the measured range is a coin-flip cancel
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up task runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # same shared plugin cache as the compat job: the heavy fixture's
      # cells point XDG_DATA_HOME at compat/.cache, and a warm cache keeps
      # plugin cloning out of the settle window
      - name: Cache plugin installs
        uses: actions/cache@v4
        with:
          path: compat/.cache
          key: compat-plugins-${{ runner.os }}-${{ hashFiles('compat/fixtures/**/lazy-lock.json') }}

      - name: Install neovim (linux)
        if: runner.os == 'Linux'
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          curl -fsSL -o nvim.appimage "https://github.com/neovim/neovim/releases/download/${ENGINE_PIN}/nvim-linux-x86_64.appimage"
          chmod +x nvim.appimage
          ./nvim.appimage --appimage-extract >/dev/null
          echo "$PWD/squashfs-root/usr/bin" >> "$GITHUB_PATH"

      - name: Install neovim (macos)
        if: runner.os == 'macOS'
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          curl -fsSL -o nvim-macos.tar.gz "https://github.com/neovim/neovim/releases/download/${ENGINE_PIN}/nvim-macos-arm64.tar.gz"
          tar xzf nvim-macos.tar.gz
          echo "$PWD/nvim-macos-arm64/bin" >> "$GITHUB_PATH"

      - name: Check neovim version
        run: |
          ENGINE_PIN=$(cat .engine-pin)
          nvim --version | head -1 | grep -F "${ENGINE_PIN#v}"

      # A row that refuses its own measurement (the tap-overhead bar on the
      # shared macOS runner, today) holds an empty cell in the committed
      # baseline: the gate compares nothing for it and reports GATE
      # UNSEATED rather than a coverage gap, so a refusal is neither a
      # regression nor a missing recording
      - name: Gate bench matrix (${{ matrix.class }})
        run: task bench -- --all --class ${{ matrix.class }} --gate

      # This leg's own measured cells, unratcheted: how an unseated cell
      # gets its first bar, and how a headroom entry gets re-sized, without
      # re-typing numbers out of the log at the precision the log printed.
      # Uploaded even on a breach, whose draws are exactly the ones wanted
      - name: Upload measured cells (${{ matrix.class }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-measured-${{ matrix.class }}
          path: crates/view-bench/baselines/${{ matrix.class }}.measured.toml
