name: Release

on:
  push:
    tags: ["v*"]
  # The rehearsal: build, bundle, sign and verify every platform without
  # publishing anything, so the pipeline is provable before a tag is spent
  # on it. Publishing stays on the tag alone.
  workflow_dispatch:

permissions:
  contents: read

env:
  # The same SSOT the sibling repos use: a repo variable
  # (`gh variable set ANODIZER_VERSION`) so one bump follows every workflow
  # that installs the tool. The literal is the floor until that variable is
  # set here, and it is the version docs/anodizer-release-capture.md was
  # taken against, which is what .anodizer.yaml is written for.
  ANODIZER_VERSION: ${{ vars.ANODIZER_VERSION || 'v0.23.0' }}

jobs:
  # The platform list has one definition, `.anodizer.yaml`, and this job is
  # how the matrix reads it: a target added there is built, bundled and
  # published without a second edit here.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.anodizer.outputs.split-matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install anodizer and derive the target matrix
        id: anodizer
        uses: tj-smith47/anodizer-action@v1
        with:
          version: ${{ env.ANODIZER_VERSION }}
          install-only: true

  bundle:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # The aarch64 leg is the only one whose triple is not the runner's own,
      # and a TUI editor's dependency tree reaches libc; the GNU cross linker
      # is what closes that gap without a container.
      - name: Install the aarch64 linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build the release binary
        run: cargo build --release --locked -p view --target ${{ matrix.target }}

      # The bundled engine is the version .engine-pin names, resolved by
      # scripts/package-bundle.sh at build time. A literal here would be a
      # second version to keep in step, which scripts/check-engine-pin.sh
      # refuses across every workflow for exactly that reason.
      - name: Stage, check and archive the bundled pair
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          root="bundles/view-${GITHUB_REF_NAME}-${TARGET}"
          suffix=""
          out="${root}.tar.gz"
          case "$TARGET" in
            *-windows-*) suffix=".exe"; out="${root}.zip" ;;
          esac
          bash scripts/package-bundle.sh stage "$TARGET" \
            "target/${TARGET}/release/view${suffix}" "$root"

          # The archive has to carry the pinned engine, not merely have been
          # built by a script that reads the pin. Asked of the staged binary
          # wherever it can answer, which is every leg whose triple is the
          # runner's own architecture.
          ENGINE_PIN=$(cat .engine-pin)
          case "${TARGET}:$(uname -m)" in
            x86_64-*:x86_64 | aarch64-*:arm64 | aarch64-*:aarch64)
              "$root/libexec/view/nvim${suffix}" --version | head -1 | grep -F "${ENGINE_PIN#v}" ;;
            *)
              echo "cross-built for ${TARGET}; its engine cannot run on $(uname -m)" ;;
          esac

          bash scripts/package-bundle.sh archive "$root" "$PWD/$out"
          rm -rf "$root" "$root.engine"

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: bundles/*
          if-no-files-found: error

  publish:
    needs: [plan, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless cosign: the signing identity is this workflow's own OIDC
      # token, so there is no key to store, rotate or leak.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download every bundle
        uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: bundle-*
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign every bundle
        run: |
          for artifact in bundles/view-*; do
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "$artifact"
          done

      # The gate this job exists to pass: every artifact that will be
      # published verifies against the certificate published beside it, from
      # this workflow's own identity. A signature nobody verified before
      # upload is a signature discovered broken by the first user to try.
      - name: Verify every signature
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          TARGETS: ${{ needs.plan.outputs.matrix }}
        run: |
          verified=0
          for artifact in bundles/view-*; do
            case "$artifact" in *.sig | *.pem) continue ;; esac
            cosign verify-blob \
              --certificate "${artifact}.pem" \
              --signature "${artifact}.sig" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$artifact"
            verified=$((verified + 1))
          done
          # Counted against the matrix rather than against zero: one leg
          # whose artifact never arrived would otherwise leave a sweep that
          # verified the rest looking like a clean one.
          expected=$(echo "$TARGETS" | jq '.include | length')
          if [ "$verified" -ne "$expected" ]; then
            echo "verified $verified artifacts, expected $expected"
            exit 1
          fi
          echo "cosign verify-blob passed for all $verified artifacts"

      # The binaries and their archives are already built and signed above,
      # so anodizer runs the stages only it can: the changelog from commit
      # subjects, the checksum file, and the GitHub release the bundles,
      # signatures and certificates upload to. Skipped on a manual run,
      # which exists to prove the pipeline without spending a version.
      - name: Publish the release
        if: github.event_name == 'push'
        uses: tj-smith47/anodizer-action@v1
        with:
          version: ${{ env.ANODIZER_VERSION }}
          args: release --skip build,archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
