version: "3"

tasks:
  build:
    desc: Build the whole workspace
    cmd: cargo build --workspace

  fmt:
    desc: Format all Rust code
    cmd: cargo fmt --all

  fmt-check:
    desc: Verify formatting without writing
    cmd: cargo fmt --all --check

  lint:
    desc: Clippy with warnings as errors, over the shipped feature set and then over every feature
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings
      # the shipped set never compiles the arms behind bench-taps,
      # bench-support or bench-no-heartbeat, so a lint that stopped at the
      # line above would leave the counterfactual engine's own code
      # unchecked: --all-features is this tree's clippy floor
      # (.claude/rules/rust.md) and is what puts those cfg arms in front of
      # it. Clippy builds with debug assertions on, so the no-heartbeat
      # arm's ship guard stays dormant here and needs no build environment
      # of its own
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    desc: Run the full test suite (requires nvim >= 0.11 on PATH)
    cmd: cargo test --workspace

  audit:
    desc: Enforce crate dependency direction and the pinned engine version
    cmds:
      - bash scripts/audit-deps.sh
      - bash scripts/check-engine-pin.sh
      - bash scripts/check-budget-drift.sh
      - bash .claude/hooks/tests/validate-commands-cases.sh

  style:
    desc: Enforce comment and doc style rules
    cmd: bash scripts/check-style.sh

  loc:
    desc: Enforce the god-file ceiling (production code lines per file; split modules, separate tests)
    cmds:
      - bash scripts/audit-god-files.sh
      # the counter is only trustworthy while a second, independently written
      # one still agrees with it over every file the gate measures. The
      # interpreter is resolved rather than named: Windows runners ship
      # `python` with no `python3` alias, and a cross-check that silently
      # skipped there would leave the counter unverified on the one platform
      # whose path handling differs most.
      - bash -o pipefail -c 'scripts/crosscheck-god-files.sh'

  ci:
    desc: The full local gate; CI mirrors exactly this
    cmds:
      - task: fmt-check
      - task: lint
      - task: audit
      - task: style
      - task: loc
      - task: test

  oracle:
    desc: Run the differential oracle corpus against the pinned nvim (task oracle -- corpus/insert-basic.toml for one entry)
    cmd: cargo run -p view-harness --bin oracle -- {{.CLI_ARGS}}

  compat:
    desc: Run the plugin compat harness against the pinned nvim (task compat -- compat/scenarios/lualine.toml for one scenario)
    cmd: cargo run -p view-harness --bin oracle -- compat {{.CLI_ARGS}}

  compat-supersede:
    desc: Assert a native takeover against the heavy fixture's live plugins (needs the compat plugin cache; run after task compat)
    # ignored by default in `task test` because a cold cache clones the whole
    # pinned plugin stack from the network; this target is the only caller
    # that opts them in, and it serializes them so two live heavy sessions
    # never contend for the same machine
    cmd: cargo test -p view-harness --test supersede_heavy -- --ignored --test-threads=1

  bench:
    desc: The scenario x fixture measurement matrix (task bench -- --scenario echo --fixture minimal --class dev-linux; --all --record / --gate)
    cmds:
      - cargo build --release -p view
      # separate target dir so the instrumented build can never overwrite
      # the plain binary the e2e rows measure
      - cargo build --release -p view --features bench-taps --target-dir target/taps
      # the exit code is echoed as this target's own final log line, on
      # every path (pass, gate breach, refusal), so a tee'd gate log is
      # self-describing without a reader having to interpret the bench
      # binary's own verdict text; forwarded via `exit` so the true code
      # still reaches task's own caller
      - >-
        cargo run --release -p view-harness --bin bench -- {{.CLI_ARGS}};
        code=$?; echo "bench wrapper exit: $code"; exit $code

  bench-micro:
    desc: Hot-path micro-benches (grid apply, key dispatch, damage fold, render)
    cmds:
      - cargo bench -p view-core --bench grid_apply
      - cargo bench -p view-core --bench update_key
      - cargo bench -p view-core --bench input_handoff
      - cargo bench -p view-engine --bench damage_fold --features bench-support
      - cargo bench -p view-surface --bench render_frame
      - cargo bench -p view-tui --bench paint_frame

  heartbeat-ab:
    desc: Paired echo/input_path campaign, heartbeat prober armed vs compiled out (crates/view-harness/tests/heartbeat_cost.rs)
    # the ship guard on the no-heartbeat arm refuses an optimized build that
    # does not name the campaign it is for (view-engine/src/process.rs), and
    # this is the campaign: the variable is set here, in the one target that
    # legitimately wants a binary with no read-side supervision in it
    env:
      VIEW_BENCH_NO_HEARTBEAT: "1"
    cmds:
      - cargo build --release -p view
      - cargo build --release -p view --features bench-taps --target-dir target/taps
      # one target dir per arm: the counterfactual binary must never be able
      # to overwrite the shipped one the other arm measures, and a shared dir
      # would rebuild both on every feature flip
      - cargo build --release -p view --features bench-no-heartbeat --target-dir target/no-heartbeat
      - cargo build --release -p view --features bench-taps,bench-no-heartbeat --target-dir target/taps-no-heartbeat
      - cargo build --release -p view-harness --bin bench
      - cargo test -p view-harness --release --test heartbeat_cost -- --ignored --nocapture

  perf-audit:
    desc: Pre-release / post-strangle gate — full bench matrix gated on the local dev class (~28 min), then the heartbeat armed-vs-absent campaign (four release builds plus four 400-sample cells; AB=skip drops it), then every hot-path micro-bench (task perf-audit CLASS=dev-linux AB=skip)
    vars:
      CLASS: '{{.CLASS | default "dev-linux"}}'
      AB: '{{.AB | default "run"}}'
    cmds:
      # a shell chain (not three `task:` steps) so the exit code below can
      # be captured and echoed as this target's own final log line on every
      # path; `&&` preserves the original fail-fast semantics (nothing later
      # runs if the matrix itself failed), and `exit` forwards the true code
      # to task's own caller.
      #
      # The A/B campaign runs here rather than nowhere: it is the only thing
      # that holds the heartbeat's cost to what this class can resolve, and
      # a claim nothing ever re-checks decays. It is skippable because it
      # costs its own campaign on top of an already long gate, and a
      # pre-release run that never finishes is worth less than one that
      # states what it left out -- which the skip line does, in the log.
      - >-
        task bench CLI_ARGS="--all --class {{.CLASS}} --gate"
        && { if [ "{{.AB}}" = skip ]; then
        echo "perf-audit: heartbeat A/B campaign skipped (AB=skip)";
        else task heartbeat-ab; fi; }
        && task bench-micro;
        code=$?; echo "perf-audit wrapper exit: $code"; exit $code

  commit:
    desc: Gated commit — runs the ci chain first
    cmds:
      - task: ci
      - git add -A
      - git commit {{.CLI_ARGS}}
