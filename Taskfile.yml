version: "3"

tasks:
  build:
    desc: Build the whole workspace
    cmd: cargo build --workspace

  install:
    desc: "Build the release binary and install it on PATH, where it outlives target/ (task install PREFIX=$HOME/bin)"
    vars:
      PREFIX: '{{.PREFIX | default "$HOME/.local/bin"}}'
    cmds:
      - cargo build --release -p view
      - mkdir -p {{.PREFIX}}
      # install(1) over cp: replacing the inode leaves a running view untouched
      - install -m 755 target/release/view {{.PREFIX}}/view
      - '{{.PREFIX}}/view --version'

  fmt:
    desc: Format all Rust code
    cmd: cargo fmt --all

  fmt-check:
    desc: Verify formatting without writing
    cmd: cargo fmt --all --check

  lint:
    desc: Clippy with warnings as errors, over the shipped feature set and then over every feature
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings
      # the shipped set never compiles the arms behind bench-taps,
      # bench-support or bench-no-heartbeat, so a lint that stopped at the
      # line above would leave the counterfactual engine's own code
      # unchecked: --all-features is this tree's clippy floor
      # (.claude/rules/rust.md) and is what puts those cfg arms in front of
      # it. Clippy builds with debug assertions on, so the no-heartbeat
      # arm's ship guard stays dormant here and needs no build environment
      # of its own
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      # both lines above build every lib alongside its own test targets and
      # dev-dependencies, whose features unify into the lib unit -- so a
      # field only a `cfg(test)` reader touches looks live to them, and dead
      # code ships to the consumer who compiles the lib alone. This is that
      # consumer's build: no test targets, no dev-dependency features
      - cargo clippy --workspace --lib -- -D warnings
      # `--lib` cannot reach `crates/view`, which has no lib target at all --
      # and it is the crate holding runtime.rs, engine_ops.rs and
      # clipboard.rs, with a dev-dependency turning `test-support` on. The
      # same feature unification therefore hides the same dead code in the
      # binary that ships
      - cargo clippy --workspace --bins -- -D warnings

  test:
    desc: Run the full test suite (requires nvim >= 0.11 on PATH)
    cmd: cargo test --workspace

  test-arms:
    desc: Run the tests of the bench feature arms the matrix measures with (bench-no-speculate and its tapped combination)
    # `task test` compiles the shipped feature set, so an arm's own tests
    # are never run by it -- and an arm the matrix measures two gated cells
    # with is a build whose behaviour is a measurement contract. The pin
    # that matters here is negative -- `the_arm_leaves_no_keystroke_pending`,
    # twin of `a_shipped_build_leaves_a_keystroke_pending`: a wiring change
    # that re-enabled prediction under the feature would put the echo rows
    # back to timing the predicted paint, and nothing on screen would look
    # wrong.
    #
    # bench-no-speculate adds no dependency features, so both legs rebuild
    # the `view` crate alone and cargo keeps each feature set's artifacts
    # side by side; the tapped combination is the echo_path decomposition's
    # arm and pulls in view-engine/view-tui's tap code as well.
    cmds:
      - cargo test -p view --features bench-no-speculate
      - cargo test -p view --features bench-taps,bench-no-speculate

  test-focus:
    desc: Run one crate or one filter's tests (task test-focus -- -p view-core speculate)
    # a target of its own rather than an argument to `test`, because CLI_ARGS
    # reaches every task in a chain: `task commit -- -m msg` calls ci, which
    # calls test, and a test target that read CLI_ARGS would hand the commit
    # message to cargo as a manifest path
    cmd: cargo test {{.CLI_ARGS}}

  audit:
    desc: Enforce crate dependency direction and the pinned engine version
    cmds:
      - bash scripts/audit-deps.sh
      - bash scripts/check-engine-pin.sh
      - bash scripts/check-budget-drift.sh
      - bash .claude/hooks/tests/validate-commands-cases.sh

  style:
    desc: Enforce comment and doc style rules
    cmd: bash scripts/check-style.sh

  loc:
    desc: Enforce the god-file ceiling (production code lines per file; split modules, separate tests)
    cmds:
      - bash scripts/audit-god-files.sh
      # the counter is only trustworthy while a second, independently written
      # one still agrees with it over every file the gate measures. The
      # interpreter is resolved rather than named: Windows runners ship
      # `python` with no `python3` alias, and a cross-check that silently
      # skipped there would leave the counter unverified on the one platform
      # whose path handling differs most.
      - bash -o pipefail -c 'scripts/crosscheck-god-files.sh'

  ci:
    desc: The full local gate; CI mirrors exactly this
    cmds:
      - task: fmt-check
      - task: lint
      - task: audit
      - task: style
      - task: loc
      - task: test
      - task: test-arms

  oracle:
    desc: Run the differential oracle corpus against the pinned nvim on every transport (task oracle -- corpus/insert-basic.toml --route local for one entry on one leg)
    # every entry runs once per transport, so wall time scales with the
    # number of legs and not just with corpus size. When this target crosses
    # ~5 minutes -- from corpus growth or a third route -- split it into a
    # default local-only leg and an all-routes leg CI runs, rather than
    # letting a per-commit gate drift toward the CI budget. `--route` is
    # already the mechanism that split would use.
    cmd: cargo run -p view-harness --bin oracle -- {{.CLI_ARGS}}

  compat:
    desc: Run the plugin compat harness against the pinned nvim (task compat -- compat/scenarios/lualine.toml for one scenario)
    cmd: cargo run -p view-harness --bin oracle -- compat {{.CLI_ARGS}}

  compat-supersede:
    desc: Assert a native takeover against the heavy fixture's live plugins (needs the compat plugin cache; run after task compat)
    # ignored by default in `task test` because a cold cache clones the whole
    # pinned plugin stack from the network; this target is the only caller
    # that opts them in, and it serializes them so two live heavy sessions
    # never contend for the same machine
    cmd: cargo test -p view-harness --test supersede_heavy -- --ignored --test-threads=1

  acceptance:
    desc: Engine-supervision, overlay-chrome visual sweep, remote-reconnect and ACP-agent conformance against a real terminal session, then the RTT-injection proof that speculative echo hides transport latency (~8 min; needs tmux, and node/npm plus agent credentials for the agent leg; the RTT leg announces a skip off controlled-linux -- CLASS=controlled-linux task acceptance takes it on a quiet host)
    # its own target rather than a step of `task ci`, on the same terms as
    # oracle, compat and bench: it drives a real pty through tmux and most
    # of its runtime is spent waiting out the very thresholds it measures,
    # which is minutes a per-commit gate cannot spend
    # each script builds the binaries it measures (scripts/acceptance/artifacts.sh)
    # rather than being handed them here: a target that built them and a
    # script that only checked they existed is exactly how a run comes to
    # measure whatever the last build left behind
    cmds:
      - bash scripts/acceptance/supervision.sh
      # the one leg that reads the escape sequences rather than the glyphs:
      # a paint test asserts on resolved styles in a `ratatui::Buffer`, and
      # every overlay-chrome defect the first dogfood session reported was
      # invisible at that layer and plain in one `capture-pane -e`
      - bash scripts/acceptance/visual-sweep.sh
      - bash scripts/acceptance/remote-reconnect.sh
      - bash scripts/acceptance/remote-rtt.sh
      # the one leg of this target that reaches the network: its first leg
      # provisions the pinned ACP adapter the way a first-run user does,
      # which is the only way to speak to a real agent rather than this
      # repo's reading of one
      - bash scripts/acceptance/ai-conformance.sh

  acceptance:visual:
    desc: The overlay-chrome visual sweep alone (~1 min; needs tmux and the pinned nvim, no network and no agent credentials -- task acceptance:visual -- 2 runs leg 2 only)
    # its own target because it is the one leg of `acceptance` a phase's exit
    # checklist can afford to run on its own: no credentials, no controlled
    # host, and it does not wait out any threshold. The full target's other
    # legs want all three, which is how a standing gate comes to be skipped.
    cmd: bash scripts/acceptance/visual-sweep.sh {{.CLI_ARGS}}

  acceptance:acp:
    desc: The ACP conformance legs that need no network or credentials (legs 2-9, driven by the local stub agent; needs tmux and the pinned nvim)
    # its own target for the reason `acceptance:visual` is one, plus a
    # sharper one: this suite went dead for three commits because a guard
    # named a source literal that had changed, and nothing ran it. Only leg
    # 1 provisions the real adapter over the network, so every other leg is
    # runnable on a CI box -- and a gate that is runnable and not run is a
    # gate that drifts. The script names the leg it is skipping.
    cmd: bash scripts/acceptance/ai-conformance.sh 2 3 4 5 6 7 8 9

  bench:
    desc: The scenario x fixture measurement matrix (task bench -- --scenario echo --fixture minimal --class dev-linux; --all --record / --gate)
    # the ship guard on the no-speculate arm refuses an optimized build that
    # does not name the campaign it is for (crates/view/src/speculate.rs),
    # and this is the campaign: the echo rows measure that arm, so this is
    # the one target that legitimately wants an optimized binary with the
    # prediction compiled out of it
    env:
      VIEW_BENCH_NO_SPECULATE: "1"
    cmds:
      - cargo build --release -p view
      # separate target dir so the instrumented build can never overwrite
      # the plain binary the e2e rows measure
      - cargo build --release -p view --features bench-taps --target-dir target/taps
      # the echo rows' arm, in a third target dir for the same reason: it
      # predicts nothing, so those rows keep timing the engine round trip
      # they are defined as rather than the predicted paint the shipped
      # binary answers a keystroke with first (see Bins::echo_bins)
      - cargo build --release -p view --features bench-no-speculate --target-dir target/nospec
      # the echo_path decomposition splits the echo row's own interval, so
      # it runs that row's arm with the tap channel added; a fourth target
      # dir for the same reason as the third
      - cargo build --release -p view --features bench-taps,bench-no-speculate --target-dir target/taps-nospec
      # the agent the AI rows measure a live turn against: a fixture that
      # streams on a cadence the row controls, so the rows need no network,
      # no credentials and no pinned adapter to put a turn in flight. Its
      # own target dir for the same reason the arms above have theirs: it
      # is the one build here that enables a feature on a crate the
      # measured binaries link, and a shared dir would rebuild view-ai
      # under and out of `test-support` around every bench run
      - cargo build --release -p view-ai --features test-support --bin view-ai-stub-agent --target-dir target/stub-agent
      # the exit code is echoed as this target's own final log line, on
      # every path (pass, gate breach, refusal), so a tee'd gate log is
      # self-describing without a reader having to interpret the bench
      # binary's own verdict text; forwarded via `exit` so the true code
      # still reaches task's own caller
      - >-
        cargo run --release -p view-harness --bin bench -- {{.CLI_ARGS}};
        code=$?; echo "bench wrapper exit: $code"; exit $code

  bench-micro:
    desc: Hot-path micro-benches (grid apply, key dispatch, damage fold, render)
    cmds:
      - cargo bench -p view-core --bench grid_apply
      - cargo bench -p view-core --bench update_key
      - cargo bench -p view-core --bench input_handoff
      - cargo bench -p view-engine --bench damage_fold --features bench-support
      - cargo bench -p view-surface --bench render_frame
      - cargo bench -p view-tui --bench paint_frame

  heartbeat-ab:
    desc: Paired echo/input_path campaign, heartbeat prober armed vs compiled out (crates/view-harness/tests/heartbeat_cost.rs)
    # the ship guard on the no-heartbeat arm refuses an optimized build that
    # does not name the campaign it is for (view-engine/src/process.rs), and
    # this is the campaign: the variable is set here, in the one target that
    # legitimately wants a binary with no read-side supervision in it. The
    # echo row measures the no-speculate arm, so this target builds that one
    # too and carries its guard variable for the same reason
    env:
      VIEW_BENCH_NO_HEARTBEAT: "1"
      VIEW_BENCH_NO_SPECULATE: "1"
    cmds:
      # the plain binary is not measured by either row, but the bench binary
      # resolves it before any row runs and refuses a run without it
      - cargo build --release -p view
      # one target dir per arm: the counterfactual binary must never be able
      # to overwrite the one the other arm measures, and a shared dir would
      # rebuild both on every feature flip
      - cargo build --release -p view --features bench-taps --target-dir target/taps
      - cargo build --release -p view --features bench-taps,bench-no-heartbeat --target-dir target/taps-no-heartbeat
      # the echo row's two arms. Its boundary is the typed glyph on screen,
      # which a predicting build answers before the engine does, so measuring
      # the heartbeat's cost there means measuring it on the pair of builds
      # that predict nothing -- otherwise both arms time the same painted
      # glyph and the campaign reports a difference it never measured
      - cargo build --release -p view --features bench-no-speculate --target-dir target/nospec
      - cargo build --release -p view --features bench-no-speculate,bench-no-heartbeat --target-dir target/nospec-no-heartbeat
      - cargo build --release -p view-harness --bin bench
      - cargo test -p view-harness --release --test heartbeat_cost -- --ignored --nocapture

  perf-audit:
    desc: Pre-release / post-strangle gate — full bench matrix gated on the local dev class (~28 min), then the heartbeat armed-vs-absent campaign (five release builds plus four 400-sample cells; AB=skip drops it), then every hot-path micro-bench (task perf-audit CLASS=dev-linux AB=skip)
    vars:
      CLASS: '{{.CLASS | default "dev-linux"}}'
      AB: '{{.AB | default "run"}}'
    cmds:
      # a shell chain (not three `task:` steps) so the exit code below can
      # be captured and echoed as this target's own final log line on every
      # path; `&&` preserves the original fail-fast semantics (nothing later
      # runs if the matrix itself failed), and `exit` forwards the true code
      # to task's own caller.
      #
      # The A/B campaign runs here rather than nowhere: it is the only thing
      # that holds the heartbeat's cost to what this class can resolve, and
      # a claim nothing ever re-checks decays. It is skippable because it
      # costs its own campaign on top of an already long gate, and a
      # pre-release run that never finishes is worth less than one that
      # states what it left out -- which the skip line does, in the log.
      - >-
        task bench CLI_ARGS="--all --class {{.CLASS}} --gate"
        && { if [ "{{.AB}}" = skip ]; then
        echo "perf-audit: heartbeat A/B campaign skipped (AB=skip)";
        else task heartbeat-ab; fi; }
        && task bench-micro;
        code=$?; echo "perf-audit wrapper exit: $code"; exit $code

  commit:
    desc: Gated commit — runs the ci chain first
    cmds:
      - task: ci
      - git add -A
      - git commit {{.CLI_ARGS}}

  release:init:
    desc: Scaffold .anodizer.yaml — run once, then review the generated config
    cmd: anodizer init

  release:check:
    desc: Dry-run the release — validate config and would-be artifacts, no tag, no publish
    # placeholder until release:init lands .anodizer.yaml; its build and
    # changelog blocks are what the dry-run resolves against
    cmd: anodizer check

  release:tag:
    desc: Cut the release tag, changelog generated from commit subjects — never hand-edit CHANGELOG.md
    cmd: anodizer tag --changelog

  release:publish:
    desc: The real release — build, sign, publish to GitHub Releases (runs the ci gate first)
    cmds:
      - task: ci
      # placeholder; .anodizer.yaml's target, signing and release blocks
      # drive what gets built and published
      - anodizer publish

  release:verify:
    desc: Verify the published artifacts and signatures against the cut release
    # placeholder; verifies whatever release .anodizer.yaml describes once
    # release:init scaffolds it
    cmd: anodizer verify

  mutate:
    desc: "Prove a battery of guards load-bearing: each row is deleted, its tests run, the file restored (task mutate -- .claude/mutations/task-19.tsv)"
    cmd: scripts/mutate.sh {{.CLI_ARGS}}

  clean-cache:
    desc: "Reclaim build-cache bloat: incremental output, foreign-target trees, then sweep target/ down to the size ceiling (task clean-cache MAXSIZE=8)"
    vars:
      MAXSIZE: '{{.MAXSIZE | default "10"}}'
    cmds:
      - df -h . | tail -1
      - rm -rf target/debug/incremental target/release/incremental
      - find target -maxdepth 1 -type d \( -name 'x86_64-*' -o -name 'aarch64-*' \) -exec rm -rf {} +
      - cargo sweep --maxsize {{.MAXSIZE}} || true
      - df -h . | tail -1
